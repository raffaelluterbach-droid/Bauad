// ---------- Kostenvoranschlag als PDF ----------
async function baueKvPdf(ctx) {
  const { ks, projekt, rollen, umfang, mitMwst, db: ctxDb } = ctx;
  const voll = umfang === "voll";
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40), rot = PDFLib.rgb(0.86, 0.15, 0.15), gruen = PDFLib.rgb(0.08, 0.50, 0.24);
  const format = voll ? A4Q : A4;
  const bl = pdfBlatt(doc, schriften, format, vorlage, logoBild);
  const rechts = format.breite - RAND;
  const satz = Number(ks.satz) || 8.1;
  const f = (n) => mitMwst ? (Number(n) || 0) * (1 + satz / 100) : (Number(n) || 0);
  pdfKopf(bl, voll ? "Kostenübersicht" : "Kostenvoranschlag", projekt, rollen,
    mitMwst ? `alle Beträge inkl. MwSt ${satz}%` : "alle Beträge exkl. MwSt", vorlage);

  // Spalten
  const spalten = voll
    ? [{ l: "KV", w: 78, f: (z) => chfPdf(f(z.roll.kv)) },
       { l: "KV revidiert", w: 82, f: (z) => chfPdf(f(z.roll.kvRevidiert)) },
       { l: "Beauftragt", w: 82, f: (z) => chfPdf(f(z.roll.beauftragt)) },
       { l: "Erwartung", w: 74, f: (z) => z.roll.erwartung ? chfPdf(f(z.roll.erwartung)) : "–" },
       { l: "Prognose", w: 82, f: (z) => chfPdf(f(z.roll.prognose)), fett: true },
       { l: "Abw. KV", w: 78, f: (z) => chfPdf(f(z.roll.abwKv)), ampel: (z) => z.roll.abwKv }]
    : [{ l: "KV revidiert", w: 110, f: (z) => chfPdf(f(z.roll.kvRevidiert)), fett: true }];
  const gesamtW = spalten.reduce((a, c) => a + c.w, 0);
  const textB = rechts - RAND - gesamtW;
  const spX = (i) => RAND + textB + spalten.slice(0, i + 1).reduce((a, c) => a + c.w, 0);

  const kopfZeile = () => {
    spalten.forEach((c, i) => bl.text(c.l, { rechts: spX(i) - 4, size: 7.5, farbe: grau }));
    bl.y -= 5; bl.linie(RAND, rechts, bl.y, 0.8, PDFLib.rgb(0.55, 0.52, 0.50)); bl.y -= 12;
  };
  kopfZeile();

  ks.ordered.forEach((z) => {
    if (bl.y - 16 < RAND + 40) { bl.neueSeite(); pdfKopf(bl, voll ? "Kostenübersicht" : "Kostenvoranschlag", projekt, rollen, "Fortsetzung", vorlage); kopfZeile(); }
    const gruppe = z.hasChildren;
    const size = gruppe ? 9 : 8.5;
    bl.text(z.pos.bkp, { x: RAND + 4 + z.depth * 12, size, fett: gruppe });
    const bez = bl.umbruch(z.pos.bezeichnung, textB - 60 - z.depth * 12, size, gruppe)[0] || "";
    bl.text(bez, { x: RAND + 46 + z.depth * 12, size, fett: gruppe });
    spalten.forEach((c, i) => {
      let farbe;
      if (c.ampel) { const v = c.ampel(z); farbe = v > 0 ? rot : (v < 0 ? gruen : grau); }
      bl.text(c.f(z), { rechts: spX(i) - 4, size, fett: gruppe || c.fett, farbe });
    });
    bl.y -= gruppe ? 15 : 13;
    if (gruppe) bl.linie(RAND, rechts, bl.y + 5, 0.3, PDFLib.rgb(0.91, 0.90, 0.89));
  });

  // Summen
  bl.platz(60);
  bl.y -= 4; bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); bl.y -= 15;
  bl.text("Total", { size: 10, fett: true });
  spalten.forEach((c, i) => bl.text(c.f({ roll: ks.total, pos: {}, depth: 0 }), { rechts: spX(i) - 4, size: 10, fett: true }));
  bl.y -= 20;
  if (!mitMwst) {
    const basis = voll ? ks.total.prognose : ks.total.kvRevidiert;
    bl.text(`MwSt ${satz}%`, { size: 9, farbe: grau });
    bl.text(chfPdf(basis * satz / 100), { rechts, size: 9, farbe: grau });
    bl.y -= 14;
    bl.text("Total inkl. MwSt", { size: 10, fett: true });
    bl.text("CHF " + chfPdf(basis * (1 + satz / 100)), { rechts, size: 10, fett: true });
  }
  bl.abschliessen();
  return doc.save();
}

// ---------- Leistungsverzeichnis als PDF ----------
async function baueLvPdf(a, ctx) {
  const { projekt, rollen, bieterName, db: ctxDb } = ctx;
  const bieter = bieterName ? (a.bieter || []).find((b) => b.name === bieterName) : null;
  const mitPreisen = !!bieter;
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40);
  const bl = pdfBlatt(doc, schriften, A4, vorlage, logoBild);
  const rechts = A4.breite - RAND;
  pdfKopf(bl, "Leistungsverzeichnis", projekt, rollen, a.titel + (mitPreisen ? `  ·  ${bieter.name}` : "  ·  Ausschreibungsexemplar"), vorlage);

  const sp = { code: RAND, bez: RAND + 62, menge: RAND + 330, einheit: RAND + 372, ep: RAND + 445, betrag: rechts };
  const kopfZeile = () => {
    bl.text("NPK", { x: sp.code, size: 7.5, farbe: grau });
    bl.text("Bezeichnung", { x: sp.bez, size: 7.5, farbe: grau });
    bl.text("Menge", { rechts: sp.menge, size: 7.5, farbe: grau });
    bl.text("Einh.", { x: sp.einheit, size: 7.5, farbe: grau });
    bl.text("Einheitspreis", { rechts: sp.ep, size: 7.5, farbe: grau });
    bl.text("Betrag", { rechts: sp.betrag, size: 7.5, farbe: grau });
    bl.y -= 5; bl.linie(RAND, rechts, bl.y, 0.8, PDFLib.rgb(0.55, 0.52, 0.50)); bl.y -= 12;
  };
  kopfZeile();

  let total = 0, ausserhalb = 0;
  (a.positionen || []).forEach((pz) => {
    if (bl.y - 18 < RAND + 50) { bl.neueSeite(); pdfKopf(bl, "Leistungsverzeichnis", projekt, rollen, "Fortsetzung", vorlage); kopfZeile(); }
    const menge = Number(pz.menge) || 0;
    const ep = mitPreisen ? parseBetrag((bieter.preise || {})[pz.code]) || 0 : null;
    const betrag = mitPreisen ? menge * ep : null;
    if (mitPreisen) { if (istGewertet(pz)) total += betrag; else ausserhalb += betrag; }
    bl.text(pz.npk || pz.code || "", { x: sp.code, size: 8 });
    const kurz = (POSARTEN.find((x) => x.k === (pz.art || "normal")) || {}).kurz;
    const zln = bl.umbruch((kurz ? kurz + " · " : "") + (pz.bezeichnung || ""), sp.menge - sp.bez - 50, 8.5);
    bl.text(zln[0] || "", { x: sp.bez, size: 8.5, fett: !!kurz });
    bl.text(menge ? menge.toLocaleString("de-CH") : "", { rechts: sp.menge, size: 8.5 });
    bl.text(pz.einheit || "", { x: sp.einheit, size: 8 });
    if (mitPreisen) {
      bl.text(chfPdf(ep), { rechts: sp.ep, size: 8.5 });
      bl.text(chfPdf(betrag), { rechts: sp.betrag, size: 8.5 });
    } else {
      // leere Felder zum Ausfüllen
      bl.linie(sp.ep - 60, sp.ep, bl.y - 2, 0.4);
      bl.linie(sp.betrag - 70, sp.betrag, bl.y - 2, 0.4);
    }
    bl.y -= 12;
    if (zln[1]) { bl.text(zln[1], { x: sp.bez, size: 7.5, farbe: grau }); bl.y -= 10; }
    (pz.langtext || []).filter(Boolean).forEach((lt) => bl.umbruch(lt, sp.menge - sp.bez - 50, 7).forEach((t) => { bl.platz(10); bl.text(t, { x: sp.bez, size: 7, farbe: grau }); bl.y -= 9; }));
    if (pz.fabrikat) { bl.platz(10); bl.text("Fabrikat / Typ: " + pz.fabrikat, { x: sp.bez, size: 7, farbe: grau }); bl.y -= 9; }
    bl.linie(RAND, rechts, bl.y + 4, 0.25, PDFLib.rgb(0.93, 0.92, 0.91));
  });

  bl.platz(50);
  bl.y -= 6; bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); bl.y -= 16;
  if (mitPreisen) {
    bl.text("Total netto (gewertete Positionen)", { size: 10.5, fett: true });
    bl.text("CHF " + chfPdf(total), { rechts, size: 10.5, fett: true });
    if (ausserhalb) {
      bl.y -= 15;
      bl.text("Eventual- und Per-Positionen (nicht im Total)", { size: 9, farbe: grau });
      bl.text("CHF " + chfPdf(ausserhalb), { rechts, size: 9, farbe: grau });
    }
  } else {
    bl.text("Total netto", { size: 10.5, fett: true });
    bl.linie(rechts - 120, rechts, bl.y - 2, 0.5);
    bl.y -= 26;
    bl.text("Datum / Firma / Unterschrift", { size: 8, farbe: grau });
    bl.linie(RAND, RAND + 260, bl.y - 14, 0.5);
  }
  if (a.bedingungen) {
    bl.y -= 26; bl.platz(50);
    bl.text("Besondere Bestimmungen", { size: 7.5, farbe: grau }); bl.y -= 12;
    String(a.bedingungen).split("\n").forEach((abs) => {
      bl.umbruch(abs, rechts - RAND, 8).forEach((t) => { bl.platz(12); bl.text(t, { size: 8, farbe: grau }); bl.y -= 10; });
    });
  }
  bl.abschliessen();
  return doc.save();
}

// ---------- Vergabeantrag im Querformat ----------
const VA_MAX_SPALTEN = 6;

async function baueVergabeantragPdf(a, ctx) {
  const { projekt, rollen, ks, d, vorschlagName, db: ctxDb } = ctx;
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40), rot = PDFLib.rgb(0.86, 0.15, 0.15), gruen = PDFLib.rgb(0.08, 0.50, 0.24);

  const nw = nutzwerte(a, projekt);
  const reihen = nw.rows;
  const guenstigst = reihen.length ? Math.min(...reihen.filter((r) => r.netto > 0).map((r) => r.netto)) : 0;
  const pos = d.positionen.find((x) => x.id === a.positionId) || null;
  const z = pos ? ks.ordered.find((x) => x.pos.id === pos.id) : null;
  const kv = z ? z.roll.kvRevidiert : 0;

  // Zeilen des Vergleichs
  const zeilen = [
    { l: "Angebot brutto", f: (r) => chfPdf(r.brutto), kv: kv ? chfPdf(kv) : "–" },
    { l: "Rabatt", f: (r) => Number(r.b.rabattPct) ? r.b.rabattPct + "%" : "–", klein: true },
    { l: "Pauschalabzug", f: (r) => Number(r.b.pauschalabzug) ? chfPdf(r.b.pauschalabzug) : "–", klein: true },
    { l: "Skonto", f: (r) => Number(r.b.skontoPct) ? r.b.skontoPct + "%" : "–", klein: true },
    { l: "Bauabzüge", f: (r) => Number(r.b.bauabzuegePct) ? r.b.bauabzuegePct + "%" : "–", klein: true },
    { l: "Rundung", f: (r) => Number(r.b.rundung) ? chfPdf(r.b.rundung) : "–", klein: true },
    { l: "Angebot netto", f: (r) => chfPdf(r.netto), fett: true, linieVor: true, kv: kv ? chfPdf(kv) : "–" },
    { l: "gegenüber Bestbieter", f: (r) => guenstigst > 0 && r.netto > 0 ? pct(100 * (r.netto - guenstigst) / guenstigst) : "–", ampel: true },
    { l: "gegenüber KV revidiert", f: (r) => kv > 0 && r.netto > 0 ? chfPdf(r.netto - kv) : "–", ampelBetrag: true },
    { l: "Referenzpunkte", f: (r) => String(Number(r.b.referenzPunkte) || 0), klein: true, linieVor: true },
    { l: "Lehrlingspunkte", f: (r) => String(Number(r.b.lehrlingPunkte) || 0), klein: true },
    { l: "Nutzwert", f: (r) => (Number(r.nutz) || 0).toFixed(1), fett: true },
  ];

  const blaetter = [];
  const gruppen = [];
  for (let i = 0; i < reihen.length; i += VA_MAX_SPALTEN) gruppen.push(reihen.slice(i, i + VA_MAX_SPALTEN));
  if (!gruppen.length) gruppen.push([]);

  for (let gi = 0; gi < gruppen.length; gi++) {
    const gruppe = gruppen[gi];
    const bl = pdfBlatt(doc, schriften, A4Q, vorlage, logoBild);
    blaetter.push(bl);
    const rechts = A4Q.breite - RAND;
    pdfKopf(bl, "Vergabeantrag", projekt, rollen, a.titel + (gruppen.length > 1 ? `  (Blatt ${gi + 1} von ${gruppen.length})` : ""));

    const labelB = 165, kvB = kv ? 95 : 0;
    const start = RAND + labelB + kvB;
    const spB = Math.max(80, (rechts - start) / Math.max(gruppe.length, 1));
    const spX = (i) => start + i * spB + spB - 8;   // rechte Kante der Spalte

    // Kopfzeile: Anbieternamen
    let kopfY = bl.y;
    if (kv) bl.text("KV revidiert", { rechts: RAND + labelB + kvB - 8, y: kopfY, size: 8, fett: true, farbe: grau });
    gruppe.forEach((r, i) => {
      const nameZeilen = bl.umbruch(r.b.name, spB - 10, 8.5, true).slice(0, 2);
      nameZeilen.forEach((zl, k) => bl.text(zl, { rechts: spX(i), y: kopfY - k * 10, size: 8.5, fett: true }));
    });
    bl.y = kopfY - 24;
    bl.linie(RAND, rechts, bl.y + 6, 0.8, PDFLib.rgb(0.55, 0.52, 0.50));

    // Zeilen
    zeilen.forEach((zl) => {
      if (zl.linieVor) { bl.y -= 3; bl.linie(RAND, rechts, bl.y + 8, 0.4); }
      bl.platz(16);
      const size = zl.klein ? 8 : 9;
      bl.text(zl.l, { size, fett: zl.fett, farbe: zl.klein ? grau : undefined });
      if (kv) bl.text(zl.kv || "", { rechts: RAND + labelB + kvB - 8, size, farbe: grau });
      gruppe.forEach((r, i) => {
        const wert = zl.f(r);
        let farbe;
        if (zl.ampel) farbe = wert === "–" ? grau : (parseFloat(wert) > 0 ? rot : gruen);
        if (zl.ampelBetrag) { const v = kv > 0 ? r.netto - kv : 0; farbe = wert === "–" ? grau : (v > 0 ? rot : gruen); }
        bl.text(wert, { rechts: spX(i), size, fett: zl.fett, farbe });
      });
      bl.y -= zl.klein ? 13 : 15;
    });

    // Bemerkungen
    bl.y -= 6; bl.linie(RAND, rechts, bl.y + 8, 0.4);
    bl.platz(40);
    bl.text("Bemerkung", { size: 8, farbe: grau });
    const bemY = bl.y;
    let tiefste = bemY;
    gruppe.forEach((r, i) => {
      const zln = bl.umbruch(r.b.bemerkung || "–", spB - 10, 7.5).slice(0, 4);
      zln.forEach((t, k) => bl.text(t, { rechts: spX(i), y: bemY - k * 9, size: 7.5, farbe: grau }));
      tiefste = Math.min(tiefste, bemY - (zln.length - 1) * 9);
    });
    bl.y = tiefste - 20;

    // Vergabevorschlag — knapp, nur auf dem letzten Blatt
    if (gi === gruppen.length - 1) {
      const sieger = reihen.find((r) => r.b.name === vorschlagName) || reihen[0] || null;
      const kastenB = 300, kastenH = 62;
      const kx = rechts - kastenB, ky = Math.max(RAND, bl.y - kastenH);
      bl.seite.drawRectangle({ x: kx, y: ky, width: kastenB, height: kastenH, borderWidth: 1.4, borderColor: PDFLib.rgb(0.13, 0.12, 0.11) });
      bl.text("Vergabevorschlag", { x: kx + 12, y: ky + kastenH - 18, size: 8, farbe: grau });
      if (sieger) {
        bl.text(sieger.b.name, { x: kx + 12, y: ky + kastenH - 36, size: 12, fett: true });
        bl.text("Vergabesumme netto", { x: kx + 12, y: ky + 12, size: 8, farbe: grau });
        bl.text("CHF " + chfPdf(sieger.netto), { rechts: kx + kastenB - 12, y: ky + 11, size: 11, fett: true });
      } else {
        bl.text("kein Anbieter erfasst", { x: kx + 12, y: ky + kastenH - 36, size: 10, farbe: grau });
      }
    }
  }
  blaetter.forEach((b) => b.abschliessen());
  return doc.save();
}

// ---------- Positionsvergleich (Querformat) ----------
async function bauePositionsvergleichPdf(a, ctx) {
  const { projekt, rollen, db: ctxDb } = ctx;
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40), rot = PDFLib.rgb(0.86, 0.15, 0.15), gruen = PDFLib.rgb(0.08, 0.50, 0.24);
  const bieter = (a.bieter || []).filter((b) => b.name);
  const positionen = a.positionen || [];
  const blaetter = [];
  const gruppen = [];
  for (let i = 0; i < bieter.length; i += VA_MAX_SPALTEN) gruppen.push(bieter.slice(i, i + VA_MAX_SPALTEN));
  if (!gruppen.length) gruppen.push([]);

  for (let gi = 0; gi < gruppen.length; gi++) {
    const gruppe = gruppen[gi];
    const bl = pdfBlatt(doc, schriften, A4Q, vorlage, logoBild);
    blaetter.push(bl);
    const rechts = A4Q.breite - RAND;
    const labelB = 250, spB = Math.max(95, (rechts - RAND - labelB) / Math.max(gruppe.length, 1));
    const spR = (i) => RAND + labelB + i * spB + spB - 8;

    const kopf = (fortsetzung) => {
      pdfKopf(bl, "Positionsvergleich", projekt, rollen, a.titel + (gruppen.length > 1 ? `  (Blatt ${gi + 1} von ${gruppen.length})` : "") + (fortsetzung ? "  ·  Fortsetzung" : ""));
      const y0 = bl.y;
      bl.text("NPK · Bezeichnung", { size: 7.5, farbe: grau, y: y0 });
      bl.text("Menge", { rechts: RAND + labelB - 8, size: 7.5, farbe: grau, y: y0 });
      gruppe.forEach((b, i) => bl.umbruch(b.name, spB - 10, 8, true).slice(0, 2).forEach((zl, k) => bl.text(zl, { rechts: spR(i), y: y0 - k * 9, size: 8, fett: true })));
      bl.y = y0 - 22;
      bl.linie(RAND, rechts, bl.y + 6, 0.8, PDFLib.rgb(0.55, 0.52, 0.50));
    };
    kopf(false);

    const totale = gruppe.map((b) => positionen.reduce((s, pz) => s + (Number(pz.menge) || 0) * (parseBetrag((b.preise || {})[pz.code]) || 0), 0));

    positionen.forEach((pz) => {
      if (bl.y - 30 < RAND + 60) { bl.neueSeite(); kopf(true); }
      const menge = Number(pz.menge) || 0;
      const preise = gruppe.map((b) => parseBetrag((b.preise || {})[pz.code]) || 0);
      const gueltig = preise.filter((x) => x > 0);
      const min = gueltig.length ? Math.min(...gueltig) : 0;
      bl.text(pz.npk || pz.code || "", { size: 7.5, farbe: grau });
      bl.text(bl.umbruch(pz.bezeichnung || "", labelB - 115, 8.5)[0] || "", { x: RAND + 48, size: 8.5 });
      bl.text(`${menge.toLocaleString("de-CH")} ${pz.einheit || ""}`, { rechts: RAND + labelB - 8, size: 8, farbe: grau });
      preise.forEach((ep, i) => {
        if (!ep) { bl.text("–", { rechts: spR(i), size: 8.5, farbe: grau }); return; }
        const auf = min > 0 ? 100 * (ep - min) / min : 0;
        bl.text(chfPdf(ep), { rechts: spR(i), size: 8.5 });
        bl.text(chfPdf(menge * ep), { rechts: spR(i), y: bl.y - 9, size: 7.5, farbe: grau });
        bl.text(pct(auf), { rechts: spR(i) - 62, y: bl.y - 9, size: 7.5, farbe: auf > 0 ? rot : gruen });
      });
      bl.y -= 22;
      bl.linie(RAND, rechts, bl.y + 6, 0.25, PDFLib.rgb(0.93, 0.92, 0.91));
    });

    bl.platz(46);
    bl.y -= 4; bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); bl.y -= 16;
    const gueltigT = totale.filter((x) => x > 0);
    const minTotal = gueltigT.length ? Math.min(...gueltigT) : 0;
    bl.text("Total netto", { size: 10, fett: true });
    totale.forEach((t, i) => {
      bl.text(chfPdf(t), { rechts: spR(i), size: 10, fett: true });
      if (t > 0 && minTotal > 0) {
        const auf = 100 * (t - minTotal) / minTotal;
        bl.text(pct(auf), { rechts: spR(i), y: bl.y - 11, size: 8, farbe: auf > 0 ? rot : gruen });
      }
    });
    bl.y -= 26;
    bl.text("Prozentwerte je Position gegenüber dem günstigsten Angebot dieser Position.", { size: 7.5, farbe: grau });
  }
  blaetter.forEach((b) => b.abschliessen());
  return doc.save();
}

// ---------- Bauabrechnung als PDF (Querformat, Spalten wählbar) ----------
async function baueAbrechnungPdf(ctx) {
  const { ks, projekt, rollen, brutto, spalten, artImPdf, details, db: ctxDb } = ctx;
  const artVon = (kind) => (kind === "nt" || kind === "teuerung" ? "vertrag" : kind);
  const mitDetails = Object.values(artImPdf || {}).some(Boolean);
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40), rot = PDFLib.rgb(0.86, 0.15, 0.15), gruen = PDFLib.rgb(0.08, 0.50, 0.24);
  const satz = Number(ks.satz) || 8.1;
  const f = brutto ? 1 + satz / 100 : 1;
  const bl = pdfBlatt(doc, schriften, A4Q, vorlage, logoBild);
  const rechts = A4Q.breite - RAND;

  const moegliche = [
    { k: "kv", l: "KV", g: (z) => z.roll.kv },
    { k: "kvRevidiert", l: "KV revidiert", g: (z) => z.roll.kvRevidiert },
    { k: "beauftragt", l: "Beauftragt", g: (z) => z.roll.beauftragt },
    { k: "erwartung", l: "Erwartung", g: (z) => z.roll.erwartung },
    { k: "prognose", l: "Prognose", g: (z) => z.roll.prognose, fett: true },
    { k: "bezahlt", l: "Bezahlt", g: (z) => z.roll.bezahlt },
    { k: "abwKv", l: "Abw. KV", g: (z) => z.roll.abwKv, ampel: true },
  ];
  const cols = moegliche.filter((c) => spalten[c.k]);
  const spW = 92, gesamtW = cols.length * spW, textB = rechts - RAND - gesamtW;
  const spR = (i) => RAND + textB + (i + 1) * spW - 6;

  const kopf = (fortsetzung) => {
    pdfKopf(bl, "Bauabrechnung", projekt, rollen, (brutto ? `alle Beträge inkl. MwSt ${satz}%` : "alle Beträge exkl. MwSt") + (fortsetzung ? "  ·  Fortsetzung" : ""), vorlage);
    cols.forEach((c, i) => bl.text(c.l, { rechts: spR(i), size: 7.5, farbe: grau }));
    bl.y -= 5; bl.linie(RAND, rechts, bl.y, 0.8, PDFLib.rgb(0.55, 0.52, 0.50)); bl.y -= 12;
  };
  kopf(false);

  ks.ordered.forEach((z) => {
    if (bl.y - 18 < RAND + 50) { bl.neueSeite(); kopf(true); }
    const gruppe = z.hasChildren;
    const size = gruppe ? 9 : 8.5;
    bl.text(z.pos.bkp, { x: RAND + 4 + z.depth * 12, size, fett: gruppe });
    bl.text(bl.umbruch(z.pos.bezeichnung, textB - 62 - z.depth * 12, size, gruppe)[0] || "", { x: RAND + 46 + z.depth * 12, size, fett: gruppe });
    cols.forEach((c, i) => {
      const v = (Number(c.g(z)) || 0) * f;
      let farbe;
      if (c.ampel) farbe = v > 0 ? rot : (v < 0 ? gruen : grau);
      bl.text(c.ampel && v !== 0 ? (v > 0 ? "+" : "") + chfPdf(v) : chfPdf(v), { rechts: spR(i), size, fett: gruppe || c.fett, farbe });
    });
    bl.y -= gruppe ? 15 : 13;

    // Gewählte Detailzeilen unter der Position
    if (mitDetails) {
      const spalteFuer = { rg: "bezahlt", vertrag: "beauftragt", nt: "beauftragt", teuerung: "beauftragt", rap: "beauftragt", erw: "erwartung", mut: "kvRevidiert", umb: "kvRevidiert" };
      const zeilen = (details[z.pos.id] || []).filter((it) => artImPdf[artVon(it.kind)]);
      zeilen.forEach((it) => {
        if (bl.y - 14 < bl.untenRand + 20) { bl.neueSeite(); kopf(true); }
        bl.text(`· ${it.label}`, { x: RAND + 62 + z.depth * 12, size: 7.5, farbe: grau });
        bl.text(it.sub || "", { x: RAND + 250 + z.depth * 12, size: 7, farbe: grau });
        let iBez = cols.findIndex((c) => c.k === spalteFuer[it.kind]);
        if (iBez < 0) iBez = cols.length - 1;
        const wert = (Number(it.betrag) || 0) * f;
        bl.text((it.signed && wert > 0 ? "+" : "") + chfPdf(wert), { rechts: spR(iBez), size: 7.5, farbe: grau });
        bl.y -= 11;
      });
      if (zeilen.length) bl.linie(RAND + 50, rechts, bl.y + 4, 0.25, PDFLib.rgb(0.93, 0.92, 0.91));
    }
    if (gruppe) bl.linie(RAND, rechts, bl.y + 5, 0.3, PDFLib.rgb(0.91, 0.90, 0.89));
  });

  // Summen
  bl.platz(70);
  bl.y -= 4; bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); bl.y -= 16;
  bl.text("Total", { size: 10, fett: true });
  cols.forEach((c, i) => {
    const v = (Number(c.g({ roll: ks.total })) || 0) * f;
    let farbe;
    if (c.ampel) farbe = v > 0 ? rot : (v < 0 ? gruen : grau);
    bl.text(c.ampel && v !== 0 ? (v > 0 ? "+" : "") + chfPdf(v) : chfPdf(v), { rechts: spR(i), size: 10, fett: true, farbe });
  });
  bl.y -= 20;
  if (!brutto) {
    bl.text(`MwSt ${satz}% auf Prognose`, { size: 9, farbe: grau });
    bl.text(chfPdf(ks.total.prognose * satz / 100), { rechts, size: 9, farbe: grau });
    bl.y -= 14;
    bl.text("Prognose inkl. MwSt", { size: 10, fett: true });
    bl.text("CHF " + chfPdf(ks.total.prognose * (1 + satz / 100)), { rechts, size: 10, fett: true });
  }
  bl.abschliessen();
  return doc.save();
}

// ---------- Vergütungsaufträge ----------
// Zahlen für das Deckblatt einer Rechnung: Vertragsstaffel, sonst Positionsbudget
function belegStaffel(r, d, ks) {
  const v = d.vertraege.find((x) => x.id === r.vertragId) || null;
  const betrag = Number(r.betrag) || 0;
  if (v) {
    const ntG = d.nachtraege.filter((n) => n.vertragId === v.id && n.status === "genehmigt").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
    const summe = konditionenNetto(v.betrag, v, true) + ntG + (Number(v.teuerung) || 0);
    const vorher = d.rechnungen.filter((x) => x.vertragId === v.id && x.id !== r.id && x.datum <= r.datum).reduce((s, x) => s + (Number(x.betrag) || 0), 0);
    return { art: "vertrag", v, bezug: "Werkvertrag" + (v.nr ? " " + v.nr : ""), summe, vorher, betrag, total: vorher + betrag, offen: summe - vorher - betrag };
  }
  const pos = d.positionen.find((x) => x.id === r.positionId) || null;
  const z = pos ? ks.ordered.find((x) => x.pos.id === pos.id) : null;
  const summe = z ? z.roll.kvRevidiert : 0;
  const vorher = d.rechnungen.filter((x) => x.positionId === r.positionId && x.id !== r.id && x.datum <= r.datum).reduce((s, x) => s + (Number(x.betrag) || 0), 0);
  return { art: "position", v: null, bezug: pos ? `BKP ${pos.bkp} ${pos.bezeichnung}` : "ohne Zuordnung", summe, vorher, betrag, total: vorher + betrag, offen: summe - vorher - betrag };
}

// Baut das Gesamtdokument: Startseite, dann je Rechnung Deckblatt + angehängtes Unternehmer-PDF
async function baueVergauftragPdf(auftrag, rechnungen, ctx) {
  const { d, ks, projekt, rollen, firmen, satz, db: ctxDb } = ctx;
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40);
  const rechts = A4.breite - RAND;

  // ---- Startseite: schlanke Zusammenstellung ----
  const bl = pdfBlatt(doc, schriften, A4, vorlage, logoBild);
  pdfKopf(bl, "Vergütungsauftrag", projekt, rollen, `${auftrag.nr || ""}  ·  ${auftrag.datum || today()}`, vorlage);

  const sp = { bnr: RAND, datum: RAND + 52, firma: RAND + 112, nr: RAND + 268, netto: RAND + 375, mwst: RAND + 448, brutto: rechts };
  bl.text("Buchung", { x: sp.bnr, size: 7.5, farbe: grau });
  bl.text("Datum", { x: sp.datum, size: 7.5, farbe: grau });
  bl.text("Unternehmer / Buchung", { x: sp.firma, size: 7.5, farbe: grau });
  bl.text("Rg-Nr.", { x: sp.nr, size: 7.5, farbe: grau });
  bl.text("Netto", { rechts: sp.netto, size: 7.5, farbe: grau });
  bl.text("MwSt", { rechts: sp.mwst, size: 7.5, farbe: grau });
  bl.text("Brutto", { rechts: sp.brutto, size: 7.5, farbe: grau });
  bl.y -= 5; bl.linie(RAND, rechts); bl.y -= 12;

  let sumNetto = 0;
  rechnungen.forEach((r) => {
    bl.platz(30);
    const v = d.vertraege.find((x) => x.id === r.vertragId);
    const pos = d.positionen.find((x) => x.id === r.positionId);
    const netto = Number(r.betrag) || 0, mwst = netto * satz / 100;
    sumNetto += netto;
    const name = v ? v.unternehmer : (pos ? `BKP ${pos.bkp} ${pos.bezeichnung}` : "ohne Zuordnung");
    bl.text(r.buchungsNr || "–", { x: sp.bnr, size: 8, farbe: grau });
    bl.text(r.datum || "", { x: sp.datum, size: 8.5 });
    bl.text(bl.umbruch(name, sp.nr - sp.firma - 8, 8.5)[0], { x: sp.firma, size: 8.5 });
    bl.text(`${RTYP[r.typ] || "Rechnung"} ${r.nr || ""}`.trim(), { x: sp.nr, size: 8.5 });
    bl.text(chfPdf(netto), { rechts: sp.netto, size: 8.5 });
    bl.text(chfPdf(mwst), { rechts: sp.mwst, size: 8.5, farbe: grau });
    bl.text(chfPdf(netto + mwst), { rechts: sp.brutto, size: 8.5 });
    if (!r.beleg) bl.text("kein Beleg", { x: sp.firma, y: bl.y - 9, size: 6.5, farbe: PDFLib.rgb(0.71, 0.33, 0.05) });
    bl.y -= r.beleg ? 15 : 22;
    bl.linie(RAND, rechts, bl.y + 5, 0.3, PDFLib.rgb(0.91, 0.90, 0.89));
  });

  const sumMwst = sumNetto * satz / 100;
  bl.y -= 4; bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); bl.y -= 14;
  bl.text(`Total netto (${rechnungen.length} Rechnungen)`, { x: sp.firma, size: 9 });
  bl.text(chfPdf(sumNetto), { rechts: sp.brutto, size: 9 });
  bl.y -= 13;
  bl.text(`MwSt ${satz}%`, { x: sp.firma, size: 9, farbe: grau });
  bl.text(chfPdf(sumMwst), { rechts: sp.brutto, size: 9, farbe: grau });
  bl.y -= 15;
  bl.text("Zahlbetrag brutto", { x: sp.firma, size: 11, fett: true });
  bl.text("CHF " + chfPdf(sumNetto + sumMwst), { rechts: sp.brutto, size: 11, fett: true });
  if (auftrag.bemerkung) { bl.y -= 24; bl.umbruch(auftrag.bemerkung, rechts - RAND, 8.5).forEach((z) => { bl.text(z, { size: 8.5, farbe: grau }); bl.y -= 11; }); }

  // ---- Je Rechnung: Deckblatt, dahinter der Beleg ----
  for (const r of rechnungen) {
    const st = belegStaffel(r, d, ks);
    const firma = st.v ? findFirma(firmen, st.v.firmaId, st.v.unternehmer) : null;
    const snap = st.v?.firmaSnap || null;
    const db2 = pdfBlatt(doc, schriften, A4, vorlage, logoBild);
    pdfKopf(db2, "Rechnungsdeckblatt", projekt, rollen, `${auftrag.nr || ""}  ·  Buchung ${r.buchungsNr || "–"}  ·  ${RTYP[r.typ] || "Rechnung"} ${r.nr || ""}`, vorlage);

    // Empfänger: Adresse aus dem Adressstamm, dazu der Vertragsname
    db2.text("Unternehmer", { size: 7.5, farbe: grau }); db2.y -= 12;
    const name = snap?.name || st.v?.unternehmer || (st.art === "position" ? st.bezug : "—");
    db2.text(name, { size: 11, fett: true }); db2.y -= 13;
    const adr = firma ? firmaAdresse(firma) : (snap ? [snap.strasse, [snap.plz, snap.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ") : "");
    if (adr) { db2.text(adr, { size: 9, farbe: grau }); db2.y -= 12; }
    db2.text("Bezug: " + st.bezug, { size: 9 }); db2.y -= 20;

    // Konditionen — nur zur Information, sie verändern den Zahlbetrag nicht
    if (st.v) {
      const k = [];
      if (Number(st.v.rabattPct)) k.push(`Rabatt ${st.v.rabattPct}%`);
      if (Number(st.v.pauschalabzug)) k.push(`Pauschalabzug CHF ${chfPdf(st.v.pauschalabzug)}`);
      if (Number(st.v.skontoPct)) k.push(`Skonto ${st.v.skontoPct}%`);
      if (Number(st.v.bauabzuegePct)) k.push(`Bauabzüge ${st.v.bauabzuegePct}%`);
      if (Number(st.v.rundung)) k.push(`Rundung CHF ${chfPdf(st.v.rundung)}`);
      if (Number(st.v.rueckbehaltPct)) k.push(`Rückbehalt ${st.v.rueckbehaltPct}%`);
      db2.text("Vertragskonditionen (zur Information — im Zahlbetrag nicht abgezogen)", { size: 7.5, farbe: grau }); db2.y -= 11;
      db2.text(k.length ? k.join("  ·  ") : "keine besonderen Konditionen", { size: 8.5 }); db2.y -= 20;
    }

    // Staffel
    const zeile = (label, wert, prozent, opt) => {
      const o = opt || {};
      db2.text(label, { size: o.fett ? 9.5 : 9, fett: o.fett, farbe: o.grau ? grau : undefined });
      db2.text(chfPdf(wert), { rechts: rechts - 70, size: o.fett ? 9.5 : 9, fett: o.fett });
      if (prozent !== null && prozent !== undefined) db2.text(prozent, { rechts, size: 8.5, farbe: grau });
      db2.y -= 14;
    };
    const anteil = (x) => st.summe > 0 ? (100 * x / st.summe).toFixed(1) + "%" : "–";
    db2.text(st.art === "vertrag" ? "Vertragsstand" : "Positionsbudget", { size: 7.5, farbe: grau }); db2.y -= 13;
    db2.linie(RAND, rechts); db2.y -= 13;
    zeile(st.art === "vertrag" ? "Vertragssumme netto inkl. genehmigter Nachträge" : "KV revidiert (Budget)", st.summe, "100%");
    zeile("bisher verrechnet", st.vorher, anteil(st.vorher), { grau: true });
    zeile("diese Rechnung", st.betrag, anteil(st.betrag), { fett: true });
    db2.linie(RAND, rechts, db2.y + 6, 0.5);
    zeile("total verrechnet", st.total, anteil(st.total));
    zeile("noch offen", st.offen, anteil(st.offen), { grau: true });

    // Zahlbetrag
    const netto = Number(r.betrag) || 0, mwst = netto * satz / 100;
    db2.y -= 12; db2.linie(RAND, rechts, db2.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11)); db2.y -= 16;
    zeile("Rechnungsbetrag netto", netto);
    zeile(`MwSt ${satz}%`, mwst, null, { grau: true });
    zeile("Zahlbetrag brutto", netto + mwst, null, { fett: true });

    db2.y -= 10;
    db2.text(`Rechnungsdatum ${r.datum || "—"}   ·   Status ${RSTATUS[r.status] || r.status}`, { size: 8, farbe: grau });

    // Beleg anhängen
    if (r.beleg) {
      try {
        const blob = await belegLaden(r.beleg.id);
        if (blob) {
          const fremd = await PDFLib.PDFDocument.load(await blob.arrayBuffer(), { ignoreEncryption: true });
          const seiten = await doc.copyPages(fremd, fremd.getPageIndices());
          seiten.forEach((sp2) => doc.addPage(sp2));
        } else {
          db2.y -= 18; db2.text("Hinweis: Der hinterlegte Beleg wurde nicht gefunden.", { size: 8.5, farbe: PDFLib.rgb(0.71, 0.33, 0.05) });
        }
      } catch (e) {
        db2.y -= 18; db2.text("Hinweis: Der Beleg konnte nicht eingefügt werden (" + pdfText(e.message).slice(0, 60) + ").", { size: 8.5, farbe: PDFLib.rgb(0.71, 0.33, 0.05) });
      }
    } else {
      db2.y -= 18;
      db2.text("kein Rechnungsbeleg hinterlegt", { size: 9, fett: true, farbe: PDFLib.rgb(0.71, 0.33, 0.05) });
    }
  }

  bl.abschliessen();
  return doc.save();
}

function VergauftraegeView({ db, d, dispatch, projektId, projekt, ks, firmen }) {
  const rollen = projektRollen(db, projekt);
  const auftraege = (db.vergauftraege || []).filter((a) => a.projektId === projektId);
  const [sel, setSel] = useState("");
  const [busy, setBusy] = useState("");
  const satz = Number(projekt?.mwstSatz) || 8.1;
  const aktiv = auftraege.find((a) => a.id === sel) || null;

  const naechsteNr = () => {
    const jahr = today().slice(0, 4);
    const n = (db.vergauftraege || []).filter((a) => (a.nr || "").startsWith(`VA-${jahr}-`)).length + 1;
    return `VA-${jahr}-${String(n).padStart(3, "0")}`;
  };
  const anlegen = () => {
    const id = uid();
    dispatch({ type: "add", coll: "vergauftraege", item: { id, projektId, nr: naechsteNr(), datum: today(), gesendet: "", rechnungIds: [], bemerkung: "" } });
    setSel(id);
  };
  const upd = (id, patch) => dispatch({ type: "update", coll: "vergauftraege", id, patch });

  // Auswählbar: geprüfte Rechnungen, die in keinem anderen Auftrag stecken
  const waehlbar = useMemo(() => {
    const inAnderen = new Set();
    auftraege.forEach((a) => { if (!aktiv || a.id !== aktiv.id) (a.rechnungIds || []).forEach((x) => inAnderen.add(x)); });
    return d.rechnungen.filter((r) => (r.status === "geprueft" || (aktiv && (aktiv.rechnungIds || []).includes(r.id))) && !inAnderen.has(r.id))
      .sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
  }, [d.rechnungen, auftraege, aktiv]);

  const zeilen = (a) => (a.rechnungIds || []).map((id) => d.rechnungen.find((r) => r.id === id)).filter(Boolean);
  const totalNetto = (a) => zeilen(a).reduce((s, r) => s + (Number(r.betrag) || 0), 0);

  const senden = (a) => {
    const rs = zeilen(a);
    if (!rs.length) { window.alert("Der Auftrag enthält noch keine Rechnungen."); return; }
    const ohne = rs.filter((r) => !r.beleg);
    const frage = ohne.length
      ? `${ohne.length} von ${rs.length} Rechnungen haben keinen hinterlegten Beleg (${ohne.map((r) => r.nr || "ohne Nr.").join(", ")}).\n\nAuftrag trotzdem als gesendet markieren? Alle ${rs.length} Rechnungen werden dabei auf «bezahlt» gesetzt.`
      : `Auftrag als gesendet markieren? Alle ${rs.length} Rechnungen werden dabei auf «bezahlt» gesetzt.`;
    if (!window.confirm(frage)) return;
    upd(a.id, { gesendet: today() });
    rs.forEach((r) => dispatch({ type: "update", coll: "rechnungen", id: r.id, patch: { status: "bezahlt" } }));
  };

  const erzeugen = async (a) => {
    setBusy(a.id);
    try {
      const bytes = await baueVergauftragPdf(a, zeilen(a), { d, ks, projekt, rollen, firmen, satz, db });
      pdfSpeichern(bytes, `${a.nr || "Verguetungsauftrag"}_${(projekt?.name || "").replace(/[^\w]+/g, "_")}.pdf`);
    } catch (e) { window.alert("Das Dokument konnte nicht erzeugt werden: " + e.message); }
    setBusy("");
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <button className={btnPrimary} onClick={anlegen}>+ Vergütungsauftrag</button>
        <span className="text-xs text-stone-500 ml-auto">{auftraege.length} Auftr{auftraege.length === 1 ? "ag" : "äge"}</span>
      </div>

      {!auftraege.length ? <Empty text="Noch kein Vergütungsauftrag. Lege einen an und kreuze die geprüften Rechnungen an, die gemeinsam zur Zahlung sollen." /> : (
        <div className="flex flex-wrap gap-2">
          {auftraege.map((a) => (
            <button key={a.id} onClick={() => setSel(a.id)} className={`px-3 py-1.5 rounded-md text-sm border flex items-center gap-2 ${sel === a.id ? "bg-orange-800 text-white border-orange-800" : "border-stone-300 text-stone-600 hover:bg-stone-100"}`}>
              {a.nr || "ohne Nr."}
              <span className={`text-[10px] px-1.5 py-0.5 rounded ${a.gesendet ? (sel === a.id ? "bg-orange-900" : "bg-emerald-100 text-emerald-800") : (sel === a.id ? "bg-orange-900" : "bg-amber-100 text-amber-800")}`}>{a.gesendet ? "gesendet" : "offen"}</span>
            </button>
          ))}
        </div>
      )}

      {aktiv && (() => {
        const rs = zeilen(aktiv);
        const netto = totalNetto(aktiv);
        const mwst = netto * satz / 100;
        const ohneBeleg = rs.filter((r) => !r.beleg).length;
        return (
          <div className={`${card} p-4 space-y-4`}>
            <div className="grid grid-cols-1 md:grid-cols-[160px_150px_1fr_auto] gap-3 items-end">
              <Field label="Auftragsnummer"><input className={inputCls} value={aktiv.nr} onChange={(e) => upd(aktiv.id, { nr: e.target.value })} /></Field>
              <Field label="Datum"><input type="date" className={inputCls} value={aktiv.datum} onChange={(e) => upd(aktiv.id, { datum: e.target.value })} /></Field>
              <Field label="Bemerkung"><input className={inputCls} value={aktiv.bemerkung || ""} onChange={(e) => upd(aktiv.id, { bemerkung: e.target.value })} placeholder="optional" /></Field>
              <div className="flex gap-2">
                <button className={btnGhost} disabled={busy === aktiv.id} onClick={() => erzeugen(aktiv)}>{busy === aktiv.id ? "erzeugt…" : "📄 PDF erzeugen"}</button>
                {aktiv.gesendet
                  ? <span className="text-xs text-emerald-700 self-center px-2">gesendet {aktiv.gesendet}</span>
                  : <button className={btnPrimary} onClick={() => senden(aktiv)}>Als gesendet markieren</button>}
                <button className="text-red-600 text-xs hover:underline px-1" onClick={() => { if (window.confirm("Auftrag löschen? Die Rechnungen bleiben bestehen, ihr Status ändert sich nicht.")) { dispatch({ type: "remove", coll: "vergauftraege", id: aktiv.id }); setSel(""); } }}>Löschen</button>
              </div>
            </div>

            {aktiv.gesendet ? <div className="text-xs bg-stone-50 border border-stone-200 rounded px-3 py-2 text-stone-600">Dieser Auftrag wurde am {aktiv.gesendet} gesendet. Änderungen sind weiterhin möglich — der Status der Rechnungen bleibt dabei unverändert und wird von dir gesteuert.</div> : null}
            {ohneBeleg ? <div className="text-xs bg-amber-50 border border-amber-200 rounded px-3 py-2 text-amber-800">{ohneBeleg} ausgewählte Rechnung{ohneBeleg === 1 ? "" : "en"} ohne hinterlegten Beleg — im Dokument erscheint der Vermerk «kein Rechnungsbeleg hinterlegt».</div> : null}

            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-stone-50 text-stone-500 text-xs"><tr>
                  <th className="w-8 px-2 py-2"></th><th className="text-left font-medium px-3 py-2">Buchung</th><th className="text-left font-medium px-3 py-2">Datum</th><th className="text-left font-medium px-3 py-2">Unternehmer / Buchung</th>
                  <th className="text-left font-medium px-3 py-2">Rg-Nr.</th><th className="text-right font-medium px-3 py-2">Netto</th><th className="text-left font-medium px-3 py-2">Beleg</th>
                </tr></thead>
                <tbody>{!waehlbar.length ? <tr><td colSpan={7} className="px-3 py-4 text-stone-500">Keine geprüften Rechnungen verfügbar. Setze im Reiter «Rechnungen» den Status auf «geprüft».</td></tr> : waehlbar.map((r) => {
                  const an = (aktiv.rechnungIds || []).includes(r.id);
                  const v = d.vertraege.find((x) => x.id === r.vertragId);
                  const pos = d.positionen.find((x) => x.id === r.positionId);
                  return (
                    <tr key={r.id} className={`border-t border-stone-100 ${an ? "bg-orange-50/50" : ""}`}>
                      <td className="px-2 py-2 text-center"><input type="checkbox" checked={an} onChange={() => upd(aktiv.id, { rechnungIds: an ? aktiv.rechnungIds.filter((x) => x !== r.id) : [...(aktiv.rechnungIds || []), r.id] })} /></td>
                      <td className="px-3 py-2 tabular-nums text-stone-600 font-medium">{r.buchungsNr || "–"}</td>
                      <td className="px-3 py-2 tabular-nums text-stone-600">{r.datum}</td>
                      <td className="px-3 py-2">{v ? v.unternehmer : <span className="text-stone-500">{pos ? `BKP ${pos.bkp} ${pos.bezeichnung}` : "ohne Zuordnung"}</span>}</td>
                      <td className="px-3 py-2 text-stone-600">{RTYP[r.typ] || "Rechnung"} {r.nr}</td>
                      <td className="px-3 py-2 text-right tabular-nums">{chf(r.betrag)}</td>
                      <td className="px-3 py-2">{r.beleg ? <span className="text-xs text-emerald-700">📄 vorhanden</span> : <span className="text-xs text-amber-700">fehlt</span>}</td>
                    </tr>
                  );
                })}</tbody>
              </table>
            </div>

            <div className="flex justify-end border-t border-stone-100 pt-3">
              <div className="text-sm space-y-1 min-w-[260px]">
                <div className="flex justify-between"><span className="text-stone-500">Total netto ({rs.length} Rechnungen)</span><span className="tabular-nums">{chf(netto)}</span></div>
                <div className="flex justify-between"><span className="text-stone-500">MwSt {satz}%</span><span className="tabular-nums">{chf(mwst)}</span></div>
                <div className="flex justify-between font-semibold border-t border-stone-800 pt-1"><span>Zahlbetrag brutto</span><span className="tabular-nums">{chf(netto + mwst)}</span></div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function BelegFeld({ rechnung, dispatch }) {
  const [busy, setBusy] = useState(false);
  const [ueber, setUeber] = useState(false);
  const ref = useRef(null);
  const hat = !!rechnung.beleg;

  const uebernehmen = async (datei) => {
    if (!datei) return;
    if (datei.type !== "application/pdf" && !/\.pdf$/i.test(datei.name)) { window.alert("Bitte eine PDF-Datei wählen."); return; }
    if (datei.size > 25 * 1024 * 1024) { window.alert("Die Datei ist grösser als 25 MB. Bitte vorher verkleinern."); return; }
    setBusy(true);
    try {
      const id = rechnung.beleg?.id || uid();
      await belegSpeichern(id, datei);
      dispatch({ type: "update", coll: "rechnungen", id: rechnung.id, patch: { beleg: { id, name: datei.name, groesse: datei.size, datum: today() } } });
    } catch (e) { window.alert("Beleg konnte nicht gespeichert werden: " + e.message); }
    setBusy(false);
  };

  const ansehen = async () => {
    try {
      const blob = await belegLaden(rechnung.beleg.id);
      if (!blob) { window.alert("Der Beleg wurde nicht gefunden — bitte neu hochladen."); return; }
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { window.alert("Beleg konnte nicht geöffnet werden: " + e.message); }
  };

  const entfernen = async () => {
    if (!window.confirm("Beleg zu dieser Rechnung entfernen?")) return;
    try { await belegLoeschen(rechnung.beleg.id); } catch (e) {}
    dispatch({ type: "update", coll: "rechnungen", id: rechnung.id, patch: { beleg: null } });
  };

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setUeber(true); }}
      onDragLeave={() => setUeber(false)}
      onDrop={(e) => { e.preventDefault(); setUeber(false); uebernehmen(e.dataTransfer.files[0]); }}
      className={`inline-flex items-center gap-1.5 rounded px-1 ${ueber ? "ring-2 ring-orange-500 bg-orange-50" : ""}`}
      title={hat ? rechnung.beleg.name : "PDF hierher ziehen oder klicken"}
    >
      <input ref={ref} type="file" accept="application/pdf,.pdf" className="hidden" onChange={(e) => { uebernehmen(e.target.files[0]); e.target.value = ""; }} />
      {busy ? <span className="text-xs text-stone-400">lädt…</span> : hat ? (
        <>
          <button className="text-xs text-orange-800 hover:underline max-w-[110px] truncate" onClick={ansehen}>📄 {rechnung.beleg.name}</button>
          <button className="text-xs text-stone-400 hover:text-stone-700" title="Beleg ersetzen" onClick={() => ref.current?.click()}>↻</button>
          <button className="text-xs text-stone-400 hover:text-red-600" title="Beleg entfernen" onClick={entfernen}>×</button>
        </>
      ) : (
        <button className="text-xs text-stone-400 hover:text-orange-800 hover:underline" onClick={() => ref.current?.click()}>+ PDF</button>
      )}
    </div>
  );
}

// Eventual- und Per-Positionen werden bepreist, zählen aber nicht ins Vergleichstotal
function istGewertet(pz) { return (pz.art || "normal") === "normal"; }
const POSARTEN = [
  { k: "normal", l: "Normal", kurz: "", hilfe: "zählt ins Vergleichstotal" },
  { k: "eventual", l: "Eventual", kurz: "Ev", hilfe: "bepreist, ausserhalb des Totals" },
  { k: "per", l: "Per", kurz: "Per", hilfe: "Preis pro Einheit, ausserhalb des Totals" },
];
const posArtLabel = (k) => (POSARTEN.find((x) => x.k === (k || "normal")) || POSARTEN[0]).l;
function bieterNichtGewertet(b, a) {
  if (!a || a.modus !== "lv") return 0;
  return (a.positionen || []).filter((p) => !istGewertet(p)).reduce((s, p) => s + (Number(p.menge) || 0) * (parseBetrag((b.preise || {})[p.code]) || 0), 0);
}
function bieterBrutto(b, a) {
  if (a && a.modus === "lv") return (a.positionen || []).filter(istGewertet).reduce((s, p) => s + (Number(p.menge) || 0) * (parseBetrag((b.preise || {})[p.code]) || 0), 0);
  return Number(b.brutto) || 0;
}
function bieterNetto(b, a) { return konditionenNetto(bieterBrutto(b, a), b, true); }
function nutzwerte(a, projekt) {
  const w = a.gewichte || { preis: Number(projekt?.gewichtPreis) || 70, referenzen: Number(projekt?.gewichtReferenzen) || 20, lehrlinge: Number(projekt?.gewichtLehrlinge) || 10 };
  const rows = (a.bieter || []).map((b) => ({ b, brutto: bieterBrutto(b, a), netto: bieterNetto(b, a) }));
  const valid = rows.filter((r) => r.netto > 0);
  const min = valid.length ? Math.min(...valid.map((r) => r.netto)) : 0;
  return { w, rows: rows.map((r) => {
    const pP = r.netto > 0 && min > 0 ? 100 * min / r.netto : 0;
    const nutz = (pP * (Number(w.preis) || 0) + (Number(r.b.referenzPunkte) || 0) * (Number(w.referenzen) || 0) + (Number(r.b.lehrlingPunkte) || 0) * (Number(w.lehrlinge) || 0)) / 100;
    return { b: r.b, brutto: r.brutto, netto: r.netto, pP, nutz };
  }).sort((x, y) => y.nutz - x.nutz), min };
}

function BieterAusStamm({ firmen, vorhanden, onUebernehmen, onClose }) {
  const [q, setQ] = useState("");
  const [ampel, setAmpel] = useState("");
  const [gewaehlt, setGewaehlt] = useState([]);
  const liste = useMemo(() => {
    const t = q.trim().toLowerCase();
    return [...(firmen || [])]
      .filter((fa) => !ampel || fa.ampel === ampel)
      .filter((fa) => !t || [fa.name, fa.ort, fa.bkp].join(" ").toLowerCase().includes(t))
      .sort((x, y) => x.name.localeCompare(y.name, "de"));
  }, [firmen, q, ampel]);
  return (
    <div className="fixed inset-0 bg-stone-900/50 z-[60] flex items-start justify-center p-6 overflow-y-auto" onClick={onClose}>
      <div className={`${card} w-full max-w-2xl p-4 space-y-3`} onClick={(e) => e.stopPropagation()}>
        <div className="font-medium">Bieter aus dem Adressstamm</div>
        <div className="flex flex-wrap gap-2 items-center">
          <input className={`${inputCls} max-w-[240px]`} placeholder="Firma, Ort oder Gewerk suchen…" value={q} onChange={(e) => setQ(e.target.value)} />
          <button className={`px-2.5 py-1.5 rounded-md text-xs border ${!ampel ? "bg-stone-800 text-white border-stone-800" : "border-stone-300 text-stone-600"}`} onClick={() => setAmpel("")}>Alle</button>
          {Object.entries(AMPEL).map(([k, am]) => (
            <button key={k} className={`px-2.5 py-1.5 rounded-md text-xs border flex items-center gap-1.5 ${ampel === k ? "bg-stone-800 text-white border-stone-800" : "border-stone-300 text-stone-600"}`} onClick={() => setAmpel(ampel === k ? "" : k)}>
              <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: am.punkt }} />{am.label}
            </button>
          ))}
        </div>
        <div className="max-h-[50vh] overflow-y-auto divide-y divide-stone-100 border border-stone-200 rounded-lg">
          {!liste.length ? <div className="p-4 text-sm text-stone-500">Keine Firma gefunden.</div> : liste.map((fa) => {
            const schon = vorhanden.includes(fa.name.trim().toLowerCase());
            const an = gewaehlt.some((x) => x.id === fa.id);
            return (
              <label key={fa.id} className={`flex items-center gap-3 px-3 py-2 ${schon ? "opacity-50" : "hover:bg-stone-50 cursor-pointer"}`}>
                <input type="checkbox" disabled={schon} checked={an} onChange={() => setGewaehlt(an ? gewaehlt.filter((x) => x.id !== fa.id) : [...gewaehlt, fa])} />
                <span className="w-2.5 h-2.5 rounded-full shrink-0 border border-stone-300" style={{ background: AMPEL[fa.ampel]?.punkt || "transparent" }} />
                <span className="flex-1 min-w-0"><span className="font-medium text-sm">{fa.name}</span><span className="text-xs text-stone-500"> · {[firmaOrt(fa), fa.bkp].filter(Boolean).join(" · ") || "—"}</span></span>
                {schon ? <span className="text-xs text-stone-400">bereits Bieter</span> : null}
              </label>
            );
          })}
        </div>
        <div className="flex justify-end gap-2">
          <button className={btnGhost} onClick={onClose}>Abbrechen</button>
          <button className={btnPrimary} disabled={!gewaehlt.length} onClick={() => onUebernehmen(gewaehlt)}>{gewaehlt.length ? `${gewaehlt.length} übernehmen` : "übernehmen"}</button>
        </div>
      </div>
    </div>
  );
}

// ---------- NPK-Katalog: importieren, durchsuchen, Positionen übernehmen ----------
// Positionen aus einem Katalog oder einer früheren Ausschreibung wählen
function PositionsWaehler({ db, d, dispatch, aufnehmen, onClose }) {
  // Immer mit der Katalogansicht starten — nur dort lässt sich der erste Katalog importieren
  const [quelle, setQuelle] = useState("katalog");
  const [katId, setKatId] = useState((db.kataloge || [])[0]?.id || "");
  const [angebotId, setAngebotId] = useState("");
  const [q, setQ] = useState("");
  const [gewaehlt, setGewaehlt] = useState({});
  const [busy, setBusy] = useState(false);
  const dateiRef = useRef(null);

  const kataloge = db.kataloge || [];
  const katalog = kataloge.find((k) => k.id === katId) || null;

  const quellPositionen = useMemo(() => {
    if (quelle === "katalog") return katalog?.positionen || [];
    const a = d.angebote.find((x) => x.id === angebotId);
    return a?.positionen || [];
  }, [quelle, katalog, angebotId, d.angebote]);

  const treffer = useMemo(() => {
    const t = q.trim().toLowerCase();
    if (!t) return quellPositionen.slice(0, 400);
    return quellPositionen.filter((pz) => [pz.npk, pz.code, pz.bezeichnung, ...(pz.langtext || [])].join(" ").toLowerCase().includes(t)).slice(0, 400);
  }, [quellPositionen, q]);

  const katalogImportieren = async (datei) => {
    if (!datei) return;
    setBusy(true);
    try {
      const parsed = parseSia451(await unzipCrbx(await datei.arrayBuffer()));
      if (!parsed.positionen.length) { window.alert("In dieser Datei wurden keine Positionen gefunden."); setBusy(false); return; }
      const kats = [...new Set(parsed.positionen.map((pz) => pz.catalog))];
      const id = uid();
      dispatch({ type: "add", coll: "kataloge", item: { id, name: datei.name.replace(/\.crbx$/i, ""), npk: kats.join(", "), datum: today(), positionen: parsed.positionen, bedingungen: parsed.bedingungen || [] } });
      setKatId(id); setQuelle("katalog");
    } catch (e) { window.alert("Der Katalog konnte nicht gelesen werden: " + e.message); }
    setBusy(false);
  };

  const anzahl = Object.values(gewaehlt).filter(Boolean).length;
  const uebernehmen = () => {
    const gewaehlte = treffer.filter((pz) => gewaehlt[pz.code]);
    if (!gewaehlte.length) return;
    aufnehmen(gewaehlte.map((pz) => ({ ...pz, id: uid(), art: "normal", bemerkung: "", fabrikat: "", menge: Number(pz.menge) || 0 })));
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-stone-900/50 z-[60] flex items-start justify-center p-6 overflow-y-auto" onClick={onClose}>
      <div className={`${card} w-full max-w-4xl p-4 space-y-3`} onClick={(e) => e.stopPropagation()}>
        <div className="font-medium">Positionen aufnehmen</div>

        <div className="flex flex-wrap gap-2 items-end">
          <Field label="Quelle">
            <select className={inputCls} value={quelle} onChange={(e) => { setQuelle(e.target.value); setGewaehlt({}); }}>
              <option value="katalog">NPK-Katalog</option>
              <option value="fruehere">frühere Ausschreibung</option>
            </select>
          </Field>
          {quelle === "katalog" ? (
            <>
              <Field label="Katalog">
                <select className={inputCls} value={katId} onChange={(e) => { setKatId(e.target.value); setGewaehlt({}); }}>
                  {!kataloge.length ? <option value="">— noch keiner importiert —</option> : null}
                  {kataloge.map((k) => <option key={k.id} value={k.id}>{k.name} · NPK {k.npk} · {k.positionen.length} Pos.</option>)}
                </select>
              </Field>
              <input ref={dateiRef} type="file" accept=".crbx" className="hidden" onChange={(e) => { katalogImportieren(e.target.files[0]); e.target.value = ""; }} />
              <button className={btnGhost} disabled={busy} onClick={() => dateiRef.current?.click()}>{busy ? "liest…" : "+ Katalog (.crbx)"}</button>
              {katalog ? <button className="text-red-600 text-xs hover:underline pb-2" onClick={() => { if (window.confirm(`Katalog «${katalog.name}» entfernen? Bereits aufgenommene Positionen bleiben bestehen.`)) { dispatch({ type: "remove", coll: "kataloge", id: katalog.id }); setKatId((kataloge.find((k) => k.id !== katalog.id) || {}).id || ""); } }}>Katalog entfernen</button> : null}
            </>
          ) : (
            <Field label="Ausschreibung">
              <select className={inputCls} value={angebotId} onChange={(e) => { setAngebotId(e.target.value); setGewaehlt({}); }}>
                <option value="">— wählen —</option>
                {d.angebote.filter((a) => (a.positionen || []).length).map((a) => <option key={a.id} value={a.id}>{a.titel} · {(a.positionen || []).length} Pos.</option>)}
              </select>
            </Field>
          )}
          <input className={`${inputCls} max-w-[240px]`} placeholder="NPK-Code oder Stichwort…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>

        {!quellPositionen.length ? (
          <Empty text={quelle === "katalog" ? "Noch kein Katalog importiert. Lade eine .crbx-Datei aus CRB oder Messerli — sie bleibt für alle Projekte verfügbar." : "Wähle eine frühere Ausschreibung mit Positionen."} />
        ) : (
          <>
            <div className="flex items-center gap-3 text-xs text-stone-500">
              <span>{treffer.length} von {quellPositionen.length} Positionen{treffer.length === 400 ? " (Anzeige begrenzt — bitte suchen)" : ""}</span>
              <button className="text-orange-800 hover:underline" onClick={() => { const alle = {}; treffer.forEach((pz) => alle[pz.code] = true); setGewaehlt(alle); }}>alle anzeigen wählen</button>
              {anzahl ? <button className="text-stone-500 hover:underline" onClick={() => setGewaehlt({})}>Auswahl leeren</button> : null}
            </div>
            <div className="max-h-[46vh] overflow-y-auto border border-stone-200 rounded-lg divide-y divide-stone-100">
              {treffer.map((pz) => (
                <label key={pz.code} className="flex items-start gap-3 px-3 py-1.5 hover:bg-stone-50 cursor-pointer">
                  <input type="checkbox" className="mt-1" checked={!!gewaehlt[pz.code]} onChange={() => setGewaehlt({ ...gewaehlt, [pz.code]: !gewaehlt[pz.code] })} />
                  <span className="tabular-nums text-xs text-stone-500 w-[64px] shrink-0 mt-0.5">{pz.npk}</span>
                  <span className="flex-1 min-w-0">
                    <span className="text-sm">{pz.bezeichnung}</span>
                    {(pz.langtext || []).length ? <span className="block text-xs text-stone-400 truncate">{(pz.langtext || []).join(" · ")}</span> : null}
                  </span>
                  <span className="text-xs text-stone-500 shrink-0 mt-0.5">{pz.einheit}</span>
                </label>
              ))}
            </div>
          </>
        )}

        <div className="flex justify-end gap-2">
          <button className={btnGhost} onClick={onClose}>Abbrechen</button>
          <button className={btnPrimary} disabled={!anzahl} onClick={uebernehmen}>{anzahl ? `${anzahl} Position${anzahl === 1 ? "" : "en"} aufnehmen` : "aufnehmen"}</button>
        </div>
      </div>
    </div>
  );
}

function AngebotEditor({ angebot, positionen, projekt, neuBieter, onClose, onSave, firmen }) {
  const [a, setA] = useState(JSON.parse(JSON.stringify({ modus: "pauschal", positionen: [], bedingungen: "", gewichte: { preis: Number(projekt?.gewichtPreis) || 70, referenzen: Number(projekt?.gewichtReferenzen) || 20, lehrlinge: Number(projekt?.gewichtLehrlinge) || 10 }, ...angebot })));
  const opts = posSelectOptions(positionen);
  const isLv = a.modus === "lv";
  const setB = (bi, k, v) => { const b = [...a.bieter]; b[bi] = { ...b[bi], [k]: v }; setA({ ...a, bieter: b }); };
  const setEp = (bi, code, v) => { const b = [...a.bieter]; b[bi] = { ...b[bi], preise: { ...(b[bi].preise || {}), [code]: v } }; setA({ ...a, bieter: b }); };
  const [stammOffen, setStammOffen] = useState(false);
  const bieterAusStamm = (gewaehlte) => {
    const vorhanden = new Set((a.bieter || []).map((b) => String(b.name || "").trim().toLowerCase()));
    const neue = gewaehlte.filter((fa) => !vorhanden.has(fa.name.trim().toLowerCase()))
      .map((fa) => ({ ...neuBieter(), name: fa.name, firmaId: fa.id }));
    if (neue.length) setA({ ...a, bieter: [...(a.bieter || []).filter((b) => b.name || (a.bieter || []).length <= 1), ...neue] });
    setStammOffen(false);
  };
  const delB = (bi) => setA({ ...a, bieter: a.bieter.filter((_, x) => x !== bi) });
  const setW = (k, v) => setA({ ...a, gewichte: { ...a.gewichte, [k]: v } });
  const wSum = (Number(a.gewichte.preis) || 0) + (Number(a.gewichte.referenzen) || 0) + (Number(a.gewichte.lehrlinge) || 0);
  const cell = "w-full text-xs px-1 py-0.5 border border-stone-200 rounded text-right tabular-nums";
  const bruttoOf = (b) => bieterBrutto({ ...b }, a);
  return (
    <>
    {stammOffen && <BieterAusStamm firmen={firmen} vorhanden={(a.bieter || []).map((b) => String(b.name || "").trim().toLowerCase())} onUebernehmen={bieterAusStamm} onClose={() => setStammOffen(false)} />}
    <Modal title={angebot.id ? "Ausschreibung bearbeiten" : "Neue Ausschreibung / Angebotsvergleich"} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Titel / Arbeitsgattung"><input className={inputCls} value={a.titel} onChange={(e) => setA({ ...a, titel: e.target.value })} placeholder="z.B. Unterlagsböden BKP 281" /></Field>
          <Field label="BKP-Position (für Vergabe)"><select className={inputCls} value={a.positionId || ""} onChange={(e) => setA({ ...a, positionId: e.target.value })}><option value="">— zuordnen —</option>{opts.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
        </div>
        <div className="text-xs text-stone-500">Bepreisung: <span className="font-medium">{isLv ? `Leistungsverzeichnis (${(a.positionen || []).length} Positionen) — Bieter füllen Einheitspreise` : "Pauschale Angebotssumme je Bieter"}</span>{isLv ? "" : " · LV importierst du im Reiter «Leistungsverzeichnisse»"}</div>
        <div className={`${card} p-3 bg-stone-50/60`}>
          <div className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-2">Gewichtung % (Vorgabe aus Projekt, hier übersteuerbar) {wSum !== 100 && <span className="text-red-600 normal-case">(Summe {wSum}% — sollte 100% sein)</span>}</div>
          <div className="grid grid-cols-3 gap-3">
            <Field label="Preis %"><input className={inputCls} value={a.gewichte.preis} onChange={(e) => setW("preis", e.target.value)} /></Field>
            <Field label="Referenzen %"><input className={inputCls} value={a.gewichte.referenzen} onChange={(e) => setW("referenzen", e.target.value)} /></Field>
            <Field label="Lehrlingsausbildung %"><input className={inputCls} value={a.gewichte.lehrlinge} onChange={(e) => setW("lehrlinge", e.target.value)} /></Field>
          </div>
        </div>
        <div>
          <div className="flex items-center justify-between mb-2"><span className="text-xs font-medium text-stone-500 uppercase tracking-wide">Bieter — Stammdaten, Konditionen & Bewertung</span><div className="flex gap-3"><button className="text-orange-800 text-xs hover:underline" onClick={() => setStammOffen(true)}>+ Bieter aus Adressstamm</button><button className="text-stone-500 text-xs hover:underline" onClick={() => setA({ ...a, bieter: [...a.bieter, neuBieter()] })}>+ leere Zeile</button></div></div>
          <div className="overflow-x-auto border border-stone-200 rounded-md"><table className="w-full text-sm">

            </tr></thead>
            <tbody>
              {a.bieter.map((b, bi) => (
