// ---------- Helpers ----------
const uid = () => Math.random().toString(36).slice(2, 10);
const chf = (n) => (Number(n) || 0).toLocaleString("de-CH", { minimumFractionDigits: 0, maximumFractionDigits: 0 });

const bkpGroup = (bkp) => (String(bkp).trim()[0] || "?");

const METRICS = ["kv", "mutSumme", "kvRevidiert", "vertragNetto", "ntGen", "ntPend", "teuerung", "beauftragt", "rapportSumme", "regieUeber", "erwartung", "prognose", "bezahlt", "fakturiert"];

function parseBetrag(raw) {
  if (typeof raw === "number") return raw;
  if (!raw) return 0;
  let s = String(raw).replace(/CHF/gi, "").replace(/Fr\.?/gi, "").trim().replace(/'/g, "").replace(/\s/g, "");
  if (s.includes(".") && s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function splitDelimited(line, delim) {
  const cells = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') inQ = !inQ;
    else if (ch === delim && !inQ) { cells.push(cur); cur = ""; }
    else cur += ch;
  }
  cells.push(cur);
  return cells.map((c) => c.trim().replace(/^"|"$/g, ""));
}
function parseKvText(text) {
  const lines = text.trim().split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return [];
  const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
  const first = splitDelimited(lines[0], delim).join(" ").toLowerCase();
  const hasHeader = /bkp|bezeichn|betrag|kv|text/.test(first);
  return (hasHeader ? lines.slice(1) : lines).map((line) => {
    const c = splitDelimited(line, delim);
    return { bkp: (c[0] || "").trim(), bezeichnung: (c[1] || "").trim(), kv: parseBetrag(c[2]) };
  }).filter((r) => r.bkp || r.bezeichnung);
}
function nestImported(rows, projektId) {
  const withIds = rows.map((r) => ({ id: uid(), projektId, bkp: r.bkp, bezeichnung: r.bezeichnung, kv: r.kv, parentId: null }));
  const byBkp = {}; withIds.forEach((p) => { byBkp[String(p.bkp).trim()] = p; });
  withIds.forEach((p) => {
    const bkp = String(p.bkp).trim(); let best = null;
    Object.keys(byBkp).forEach((k) => { if (k !== bkp && bkp.startsWith(k) && /[.\- ]/.test(bkp.charAt(k.length))) { if (!best || k.length > best.length) best = k; } });
    if (best) p.parentId = byBkp[best].id;
  });
  return withIds;
}

// ---------- Konditionen ----------
function konditionenNetto(brutto, k, includeFixed) {
  let x = (Number(brutto) || 0) * (1 - (Number(k.rabattPct) || 0) / 100);
  if (includeFixed) x -= (Number(k.pauschalabzug) || 0);
  x *= (1 - (Number(k.skontoPct) || 0) / 100);
  x *= (1 - (Number(k.bauabzuegePct) || 0) / 100);
  if (includeFixed) x += (Number(k.rundung) || 0);
  return x;
}
const hatKonditionen = (v) => ["rabattPct", "pauschalabzug", "skontoPct", "bauabzuegePct", "rundung"].some((k) => Number(v[k]));
const konditionenText = (v) => [Number(v.rabattPct) ? `Rabatt ${v.rabattPct}%` : "", Number(v.pauschalabzug) ? `Pauschal ${chf(v.pauschalabzug)}` : "", Number(v.skontoPct) ? `Skonto ${v.skontoPct}%` : "", Number(v.bauabzuegePct) ? `Bauabz. ${v.bauabzuegePct}%` : "", Number(v.rundung) ? `Rund. ${chf(v.rundung)}` : ""].filter(Boolean).join(" · ") || "—";
const rapportBetrag = (r) => (Number(r.stunden) || 0) * (Number(r.ansatz) || 0) + (Number(r.material) || 0);
const rapportNetto = (r, v) => konditionenNetto(rapportBetrag(r), v || {}, false);

// ---------- SIA 451 / CRBX (NPK-Leistungsverzeichnis) ----------
async function inflateRaw(arrayBuffer) {

}

}
const SIA_COND = { "101": ["rabattPct", "%"], "302": ["skontoPct", "%"], "503": ["bauabzuegePct", "%"], "504": ["pauschalabzug", "P"], "205": ["mwst", "%"] };
function parseSia451(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.length);
  const header = {}, conditions = {}, records = [], bedingungen = [];
  for (const l of lines) {
    const rt = l.slice(0, 4);
    if (rt[0] === "A") {
      const bkpM = l.match(/BKP[ .\d]+\D.{0,36}/);
      if (bkpM && !header.titel) header.titel = bkpM[0].replace(/\s+$/, "").trim();
      const pj = l.match(/\d{5,6}\s+([A-Za-zÄÖÜäöü][^\d]{3,40})/);
      if (pj && !header.projekt) header.projekt = pj[1].trim();
    } else if (rt.startsWith("C00") && rt !== "C000") {
      const art = l.slice(4, 7);
      const kind = l.slice(43, 44);
      let digits, sign;
      if (kind === "P") { const f = l.slice(61, 74); sign = f.includes("-") ? -1 : 1; digits = f.replace(/[^0-9]/g, ""); }
      else { const f = l.slice(74, 81); sign = f.includes("-") ? -1 : 1; digits = f.replace(/[^0-9]/g, ""); }
      const val = sign * (parseInt(digits || "0", 10) / 100);
      const map = SIA_COND[art];
      if (map) conditions[map[0]] = Math.abs(val);
      if (map && map[0] === "mwst") conditions.mwst = Math.abs(val);
    } else if (rt[0] === "G") {
      const catalog = rt.slice(1).trim();
      const code = l.slice(5, 17).replace(/\s/g, "");
      const level = l.slice(41, 42).trim();
      const unit = l.slice(50, 60).trim();
      const txt = l.slice(90).trim();
      let menge = null, preis = null;
      if (level === "6" && l.includes("GP")) {
        const qd = l.slice(45, 58).replace(/[^0-9]/g, "");
        if (qd) menge = parseInt(qd, 10) / 1000;
        const pd = l.slice(62, 74).replace(/[^0-9]/g, "");
        if (pd && /[1-9]/.test(pd)) preis = parseInt(pd, 10) / 100;
      }
      records.push({ catalog, code, level, unit, txt });
      if (catalog === "102" && txt && (level === "2" || level === "3")) bedingungen.push(txt);
      if (menge !== null) records[records.length - 1].menge = menge;
      if (preis !== null) records[records.length - 1].preis = preis;
    }
  }
  const positionen = [];
  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    if (r.level !== "5") continue;
    const gp = records[i + 1] && records[i + 1].level === "6" ? records[i + 1] : null;
    const p6 = r.code.slice(0, 6);
    let eigen = "";
    for (let j = i - 1; j >= 0 && i - j < 8; j--) { if (records[j].code === r.code && records[j].level === "2" && records[j].txt) { eigen = records[j].txt; break; } }
    const lang = [];
    for (let j = 0; j < i; j++) { const rj = records[j]; if (rj.catalog === r.catalog && rj.level === "3" && rj.txt && rj.code.slice(0, 6) === p6) lang.push(rj.txt); }
    positionen.push({ id: uid(), catalog: r.catalog, code: r.code, npk: r.code.slice(0, 3) + "." + r.code.slice(3), bezeichnung: eigen, langtext: [...new Set(lang)].filter((t) => t !== eigen), einheit: r.unit || (gp && gp.unit) || "", menge: gp && gp.menge ? gp.menge : 0, preis: gp && gp.preis ? gp.preis : 0 });
  }
  return { header, conditions, positionen, bedingungen };
}
function buildSia451(titel, positionen, preise) {
  const pad = (s, n) => (String(s) + " ".repeat(n)).slice(0, n);
  const num = (v, len) => { const s = Math.round(Math.abs(v || 0)).toString(); return (v < 0 ? "-" : "+") + "0".repeat(Math.max(0, len - s.length)) + s; };
  const out = [];
  out.push("A160425CRBX" + pad("", 20) + pad(titel, 80));
  let n = 1;
  positionen.forEach((p) => {
    const cat = p.catalog || "661";
    const codePad = pad(p.code, 12);
    out.push("G" + cat + " " + codePad + pad("", 24) + "2" + pad("", 48) + (p.bezeichnung || ""));
    out.push("G" + cat + " " + codePad + pad("", 24) + "5" + pad("", 9) + pad(p.einheit, 9));
    const menge = num((p.menge || 0) * 1000, 13);
    const ep = preise && preise[p.code] ? num(preise[p.code] * 100, 12) : "";
    out.push("G" + cat + " " + codePad + "GP" + pad("", 22) + "6 A" + menge + "  " + (ep ? "A" + ep : ""));
    n += 3;
  });
  out.push("Z160425" + pad("", 38) + num(n, 13));
  return out.join("\r\n");
}
const CRC_TABLE = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

// ---------- Offerte als CSV (Unternehmer-Preise) ----------
// Vorlage zum Versand an Unternehmer; sie tragen die Einheitspreise ein und senden zurück.
function buildOfferteCsv(titel, positionen, preise) {
  const esc = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const head = ["NPK", "Code", "Bezeichnung", "Einheit", "Menge", "Einheitspreis"];
  const lines = [esc(titel || "Ausschreibung"), head.join(";")];
  (positionen || []).forEach((p) => lines.push([p.npk, p.code, esc(p.bezeichnung), p.einheit, p.menge, preise && preise[p.code] != null && preise[p.code] !== "" ? preise[p.code] : ""].join(";")));
  return "﻿" + lines.join("\r\n");
}
// Zurückgesendete Offerte parsen: ordnet Einheitspreise per Code/NPK den Positionen zu.
function parseOfferteCsv(text, positionen) {
  const lines = text.replace(/^﻿/, "").trim().split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return { count: 0, preise: {} };
  const norm = (s) => String(s || "").replace(/[^0-9]/g, "");
  const byCode = {}; (positionen || []).forEach((p) => { byCode[norm(p.code)] = p.code; });
  const detect = (line) => { const delim = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ","; return { delim, cells: splitDelimited(line, delim) }; };
  let codeCol = -1, priceCol = -1, start = 0;
  for (let i = 0; i < Math.min(lines.length, 3); i++) {
    const low = detect(lines[i]).cells.map((c) => c.toLowerCase());
    if (low.some((h) => /code|npk/.test(h)) && low.some((h) => /preis|ep/.test(h))) {
      low.forEach((h, idx) => { if (codeCol < 0 && /code|npk/.test(h)) codeCol = idx; if (/preis|ep/.test(h)) priceCol = idx; });
      start = i + 1; break;
    }
  }
  const preise = {}; let count = 0;
  for (let i = start; i < lines.length; i++) {
    const c = detect(lines[i]).cells;
    const code = byCode[norm(codeCol >= 0 ? c[codeCol] : c[0])]; if (!code) continue;
    let price = 0;
    if (priceCol >= 0) price = parseBetrag(c[priceCol]);
    else { for (let k = c.length - 1; k >= 1; k--) { if (c[k] !== "" && parseBetrag(c[k])) { price = parseBetrag(c[k]); break; } } }
    if (price) { preise[code] = price; count++; }
  }
  return { count, preise };
}

// ---------- Persistence ----------
const DB_KEY = "bauadmin:db:v5";
async function loadDB() {
  try {
    const r = localStorage.getItem(DB_KEY); if (r) return JSON.parse(r);
    const old = localStorage.getItem("bauadmin:db:v4"); if (old) return JSON.parse(old);
  } catch (e) {}
  return null;
}
async function saveDB(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
}
function normalize(db) {
  db.projekte = db.projekte.map((p) => ({ mwstSatz: 8.1, teuerungsReserve: 0, strasse: "", plzOrt: "", bauherrAdresse: "", bauleitung: "", gewichtPreis: 70, gewichtReferenzen: 20, gewichtLehrlinge: 10, ...p }));
  db.positionen = (db.positionen || []).map((p) => ({ parentId: null, ...p }));
  ["mutationen", "umbuchungen", "vertraege", "nachtraege", "rechnungen", "angebote", "rapporte", "erwartungen", "snapshots", "beteiligte", "listen"].forEach((c) => { if (!db[c]) db[c] = []; });
  if (!db.firmen) db.firmen = [];
  db.firmen = db.firmen.map((fa) => {
    const n = { strasse: "", plz: "", ort: "", land: "Schweiz", email: "", website: "", mwstNr: "", bkp: "", ampel: "", personen: [], ...fa };
    if (!n.strasse && fa.adresse) n.strasse = fa.adresse;
    if (!n.plz && !n.ort && fa.plzOrt) { const m = String(fa.plzOrt).match(/^\s*(\d{4})\s+(.*)$/); if (m) { n.plz = m[1]; n.ort = m[2]; } else n.ort = fa.plzOrt; }
    if (!n.personen.length && (fa.kontakt || fa.telefon || fa.email)) {
      const t = String(fa.kontakt || "").trim().split(/\s+/);
      n.personen = [{ id: uid(), vorname: t.length > 1 ? t.slice(0, -1).join(" ") : "", nachname: t.length ? t[t.length - 1] : "Kontakt", funktion: "Kontaktperson", email: fa.email || "", festnetz: fa.telefon || "", mobile: "" }];
    }
    n.personen = n.personen.map((pe) => ({ id: pe.id || uid(), vorname: "", nachname: "", funktion: "", email: "", festnetz: "", mobile: "", ...pe }));
    return n;
  });
  db.beteiligte = db.beteiligte.map((b) => ({ rolle: "", hauptpersonId: "", ...b }));
  db.listen = db.listen.map((l) => ({ typ: "rollen", rollen: [], angebotId: "", ...l }));
  // Bauherrschaft und Bauleitung aus den alten Projekt-Textfeldern in den Adressstamm überführen
  db.projekte.forEach((p) => {
    const hat = (rolle) => db.beteiligte.some((b) => b.projektId === p.id && b.rolle === rolle);
    const firmaFuer = (name, adr) => {
      let fa = db.firmen.find((x) => x.name.trim().toLowerCase() === name.trim().toLowerCase());
      if (!fa) {
        fa = { id: uid(), name: name.trim(), strasse: "", plz: "", ort: "", land: "Schweiz", email: "", website: "", mwstNr: "", bkp: "", ampel: "", personen: [] };
        const m = String(adr || "").match(/^\s*(.*?),\s*(\d{4})\s+(.*)$/);
        if (m) { fa.strasse = m[1]; fa.plz = m[2]; fa.ort = m[3]; } else if (adr) fa.strasse = adr;
        db.firmen.push(fa);
      }
      return fa;
    };
    if (p.bauherr && !hat("Bauherrschaft")) db.beteiligte.push({ id: uid(), projektId: p.id, firmaId: firmaFuer(p.bauherr, p.bauherrAdresse).id, rolle: "Bauherrschaft", hauptpersonId: "" });
    if (p.bauleitung && !hat("Bauleitung")) db.beteiligte.push({ id: uid(), projektId: p.id, firmaId: firmaFuer(p.bauleitung, "").id, rolle: "Bauleitung", hauptpersonId: "" });
    // Beauftragte Firmen erscheinen als Unternehmer unter den Beteiligten
    (db.vertraege || []).filter((v) => v.projektId === p.id).forEach((v) => {
      const fa = (db.firmen || []).find((x) => x.id === v.firmaId) || (v.unternehmer ? db.firmen.find((x) => x.name.trim().toLowerCase() === String(v.unternehmer).trim().toLowerCase()) : null);

  db.rechnungen = db.rechnungen.map((r) => ({ typ: r.typ || "rechnung", ...r }));
  db.positionen.forEach((p) => {
    if (p.erwartungManuell !== undefined && p.erwartungManuell !== null && p.erwartungManuell !== "") {
      db.erwartungen.push({ id: uid(), projektId: p.projektId, positionId: p.id, bezeichnung: "Übernommen (alt)", betrag: Number(p.erwartungManuell) || 0, datum: today() });
      delete p.erwartungManuell;
    }

    if (a.leistungen) {

        brutto: b.brutto !== undefined ? b.brutto : (a.leistungen || []).reduce((s, l) => s + (parseBetrag(b.preise?.[l.pos]) || 0) * (Number(l.menge) || 0), 0),

        referenzPunkte: b.referenzPunkte !== undefined ? b.referenzPunkte : (Number(b.referenzNote) || 0) * 20,
        lehrlingPunkte: b.lehrlingPunkte !== undefined ? b.lehrlingPunkte : (Number(b.lehrlingNote) || 0) * 20,
      }));
      const { leistungen, ...rest } = a;
      return { ...rest, bieter };
    }
    a.bieter = (a.bieter || []).map((b) => ({ bemerkung: "", rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, referenzPunkte: 0, lehrlingPunkte: 0, preise: {}, ...b }));
    return a;

  db.angebote = db.angebote.map((a) => ({ positionen: [], bedingungen: "", modus: (a.positionen && a.positionen.length) ? "lv" : "pauschal", ...a, bieter: (a.bieter || []).map((b) => ({ preise: {}, ...b })) }));

}

function reducer(db, a) {
  switch (a.type) {
    case "load": return a.db;
    case "setAktiv": return { ...db, aktiv: a.id };
    case "add": return { ...db, [a.coll]: [...db[a.coll], a.item] };
    case "addMany": return { ...db, [a.coll]: [...db[a.coll], ...a.items] };
    case "update": return { ...db, [a.coll]: db[a.coll].map((x) => (x.id === a.id ? { ...x, ...a.patch } : x)) };
    case "remove": {
      if (a.coll === "positionen") {
        const descend = new Set([a.id]); let added = true;
        while (added) { added = false; db.positionen.forEach((p) => { if (p.parentId && descend.has(p.parentId) && !descend.has(p.id)) { descend.add(p.id); added = true; } }); }
        return { ...db, positionen: db.positionen.filter((x) => !descend.has(x.id)) };
      }
      return { ...db, [a.coll]: db[a.coll].filter((x) => x.id !== a.id) };
    }
    case "seed": return a.db;
    default: return db;
  }
}

// ---------- Cost engine v4 ----------
function eigenPosition(pos, d) {
  const mutSumme = d.mutationen.filter((m) => m.positionId === pos.id).reduce((s, m) => s + (Number(m.betrag) || 0), 0);
  const umbIn = d.umbuchungen.filter((u) => u.nachPositionId === pos.id).reduce((s, u) => s + (Number(u.betrag) || 0), 0);
  const umbOut = d.umbuchungen.filter((u) => u.vonPositionId === pos.id).reduce((s, u) => s + (Number(u.betrag) || 0), 0);
  const kvRevidiert = (Number(pos.kv) || 0) + mutSumme + umbIn - umbOut;

  const vts = d.vertraege.filter((v) => v.positionId === pos.id);
  const vertragNetto = vts.reduce((s, v) => s + konditionenNetto(v.betrag, v, true), 0);
  const teuerung = vts.reduce((s, v) => s + (Number(v.teuerung) || 0), 0);
  const vIds = vts.map((v) => v.id);
  let ntGen = 0, ntPend = 0;
  d.nachtraege.forEach((n) => {
    const v = vts.find((x) => x.id === n.vertragId); if (!v) return;
    const net = konditionenNetto(n.betrag, v, false);
    if (n.status === "genehmigt") ntGen += net; else if (n.status === "pendent") ntPend += net;
  });
  const beauftragt = vertragNetto + ntGen + teuerung;

  let regieUeber = 0, rapportSumme = 0;
  vts.forEach((v) => {
    const rs = d.rapporte.filter((r) => r.vertragId === v.id).reduce((s, r) => s + rapportNetto(r, v), 0);
    rapportSumme += rs; regieUeber += Math.max(0, rs - (Number(v.regieBudget) || 0));
  });

  const erwZeilen = d.erwartungen.filter((e) => e.positionId === pos.id).reduce((s, e) => s + (Number(e.betrag) || 0), 0);
  const erwartung = erwZeilen + regieUeber;

  const rechs = d.rechnungen.filter((r) => vIds.includes(r.vertragId) || r.positionId === pos.id);
  const bezahlt = rechs.filter((r) => r.status === "bezahlt").reduce((s, r) => s + (Number(r.betrag) || 0), 0);
  const fakturiert = rechs.reduce((s, r) => s + (Number(r.betrag) || 0), 0);

  const basis = beauftragt > 0 ? beauftragt + ntPend : kvRevidiert;
  const prognose = Math.max(basis + erwartung, fakturiert);
  return { kv: Number(pos.kv) || 0, mutSumme: mutSumme + umbIn - umbOut, kvRevidiert, vertragNetto, ntGen, ntPend, teuerung, beauftragt, rapportSumme, regieUeber, erwartung, prognose, bezahlt, fakturiert };
}
const prognoseBasis = (e) => (e.beauftragt > 0 ? e.beauftragt + e.ntPend : e.kvRevidiert);

function orderedPositions(positionen) {
  const byParent = {}; positionen.forEach((p) => { const k = p.parentId || "__root"; (byParent[k] = byParent[k] || []).push(p); });
  const sortFn = (a, b) => String(a.bkp).localeCompare(String(b.bkp), "de", { numeric: true });
  const out = []; const seen = new Set();
  function walk(key, depth) { (byParent[key] || []).sort(sortFn).forEach((p) => { if (seen.has(p.id)) return; seen.add(p.id); out.push({ ...p, depth }); walk(p.id, depth + 1); }); }
  walk("__root", 0);
  positionen.forEach((p) => { if (!seen.has(p.id)) { seen.add(p.id); out.push({ ...p, depth: 0 }); } });
  return out;
}

function useKostenStand(d, projekt) {
  return useMemo(() => {
    const eig = {}; d.positionen.forEach((p) => { eig[p.id] = eigenPosition(p, d); });
    const childrenOf = {}; d.positionen.forEach((p) => { const k = p.parentId || "__root"; (childrenOf[k] = childrenOf[k] || []).push(p.id); });
    const roll = {}; const visiting = new Set();
    function computeRoll(id) {
      if (roll[id] || visiting.has(id)) return; visiting.add(id);
      const r = { ...eig[id] };
      (childrenOf[id] || []).forEach((cid) => { computeRoll(cid); METRICS.forEach((k) => r[k] += roll[cid][k]); });
      r.abwKv = r.prognose - r.kv; r.offen = r.prognose - r.bezahlt;
      roll[id] = r; visiting.delete(id);
    }
    d.positionen.forEach((p) => computeRoll(p.id));
    const ordered = orderedPositions(d.positionen).map((p) => ({ pos: p, depth: p.depth, eigen: eig[p.id], roll: roll[p.id], hasChildren: (childrenOf[p.id] || []).length > 0 }));
    const total = {}; METRICS.forEach((k) => total[k] = d.positionen.reduce((s, p) => s + eig[p.id][k], 0));
    total.abwKv = total.prognose - total.kv; total.offen = total.prognose - total.bezahlt;
    const groups = {};
    d.positionen.forEach((p) => {
      const g = bkpGroup(p.bkp);
      if (!groups[g]) { groups[g] = { g, name: BKP_GROUPS[g] || "—" }; METRICS.forEach((k) => groups[g][k] = 0); }
      METRICS.forEach((k) => groups[g][k] += eig[p.id][k]);
    });
    Object.values(groups).forEach((g) => { g.abwKv = g.prognose - g.kv; });
    const satz = Number(projekt?.mwstSatz) || 0;
    const resSatz = Number(projekt?.teuerungsReserve) || 0;
    const mwst = total.prognose * satz / 100;
    const reserve = total.kvRevidiert * resSatz / 100;
    return { ordered, total, groups: Object.values(groups).sort((a, b) => a.g.localeCompare(b.g)), satz, resSatz, mwst, brutto: total.prognose + mwst, reserve };
  }, [d, projekt]);
}

function posSelectOptions(positionen) {
  return orderedPositions(positionen).map((p) => ({ id: p.id, depth: p.depth, label: "  ".repeat(p.depth) + (p.depth ? "↳ " : "") + p.bkp + " " + p.bezeichnung }));
}
function descendantIds(positionen, id) {
  const set = new Set(); let added = true;
  while (added) { added = false; positionen.forEach((p) => { if ((p.parentId === id || set.has(p.parentId)) && !set.has(p.id)) { set.add(p.id); added = true; } }); }
  return set;
}

// =========================================================================
//  KOSTENSTAND-VERLAUF (Chart)
// =========================================================================
const VERLAUF_SERIEN = [
  { key: "prognose", label: "Prognose", col: "#1d4ed8", dash: "" },
  { key: "bezahlt", label: "Bezahlt", col: "#0d9488", dash: "" },
  { key: "kvRevidiert", label: "KV revidiert", col: "#78716c", dash: "6 4" },
];
function KostenverlaufChart({ punkte }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const W = 760, H = 270, L = 56, R = 104, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const maxY = Math.max(1, ...punkte.flatMap((s) => VERLAUF_SERIEN.map((k) => Number(s[k.key]) || 0))) * 1.08;
  const x = (i) => punkte.length === 1 ? L + iw / 2 : L + iw * i / (punkte.length - 1);
  const y = (v) => T + ih - ih * (Number(v) || 0) / maxY;
  const fmt = (v) => v >= 1e6 ? (v / 1e6).toLocaleString("de-CH", { maximumFractionDigits: 1 }) + " Mio" : Math.round(v / 1000) + "k";
  const path = (key) => punkte.map((s, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");
  function onMove(e) {
    const rect = wrapRef.current?.getBoundingClientRect(); if (!rect) return;
    const px = (e.clientX - rect.left) / rect.width * W;
    let best = 0, bd = Infinity;
    punkte.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; best = i; } });
    setHover(best);
  }
  const hp = hover != null ? punkte[hover] : null;
  return (
    <div>
      <div className="flex gap-4 flex-wrap mb-2 text-xs text-stone-600">
        {VERLAUF_SERIEN.map((s) => (
          <span key={s.key} className="inline-flex items-center gap-1.5">
            <svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke={s.col} strokeWidth="2" strokeDasharray={s.dash} /></svg>{s.label}
          </span>
        ))}
      </div>
      <div ref={wrapRef} className="relative" onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Kostenstand-Verlauf">
          {[0, 0.25, 0.5, 0.75, 1].map((f) => (
            <g key={f}>
              <line x1={L} y1={y(f * maxY)} x2={W - R} y2={y(f * maxY)} stroke="#e7e5e4" strokeWidth="1" />
              <text x={L - 6} y={y(f * maxY) + 3.5} textAnchor="end" fontSize="10" fill="#a8a29e">{fmt(f * maxY)}</text>
            </g>
          ))}
          {hover != null && <line x1={x(hover)} y1={T} x2={x(hover)} y2={T + ih} stroke="#a8a29e" strokeWidth="1" strokeDasharray="3 3" />}
          {VERLAUF_SERIEN.map((s) => <path key={s.key} d={path(s.key)} fill="none" stroke={s.col} strokeWidth="2" strokeDasharray={s.dash} strokeLinejoin="round" />)}
          {VERLAUF_SERIEN.map((s) => punkte.map((pt, i) => (
            <circle key={s.key + i} cx={x(i)} cy={y(pt[s.key])} r={hover === i ? 4.5 : 3} fill={s.col} stroke="#fff" strokeWidth="1.5" />
          )))}
          {(() => {
            const last = punkte[punkte.length - 1];
            const labs = VERLAUF_SERIEN.map((s) => ({ s, ly: y(last[s.key]) })).sort((a, b) => a.ly - b.ly);
            for (let i = 1; i < labs.length; i++) if (labs[i].ly - labs[i - 1].ly < 12) labs[i].ly = labs[i - 1].ly + 12;
            return labs.map(({ s, ly }) => <text key={s.key} x={W - R + 8} y={ly + 3.5} fontSize="10" fontWeight="600" fill={s.col}>{s.label}</text>);
          })()}
          {punkte.map((pt, i) => (punkte.length <= 8 || i === 0 || i === punkte.length - 1 || hover === i) && (
            <text key={i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="10" fill="#a8a29e" className="tabular-nums">{pt.datum}{pt.live ? " (heute)" : ""}</text>
          ))}
        </svg>
        {hp && (
          <div className="absolute top-2 bg-white border border-stone-200 rounded-md shadow-lg px-3 py-2 text-xs pointer-events-none z-10" style={{ left: `min(max(${x(hover) / W * 100}% - 70px, 4px), calc(100% - 150px))` }}>
            <div className="font-medium tabular-nums mb-1">{hp.datum}{hp.live ? " (heute, live)" : ""}</div>
            {VERLAUF_SERIEN.map((s) => (
              <div key={s.key} className="flex items-center justify-between gap-3">
                <span className="inline-flex items-center gap-1.5 text-stone-500"><span className="w-2 h-2 rounded-full inline-block" style={{ background: s.col }} />{s.label}</span>
                <span className="tabular-nums font-medium">{chf(hp[s.key])}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// Rolle wird erst beim Verlassen des Felds übernommen — sonst würde die Gruppierung bei jedem Tastendruck umsortieren
// Zahlenfeld für Tabellenzellen: während des Tippens bleibt der Rohtext stehen (kein Sprung auf 0),
// übernommen wird die geparste Zahl beim Verlassen des Felds
function ZahlZelle({ wert, onSpeichern, className }) {
  const [entwurf, setEntwurf] = useState(String(wert ?? ""));
  const [aktiv, setAktiv] = useState(false);
  useEffect(() => { if (!aktiv) setEntwurf(String(wert ?? "")); }, [wert, aktiv]);
  const uebernehmen = () => { setAktiv(false); const n = parseBetrag(entwurf); setEntwurf(String(n)); if (n !== Number(wert)) onSpeichern(n); };
  return (
    <input
      className={className}
      value={entwurf}
      onFocus={() => setAktiv(true)}
      onChange={(e) => setEntwurf(e.target.value)}
      onBlur={uebernehmen}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") { setEntwurf(String(wert ?? "")); setAktiv(false); e.currentTarget.blur(); } }}
    />
  );
}

function RolleFeld({ wert, onSpeichern }) {
  const [entwurf, setEntwurf] = useState(wert);
  const [aktiv, setAktiv] = useState(false);
  useEffect(() => { if (!aktiv) setEntwurf(wert); }, [wert, aktiv]);
  return (
    <input
      className={inputCls}
      list="rollenliste"
      value={entwurf}
      onFocus={() => setAktiv(true)}
      onChange={(e) => setEntwurf(e.target.value)}
      onBlur={() => { setAktiv(false); if (entwurf !== wert) onSpeichern(entwurf.trim()); }}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") { setEntwurf(wert); setAktiv(false); e.currentTarget.blur(); } }}
    />
  );
}

function ProjektBeteiligteView({ db, dispatch, projektId, firmen }) {

  const rollenVorschlag = useMemo(() => {
    const verwendet = (db.beteiligte || []).map((b) => b.rolle).filter(Boolean);

  const gruppiert = useMemo(() => {
    const m = new Map();

    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], "de"));

// Zeilen einer Liste — je nach Typ aus Beteiligten oder aus den Anbietern einer Ausschreibung
function listenZeilen(liste, db, d, projektId) {
  if (liste.typ === "submittenten") {
    const quellen = liste.angebotId ? d.angebote.filter((a) => a.id === liste.angebotId) : d.angebote;
    const out = [];
    quellen.forEach((a) => (a.bieter || []).forEach((b) => {
      const fa = findFirma(db.firmen, b.firmaId, b.name);
      out.push({ rolle: a.titel, firma: fa, name: b.name, person: null, adresse: fa ? firmaAdresse(fa) : "", email: fa?.email || "", festnetz: "", mobile: "", ampel: fa?.ampel || "" });
    }));
    return out;
  }
  return projektBeteiligte(db, projektId)
    .filter((b) => !liste.rollen.length || liste.rollen.includes(b.rolle || "Ohne Rolle"))
    .map((b) => ({ rolle: b.rolle || "Ohne Rolle", firma: b.firma, name: b.firma.name, person: b.person, adresse: firmaAdresse(b.firma), email: b.person?.email || b.firma.email || "", festnetz: b.person?.festnetz || "", mobile: b.person?.mobile || "", ampel: b.firma.ampel || "" }))
    .sort((a, b) => a.rolle.localeCompare(b.rolle, "de") || a.name.localeCompare(b.name, "de"));
}

function ListenVorschau({ liste, db, d, projektId }) {
  const zeilen = listenZeilen(liste, db, d, projektId);
  if (!zeilen.length) return <div className="text-sm text-stone-500 border-t border-stone-100 pt-3">Diese Liste ist noch leer.</div>;
  return (
    <div className="border-t border-stone-100 pt-3 overflow-x-auto">
      <table className="w-full text-sm">
        <thead className="text-stone-500 text-xs"><tr><th className="text-left font-medium py-1.5">{liste.typ === "submittenten" ? "Ausschreibung" : "Rolle"}</th><th className="text-left font-medium py-1.5">Firma</th><th className="text-left font-medium py-1.5">Person</th><th className="text-left font-medium py-1.5">Telefon</th><th className="text-left font-medium py-1.5">E-Mail</th></tr></thead>
        <tbody>{zeilen.map((z, i) => (
          <tr key={i} className="border-t border-stone-100">
            <td className="py-1.5 pr-3 text-stone-500">{z.rolle}</td>
            <td className="py-1.5 pr-3 font-medium"><span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full inline-block border border-stone-300" style={{ background: AMPEL[z.ampel]?.punkt || "transparent" }} />{z.name}</span></td>
            <td className="py-1.5 pr-3">{personName(z.person) || "–"}</td>
            <td className="py-1.5 pr-3 tabular-nums text-stone-600">{[z.mobile, z.festnetz].filter(Boolean).join(" / ") || "–"}</td>
            <td className="py-1.5 text-stone-600">{z.email || "–"}</td>
          </tr>
        ))}</tbody>
      </table>
      <div className="text-xs text-stone-400 mt-2">{zeilen.length} Eintr{zeilen.length === 1 ? "ag" : "äge"}</div>
    </div>
  );
}

function ListeDoc({ liste, db, d, projekt, projektId }) {
  const zeilen = listenZeilen(liste, db, d, projektId);
  const gruppen = [];
  zeilen.forEach((z) => { const g = gruppen.find((x) => x.rolle === z.rolle); if (g) g.zeilen.push(z); else gruppen.push({ rolle: z.rolle, zeilen: [z] }); });
  return (
    <div className="text-[13px] leading-snug">
      <DocKopf projekt={projekt} typ={liste.name} rollen={projektRollen(db, projekt)} />
      {!zeilen.length ? <div className="text-stone-500">Diese Liste ist leer.</div> : gruppen.map((g) => (
        <div key={g.rolle} className="mb-5 break-inside-avoid">
          <div className="text-xs uppercase tracking-wide text-stone-500 border-b border-stone-300 pb-1 mb-2">{g.rolle}</div>
          <table className="w-full">
            <thead className="text-[11px] text-stone-500"><tr><th className="text-left font-medium pb-1">Firma / Adresse</th><th className="text-left font-medium pb-1">Person</th><th className="text-left font-medium pb-1">Telefon</th><th className="text-left font-medium pb-1">E-Mail</th></tr></thead>

                <td className="py-1.5 pr-3">{personName(z.person) || "—"}{z.person?.funktion ? <div className="text-stone-500 text-[11px]">{z.person.funktion}</div> : null}</td>

    setSaved(true); setTimeout(() => setSaved(false), 2000);
  }
  return (
    <div className="space-y-4 max-w-2xl">
      <div className={`${card} p-5 space-y-3`}>
        <h2 className="font-semibold">Projektadresse</h2>
        <Field label="Projektname"><input className={inputCls} value={f.name || ""} onChange={(e) => setF({ ...f, name: e.target.value })} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Strasse / Nr."><input className={inputCls} value={f.strasse || ""} onChange={(e) => setF({ ...f, strasse: e.target.value })} placeholder="Seestrasse 12" /></Field>
          <Field label="PLZ / Ort"><input className={inputCls} value={f.plzOrt || f.ort || ""} onChange={(e) => setF({ ...f, plzOrt: e.target.value })} placeholder="8000 Zürich" /></Field>
        </div>
      </div>
      <div className={`${card} p-5 space-y-3`}>
        <h2 className="font-semibold">Bauherrschaft & Bauleitung</h2>
        <div className="grid grid-cols-2 gap-3">


        </div>
        <div className="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2.5 text-sm text-stone-600">Bauherrschaft, Bauleitung und weitere Beteiligte werden im Reiter <span className="font-medium">Beteiligte</span> zugeordnet — mit Firma und zuständiger Person aus dem Adressstamm. Alle Druckdokumente ziehen die Angaben von dort.</div>
      </div>
      <div className={`${card} p-5 space-y-3`}>
        <h2 className="font-semibold">Abrechnungsparameter</h2>
        <div className="grid grid-cols-2 gap-3">
          <Field label="MwSt-Satz % (Standard CH 8.1)"><input className={inputCls} value={f.mwstSatz} onChange={(e) => setF({ ...f, mwstSatz: e.target.value })} /></Field>
          <Field label="Teuerungsreserve % (auf KV rev.)"><input className={inputCls} value={f.teuerungsReserve} onChange={(e) => setF({ ...f, teuerungsReserve: e.target.value })} /></Field>
        </div>
        <p className="text-xs text-stone-400">Alle Beträge im Tool sind netto. MwSt und Teuerungsreserve werden in der Bauabrechnung separat ausgewiesen.</p>
      </div>
      <div className={`${card} p-5 space-y-3`}>
        <h2 className="font-semibold">Angebotsbewertung — Standard-Gewichtung {wSum !== 100 && <span className="text-red-600 text-sm font-normal">(Summe {wSum}% — sollte 100% sein)</span>}</h2>
        <div className="grid grid-cols-3 gap-3">
          <Field label="Preis %"><input className={inputCls} value={f.gewichtPreis} onChange={(e) => setF({ ...f, gewichtPreis: e.target.value })} /></Field>
          <Field label="Referenzen %"><input className={inputCls} value={f.gewichtReferenzen} onChange={(e) => setF({ ...f, gewichtReferenzen: e.target.value })} /></Field>
          <Field label="Lehrlingsausbildung %"><input className={inputCls} value={f.gewichtLehrlinge} onChange={(e) => setF({ ...f, gewichtLehrlinge: e.target.value })} /></Field>

        <p className="text-xs text-stone-400">Gilt als Vorgabe für neue Ausschreibungen; pro Ausschreibung übersteuerbar. Punkte 1–100, Preispunkte = 100 × günstigste Nettosumme ÷ Nettosumme.</p>

      <div className="flex items-center gap-3">
        <button className={btnPrimary} onClick={save}>Speichern</button>
        {saved && <span className="text-sm text-emerald-600">✓ gespeichert</span>}
      </div>
    </div>
  );
}

function Dashboard({ ks, d, dispatch, projektId }) {
  const t = ks.total;
  if (!ks.ordered.length) return <Empty text="Noch keine BKP-Positionen erfasst. Importiere zuerst den Kostenvoranschlag." />;
  const over = ks.ordered.filter((z) => !z.hasChildren && z.roll.abwKv > 0).sort((a, b) => b.roll.abwKv - a.roll.abwKv).slice(0, 5);
  const snaps = [...(d.snapshots || [])].sort((a, b) => String(a.datum).localeCompare(String(b.datum)));
  const live = { datum: today(), live: true, kv: t.kv, kvRevidiert: t.kvRevidiert, beauftragt: t.beauftragt, erwartung: t.erwartung, prognose: t.prognose, bezahlt: t.bezahlt };
  const punkte = [...snaps.filter((s) => s.datum !== today()), live];
  function festhalten() {
    const heute = (d.snapshots || []).find((s) => s.datum === today());
    const item = { projektId, datum: today(), kv: t.kv, kvRevidiert: t.kvRevidiert, beauftragt: t.beauftragt, erwartung: t.erwartung, prognose: t.prognose, bezahlt: t.bezahlt };
    if (heute) dispatch({ type: "update", coll: "snapshots", id: heute.id, patch: item });
    else dispatch({ type: "add", coll: "snapshots", item: { id: uid(), ...item } });
  }
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <Stat label="KV revidiert" value={chf(t.kvRevidiert)} sub="Budget netto" />
        <Stat label="Beauftragt" value={chf(t.beauftragt)} sub="Verträge netto + NT + Teuerung" />
        <Stat label="Prognose" value={chf(t.prognose)} accent={t.abwKv > 0 ? "text-red-600" : "text-emerald-600"} sub={`davon Erwartung ${chf(t.erwartung)}`} />
        <Stat label="Bezahlt" value={chf(t.bezahlt)} sub={`offen ${chf(t.offen)}`} />
      </div>
      <div className={`${card} p-5`}>
        <div className="flex items-baseline justify-between mb-2"><h2 className="font-semibold">Prognose vs. Budget (KV)</h2><div>Abweichung: <Abw v={t.abwKv} /></div></div>
        <Ampel kv={t.kv} prognose={t.prognose} />
        <div className="flex justify-between text-xs text-stone-500 mt-1.5 tabular-nums"><span>KV-Budget: {chf(t.kv)}</span><span>Prognose: {chf(t.prognose)} · brutto {chf(ks.brutto)}</span></div>
      </div>
      <div className={`${card} p-5`}>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <h2 className="font-semibold">Kostenstand-Verlauf</h2>
          <button className={btnGhost} onClick={festhalten} title="Speichert den heutigen Kostenstand als Punkt in der Historie">📌 Kostenstand festhalten</button>
        </div>
        <KostenverlaufChart punkte={punkte} />
        {snaps.length > 0 && (
          <div className="mt-3 overflow-x-auto"><table className="w-full text-xs">
            <thead className="text-stone-500"><tr><th className="text-left font-medium py-1 pr-2">Datum</th><th className="text-right font-medium py-1 px-2">KV rev.</th><th className="text-right font-medium py-1 px-2">Beauftragt</th><th className="text-right font-medium py-1 px-2">Erwartung</th><th className="text-right font-medium py-1 px-2">Prognose</th><th className="text-right font-medium py-1 px-2">Bezahlt</th><th className="w-10"></th></tr></thead>
            <tbody>{snaps.map((s) => (
              <tr key={s.id} className="border-t border-stone-100">
                <td className="py-1 pr-2 tabular-nums">{s.datum}</td>
                <td className="py-1 px-2 text-right tabular-nums">{chf(s.kvRevidiert)}</td>
                <td className="py-1 px-2 text-right tabular-nums">{chf(s.beauftragt)}</td>
                <td className="py-1 px-2 text-right tabular-nums">{chf(s.erwartung)}</td>
                <td className="py-1 px-2 text-right tabular-nums font-medium">{chf(s.prognose)}</td>
                <td className="py-1 px-2 text-right tabular-nums">{chf(s.bezahlt)}</td>
                <td className="py-1 text-right"><button className="text-red-600 hover:underline" onClick={() => dispatch({ type: "remove", coll: "snapshots", id: s.id })}>×</button></td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
        {!snaps.length && <p className="text-xs text-stone-400 mt-2">Noch keine gespeicherten Kostenstände — die Kurve zeigt nur den heutigen Live-Wert. Halte den Stand z.B. monatlich fest, um den Verlauf über die Bauzeit zu sehen.</p>}
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div className={`${card} p-5`}>
          <h2 className="font-semibold mb-3">Kostengruppen (BKP)</h2>
          <table className="w-full text-sm">
            <thead><tr className="text-stone-500 text-xs"><th className="text-left font-medium pb-2">Gruppe</th><th className="text-right font-medium pb-2">KV rev.</th><th className="text-right font-medium pb-2">Prognose</th><th className="text-right font-medium pb-2">Abw.</th></tr></thead>
            <tbody>{ks.groups.map((g) => (<tr key={g.g} className="border-t border-stone-100"><td className="py-1.5"><span className="font-medium">{g.g}</span> <span className="text-stone-500">{g.name}</span></td><td className="text-right py-1.5"><Num v={g.kvRevidiert} /></td><td className="text-right py-1.5"><Num v={g.prognose} /></td><td className="text-right py-1.5"><Abw v={g.abwKv} /></td></tr>))}</tbody>
          </table>
        </div>
        <div className={`${card} p-5`}>
          <h2 className="font-semibold mb-3">Grösste Mehrkosten (Prognose vs. KV)</h2>
          {over.length === 0 ? <p className="text-sm text-stone-400">Keine Position über Budget.</p> : (
            <ul className="space-y-2">{over.map((z) => (<li key={z.pos.id} className="flex items-center justify-between text-sm"><span className="truncate pr-2"><span className="font-medium tabular-nums">{z.pos.bkp}</span> {z.pos.bezeichnung}</span><Abw v={z.roll.abwKv} /></li>))}</ul>
          )}
        </div>
      </div>
    </div>
  );
}

                  <td className="px-3 py-2 text-right whitespace-nowrap">

function PositionEditor({ pos, positionen, onClose, onSave }) {
  const [f, setF] = useState({ bkp: pos.bkp || "", bezeichnung: pos.bezeichnung || "", kv: pos.kv ?? "", parentId: pos.parentId ?? null });
  const exclude = pos.id ? descendantIds(positionen, pos.id) : new Set();
  const opts = posSelectOptions(positionen).filter((o) => o.id !== pos.id && !exclude.has(o.id));
  return (
    <Modal title={pos.id ? "Position bearbeiten" : (pos.parentId ? "Neue Unterposition" : "Neue BKP-Hauptposition")} onClose={onClose}>
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-3">
          <Field label="BKP-Nr."><input className={inputCls} value={f.bkp} onChange={(e) => setF({ ...f, bkp: e.target.value })} placeholder="211 / 211.1" /></Field>
          <div className="col-span-2"><Field label="Bezeichnung"><input className={inputCls} value={f.bezeichnung} onChange={(e) => setF({ ...f, bezeichnung: e.target.value })} /></Field></div>
        </div>
        <Field label="Übergeordnete Position (optional)">
          <select className={inputCls} value={f.parentId || ""} onChange={(e) => setF({ ...f, parentId: e.target.value || null })}>
            <option value="">— keine (Hauptposition) —</option>
            {opts.map((o) => <option key={o.id} value={o.id}>{o.label.trim()}</option>)}
          </select>
        </Field>
        <Field label="KV-Betrag netto (CHF)"><input className={inputCls} value={f.kv} onChange={(e) => setF({ ...f, kv: e.target.value })} placeholder="850000" /></Field>
        <div className="flex justify-end gap-2 pt-1">
          <button className={btnGhost} onClick={onClose}>Abbrechen</button>
          <button className={btnPrimary} disabled={!f.bezeichnung} onClick={() => onSave({ ...pos, bkp: f.bkp, bezeichnung: f.bezeichnung, kv: parseBetrag(f.kv), parentId: f.parentId })}>Speichern</button>
        </div>
      </div>
    </Modal>
  );
}

function KvImport({ onClose, onImport }) {
  const [text, setText] = useState("BKP;Bezeichnung;Betrag\n211;Baumeisterarbeiten;0\n211.1;Aushub;300'000\n211.4;Beton- und Stahlbeton;550'000\n221;Fenster;180'000");
  const preview = useMemo(() => parseKvText(text), [text]);
  return (
    <Modal title="Kostenvoranschlag importieren" onClose={onClose} wide>
      <p className="text-sm text-stone-500 mb-2">Spalten: BKP · Bezeichnung · Betrag netto. Unterpositionen (211.1) werden automatisch unter ihre Hauptposition (211) gehängt.</p>
      <textarea className={`${inputCls} font-mono h-40`} value={text} onChange={(e) => setText(e.target.value)} />
      <div className="mt-3"><div className="text-xs font-medium text-stone-500 mb-1">Vorschau ({preview.length} Positionen)</div>
        <div className="max-h-48 overflow-y-auto border border-stone-200 rounded-md"><table className="w-full text-sm"><tbody>
          {preview.map((r, i) => (<tr key={i} className="border-b border-stone-100 last:border-0"><td className="px-3 py-1 font-medium tabular-nums w-20">{r.bkp}</td><td className="px-3 py-1">{r.bezeichnung}</td><td className="px-3 py-1 text-right tabular-nums">{chf(r.kv)}</td></tr>))}
        </tbody></table></div>
      </div>
      <div className="flex justify-end gap-2 pt-4"><button className={btnGhost} onClick={onClose}>Abbrechen</button><button className={btnPrimary} disabled={!preview.length} onClick={() => onImport(preview)}>{preview.length} Positionen importieren</button></div>
    </Modal>
  );
}

    <div className="space-y-4">

          <Field label="Betrag (+/−)"><input className={inputCls} value={f.betrag} onChange={(e) => setF({ ...f, betrag: e.target.value })} placeholder="-15000" /></Field>
          <Field label="Grund"><input className={inputCls} value={f.grund} onChange={(e) => setF({ ...f, grund: e.target.value })} /></Field>
          <Field label="Datum"><input type="date" className={inputCls} value={f.datum} onChange={(e) => setF({ ...f, datum: e.target.value })} /></Field>
          <button className={btnPrimary} disabled={!f.positionId || !f.betrag} onClick={() => { dispatch({ type: "add", coll: "mutationen", item: { id: uid(), projektId, ...f, betrag: parseBetrag(f.betrag) } }); setF({ positionId: "", betrag: "", grund: "", datum: today() }); }}>Erfassen</button>
        </div>
      </div>
      {!d.mutationen.length ? <Empty text="Keine Mutationen erfasst." /> : (
        <div className={`${card} overflow-x-auto`}><table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs"><tr><th className="text-left font-medium px-3 py-2">Datum</th><th className="text-left font-medium px-3 py-2">Position</th><th className="text-left font-medium px-3 py-2">Grund</th><th className="text-right font-medium px-3 py-2">Betrag</th><th className="w-12"></th></tr></thead>
          <tbody>{d.mutationen.map((m) => (<tr key={m.id} className="border-t border-stone-100"><td className="px-3 py-2 tabular-nums text-stone-500">{m.datum}</td><td className="px-3 py-2">{posLabel(m.positionId)}</td><td className="px-3 py-2 text-stone-600">{m.grund}</td><td className="px-3 py-2 text-right"><Abw v={m.betrag} /></td><td className="px-3 py-2 text-right"><button className="text-red-600 text-xs hover:underline" onClick={() => dispatch({ type: "remove", coll: "mutationen", id: m.id })}>Lö.</button></td></tr>))}</tbody>
        </table></div>
      )}
    </div>
  );
}

function UmbuchungenView({ d, dispatch, projektId }) {

  return (
    <div className="space-y-4">
      <p className="text-sm text-stone-500">Umbuchungen verschieben KV-Budget von einem BKP in einen anderen. Das Gesamtbudget bleibt unverändert (Abgang bei «von», Zugang bei «nach»).</p>
      <div className={`${card} p-4`}>
        <div className="grid grid-cols-1 md:grid-cols-[1fr_1fr_130px_1fr_130px_auto] gap-3 items-end">
          <Field label="Von BKP"><select className={inputCls} value={f.vonPositionId} onChange={(e) => setF({ ...f, vonPositionId: e.target.value })}><option value="">wählen…</option>{opts.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
          <Field label="Nach BKP"><select className={inputCls} value={f.nachPositionId} onChange={(e) => setF({ ...f, nachPositionId: e.target.value })}><option value="">wählen…</option>{opts.filter((o) => o.id !== f.vonPositionId).map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
          <Field label="Betrag"><input className={inputCls} value={f.betrag} onChange={(e) => setF({ ...f, betrag: e.target.value })} placeholder="10000" /></Field>
          <Field label="Grund"><input className={inputCls} value={f.grund} onChange={(e) => setF({ ...f, grund: e.target.value })} /></Field>
          <Field label="Datum"><input type="date" className={inputCls} value={f.datum} onChange={(e) => setF({ ...f, datum: e.target.value })} /></Field>
          <button className={btnPrimary} disabled={!f.vonPositionId || !f.nachPositionId || !f.betrag || f.vonPositionId === f.nachPositionId} onClick={() => { dispatch({ type: "add", coll: "umbuchungen", item: { id: uid(), projektId, ...f, betrag: Math.abs(parseBetrag(f.betrag)) } }); setF({ vonPositionId: "", nachPositionId: "", betrag: "", grund: "", datum: today() }); }}>Umbuchen</button>
        </div>
      </div>
      {!d.umbuchungen.length ? <Empty text="Keine Umbuchungen erfasst." /> : (
        <div className={`${card} overflow-x-auto`}><table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs"><tr><th className="text-left font-medium px-3 py-2">Datum</th><th className="text-left font-medium px-3 py-2">Von</th><th className="text-left font-medium px-3 py-2">Nach</th><th className="text-left font-medium px-3 py-2">Grund</th><th className="text-right font-medium px-3 py-2">Betrag</th><th className="w-12"></th></tr></thead>
          <tbody>{d.umbuchungen.map((u) => (<tr key={u.id} className="border-t border-stone-100"><td className="px-3 py-2 tabular-nums text-stone-500">{u.datum}</td><td className="px-3 py-2">{posLabel(u.vonPositionId)}</td><td className="px-3 py-2">{posLabel(u.nachPositionId)}</td><td className="px-3 py-2 text-stone-600">{u.grund}</td><td className="px-3 py-2 text-right tabular-nums">{chf(u.betrag)}</td><td className="px-3 py-2 text-right"><button className="text-red-600 text-xs hover:underline" onClick={() => dispatch({ type: "remove", coll: "umbuchungen", id: u.id })}>Lö.</button></td></tr>))}</tbody>
        </table></div>
      )}
    </div>
  );
}

function VertraegeView({ d, dispatch, projektId, projekt, firmen, db }) {
  const rollen = projektRollen(db, projekt);
  const [vForm, setVForm] = useState(null);
  const [ntFor, setNtFor] = useState(null);
  const [printV, setPrintV] = useState(null);
  const posOrder = useMemo(() => { const m = {}; orderedPositions(d.positionen).forEach((p, i) => { m[p.id] = i; }); return m; }, [d.positionen]);
  const garantieRows = d.vertraege.filter((v) => v.abnahme || Number(v.rueckbehaltPct) > 0 || v.buergschaft);
  const sorted = useMemo(() => [...d.vertraege].sort((a, b) => { const pa = posOrder[a.positionId] ?? 99999, pb = posOrder[b.positionId] ?? 99999; return pa !== pb ? pa - pb : String(a.unternehmer || "").localeCompare(String(b.unternehmer || ""), "de"); }), [d.vertraege, posOrder]);
  const totalBeauftragt = d.vertraege.reduce((s, v) => { const ntGen = d.nachtraege.filter((n) => n.vertragId === v.id && n.status === "genehmigt").reduce((a, n) => a + konditionenNetto(n.betrag, v, false), 0); return s + konditionenNetto(v.betrag, v, true) + ntGen + (Number(v.teuerung) || 0); }, 0);

  const rows = [];
  let lastGroup = null;
  sorted.forEach((v) => {
    const pos = d.positionen.find((p) => p.id === v.positionId);
    const g = pos ? bkpGroup(pos.bkp) : "?";
    if (g !== lastGroup) { lastGroup = g; rows.push(<div key={"g" + g} className="flex items-center gap-2 pt-3 first:pt-0"><span className="text-xs font-semibold text-stone-500 uppercase tracking-wide whitespace-nowrap">BKP {g} · {BKP_GROUPS[g] || "—"}</span><div className="flex-1 h-px bg-stone-200" /></div>); }
    const netto = konditionenNetto(v.betrag, v, true);
    const nts = d.nachtraege.filter((n) => n.vertragId === v.id);
    const ntGen = nts.filter((n) => n.status === "genehmigt").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
    const ntPend = nts.filter((n) => n.status === "pendent").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
    const rapSum = d.rapporte.filter((r) => r.vertragId === v.id).reduce((s, r) => s + rapportNetto(r, v), 0);
    const regieUeber = Math.max(0, rapSum - (Number(v.regieBudget) || 0));
    const beauftragt = netto + ntGen + (Number(v.teuerung) || 0);
    rows.push(
      <div key={v.id} className={`${card} p-4`}>
        <div className="flex items-start gap-3">
          <span className="shrink-0 inline-block bg-orange-50 text-orange-800 font-semibold tabular-nums text-sm rounded px-2 py-1 mt-0.5">{pos ? pos.bkp : "—"}</span>
          <div className="flex-1 min-w-0">
            <div className="flex items-start justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <div className="font-semibold">{v.unternehmer}{v.nr && <span className="text-stone-400 font-normal text-sm"> · {v.nr}</span>}</div>
                <div className="text-sm text-stone-500">{pos ? pos.bezeichnung : "—"} · {v.datum}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="text-[10px] text-stone-400 uppercase tracking-wide">Beauftragt netto</div>
                <div className="tabular-nums font-semibold text-base">{chf(beauftragt)}</div>
              </div>
            </div>
            <div className="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-x-4 gap-y-1 text-xs">
              <div className="flex justify-between sm:block"><span className="text-stone-400 sm:block">Brutto</span><span className="tabular-nums">{chf(v.betrag)}</span></div>
              <div className="flex justify-between sm:block"><span className="text-stone-400 sm:block">Netto</span><span className="tabular-nums">{chf(netto)}</span></div>
              <div className="flex justify-between sm:block"><span className="text-stone-400 sm:block">NT genehmigt</span><span className="tabular-nums">{ntGen ? chf(ntGen) : "–"}</span></div>
              <div className="flex justify-between sm:block"><span className="text-stone-400 sm:block">Teuerung</span><span className="tabular-nums">{Number(v.teuerung) ? chf(v.teuerung) : "–"}</span></div>
            </div>
            {(hatKonditionen(v) || ntPend > 0) && <div className="text-xs text-stone-500 mt-2">{hatKonditionen(v) ? `Konditionen: ${konditionenText(v)}` : ""}{hatKonditionen(v) && ntPend > 0 ? " · " : ""}{ntPend > 0 ? `NT pendent ${chf(ntPend)} netto` : ""}</div>}
            {Number(v.regieBudget) > 0 && <div className="text-xs mt-1"><span className="text-stone-500">Regiebudget {chf(v.regieBudget)} · verbraucht {chf(rapSum)} netto</span>{regieUeber > 0 && <span className="text-red-600 font-medium"> · Überschuss +{chf(regieUeber)} → Erwartung</span>}</div>}
            {(Number(v.rueckbehaltPct) > 0 || v.abnahme || v.buergschaft) && (() => { const gBis = garantieBis(v); const gs = garantieStatus(gBis); return (
              <div className="text-xs text-stone-500 mt-1">
                {Number(v.rueckbehaltPct) > 0 ? `Rückbehalt ${v.rueckbehaltPct}% (${chf(beauftragt * v.rueckbehaltPct / 100)})` : ""}
                {Number(v.rueckbehaltPct) > 0 && (v.abnahme || v.buergschaft) ? " · " : ""}
                {v.abnahme ? <>Garantie bis <span className="tabular-nums">{gBis}</span> {gs && <span className={`rounded px-1.5 py-0.5 ${gs.cls}`}>{gs.label}</span>}</> : ""}
                {v.buergschaft ? (v.abnahme || Number(v.rueckbehaltPct) > 0 ? " · " : "") + "Solidarbürgschaft" : ""}
              </div>
            ); })()}
          </div>
        </div>
        <div className="mt-3 border-t border-stone-100 pt-3">
          <div className="flex items-center justify-between mb-2"><span className="text-xs font-medium text-stone-500 uppercase tracking-wide">Nachträge <span className="normal-case font-normal text-stone-400">(erben %-Konditionen)</span></span>
            <div className="flex gap-3"><button className="text-stone-600 text-xs hover:underline" onClick={() => setPrintV(v)}>🖨 Werkvertrag</button><button className="text-stone-500 text-xs hover:underline" title="Die im Vertrag eingefrorenen Firmenangaben durch den heutigen Stand aus dem Adressstamm ersetzen" onClick={() => { const fa = findFirma(firmen, v.firmaId, v.unternehmer); if (!fa) { window.alert("Diese Firma steht nicht (mehr) im Adressstamm."); return; } const bet = (db.beteiligte || []).find((x) => x.projektId === projektId && x.firmaId === fa.id); if (window.confirm(`Firmenangaben im Vertrag durch den heutigen Stand von «${fa.name}» ersetzen?`)) dispatch({ type: "update", coll: "vertraege", id: v.id, patch: { firmaId: fa.id, unternehmer: fa.name, firmaSnap: firmaSnapshot(fa, bet?.hauptpersonId) } }); }}>Adresse aktualisieren</button><button className="text-orange-800 text-xs hover:underline" onClick={() => setNtFor({ vertragId: v.id, _v: v, bezeichnung: "", betrag: "", status: "pendent", datum: today() })}>+ Nachtrag</button><button className="text-orange-800 text-xs hover:underline" onClick={() => setVForm(v)}>Bearbeiten</button><button className="text-red-600 text-xs hover:underline" onClick={() => dispatch({ type: "remove", coll: "vertraege", id: v.id })}>Löschen</button></div>
          </div>
          {!nts.length ? <div className="text-xs text-stone-400">keine Nachträge</div> : (
            <table className="w-full text-sm"><tbody>{nts.map((n) => (
              <tr key={n.id} className="border-t border-stone-50">
                <td className="py-1.5">{n.bezeichnung}</td><td className="py-1.5 text-stone-500 tabular-nums">{n.datum}</td>
                <td className="py-1.5"><select className="text-xs border border-stone-200 rounded px-1.5 py-0.5" value={n.status} onChange={(e) => dispatch({ type: "update", coll: "nachtraege", id: n.id, patch: { status: e.target.value } })}><option value="pendent">pendent</option><option value="genehmigt">genehmigt</option><option value="abgelehnt">abgelehnt</option></select></td>
                <td className="py-1.5 text-right tabular-nums text-stone-500">{chf(n.betrag)} brutto</td>
                <td className="py-1.5 text-right tabular-nums font-medium">{chf(konditionenNetto(n.betrag, v, false))} netto</td>
                <td className="py-1.5 text-right w-8"><button className="text-red-600 text-xs" onClick={() => dispatch({ type: "remove", coll: "nachtraege", id: n.id })}>×</button></td>
              </tr>))}</tbody></table>
          )}
        </div>
      </div>
    );
  });

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <button className={btnPrimary} onClick={() => setVForm({ positionId: "", unternehmer: "", nr: "", betrag: "", rabattPct: "", pauschalabzug: "", skontoPct: "", bauabzuegePct: "", rundung: "", regieBudget: "", teuerung: "", datum: today() })}>+ Vertrag</button>
        {d.vertraege.length > 0 && <div className="text-sm text-stone-500">{d.vertraege.length} Verträge · Total beauftragt <span className="font-semibold tabular-nums text-stone-700">{chf(totalBeauftragt)}</span></div>}
      </div>
      {garantieRows.length > 0 && (
        <div className={`${card} overflow-x-auto`}>
          <div className="px-3 py-2 bg-stone-50 text-sm font-medium border-b border-stone-200">Rückbehalt & Garantien</div>
          <table className="w-full text-sm"><thead className="text-stone-500 text-xs"><tr><th className="text-left font-medium px-3 py-1.5">Unternehmer</th><th className="text-right font-medium px-3 py-1.5">Rückbehalt</th><th className="text-left font-medium px-3 py-1.5">Abnahme</th><th className="text-left font-medium px-3 py-1.5">Garantie bis</th><th className="text-left font-medium px-3 py-1.5">Status</th><th className="text-left font-medium px-3 py-1.5">Bürgschaft</th></tr></thead>
          <tbody>{garantieRows.map((v) => {
            const gBis = garantieBis(v); const gs = garantieStatus(gBis);
            const ntG = d.nachtraege.filter((n) => n.vertragId === v.id && n.status === "genehmigt").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
            const basis = konditionenNetto(v.betrag, v, true) + ntG + (Number(v.teuerung) || 0);
            return (
              <tr key={v.id} className="border-t border-stone-100">
                <td className="px-3 py-1.5">{v.unternehmer}{v.nr ? <span className="text-stone-400 text-xs"> · {v.nr}</span> : ""}</td>
                <td className="px-3 py-1.5 text-right tabular-nums">{Number(v.rueckbehaltPct) > 0 ? `${v.rueckbehaltPct}% = ${chf(basis * v.rueckbehaltPct / 100)}` : "–"}</td>
                <td className="px-3 py-1.5 tabular-nums">{v.abnahme || "offen"}</td>
                <td className="px-3 py-1.5 tabular-nums">{gBis || "–"}</td>
                <td className="px-3 py-1.5">{gs ? <span className={`text-xs rounded px-1.5 py-0.5 ${gs.cls}`}>{gs.label}</span> : "–"}</td>
                <td className="px-3 py-1.5">{v.buergschaft ? "ja" : "–"}</td>
              </tr>
            );
          })}</tbody></table>
        </div>
      )}
      {!d.vertraege.length ? <Empty text="Keine Verträge erfasst." /> : rows}

      {vForm && <VertragEditor v={vForm} positionen={d.positionen} firmen={firmen} onClose={() => setVForm(null)} onSave={(v) => {
        let fa = findFirma(firmen, v.firmaId, v.unternehmer);
        if (!fa && v.unternehmer) { fa = { id: uid(), name: v.unternehmer, strasse: "", plz: "", ort: "", land: "Schweiz", email: "", website: "", mwstNr: "", bkp: "", ampel: "", personen: [] }; dispatch({ type: "add", coll: "firmen", item: fa }); }
        // Firmendaten und Bauherrschaft beim Abschluss einfrieren
        let bet = fa ? (db.beteiligte || []).find((x) => x.projektId === projektId && x.firmaId === fa.id) : null;
        if (fa && !bet) { bet = { id: uid(), projektId, firmaId: fa.id, rolle: "Unternehmer", hauptpersonId: (fa.personen || [])[0]?.id || "" }; dispatch({ type: "add", coll: "beteiligte", item: bet }); }
        const vv = { ...v, firmaId: fa ? fa.id : "", firmaSnap: v.firmaSnap && v.id ? v.firmaSnap : firmaSnapshot(fa, bet?.hauptpersonId), bauherrSnap: v.bauherrSnap && v.id ? v.bauherrSnap : { bauherr: rollen.bauherr, bauherrAdresse: rollen.bauherrAdresse, bauherrPerson: rollen.bauherrPerson } };
        if (v.id) dispatch({ type: "update", coll: "vertraege", id: v.id, patch: vv }); else dispatch({ type: "add", coll: "vertraege", item: { id: uid(), projektId, ...vv } });
        setVForm(null);
      }} />}
      {printV && (
        <PrintModal onClose={() => setPrintV(null)}>
          <WerkvertragDoc v={printV} pos={d.positionen.find((p) => p.id === printV.positionId)} projekt={projekt} firma={findFirma(firmen, printV.firmaId, printV.unternehmer)} rollen={rollen} />
        </PrintModal>
      )}
      {ntFor && (
        <Modal title="Nachtrag erfassen" onClose={() => setNtFor(null)}>
          <div className="space-y-3">
            <Field label="Bezeichnung"><input className={inputCls} value={ntFor.bezeichnung} onChange={(e) => setNtFor({ ...ntFor, bezeichnung: e.target.value })} placeholder="NT1 Zusatzleistung" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Betrag brutto (CHF)"><input className={inputCls} value={ntFor.betrag} onChange={(e) => setNtFor({ ...ntFor, betrag: e.target.value })} /></Field>
              <Field label="Status"><select className={inputCls} value={ntFor.status} onChange={(e) => setNtFor({ ...ntFor, status: e.target.value })}><option value="pendent">pendent</option><option value="genehmigt">genehmigt</option><option value="abgelehnt">abgelehnt</option></select></Field>
            </div>
            {ntFor._v && hatKonditionen(ntFor._v) && <p className="text-xs text-stone-500">Netto nach Vertragskonditionen: <span className="font-medium tabular-nums">{chf(konditionenNetto(parseBetrag(ntFor.betrag), ntFor._v, false))}</span></p>}
            <div className="flex justify-end gap-2 pt-1"><button className={btnGhost} onClick={() => setNtFor(null)}>Abbrechen</button><button className={btnPrimary} disabled={!ntFor.bezeichnung} onClick={() => { const { _v, ...rest } = ntFor; dispatch({ type: "add", coll: "nachtraege", item: { id: uid(), projektId, ...rest, betrag: parseBetrag(ntFor.betrag) } }); setNtFor(null); }}>Speichern</button></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function bieterBrutto(b, a) {
  if (a && a.modus === "lv") return (a.positionen || []).reduce((s, p) => s + (Number(p.menge) || 0) * (parseBetrag((b.preise || {})[p.code]) || 0), 0);
  return Number(b.brutto) || 0;
}
function bieterNetto(b, a) { return konditionenNetto(bieterBrutto(b, a), b, true); }
function nutzwerte(a, projekt) {
  const w = a.gewichte || { preis: Number(projekt?.gewichtPreis) || 70, referenzen: Number(projekt?.gewichtReferenzen) || 20, lehrlinge: Number(projekt?.gewichtLehrlinge) || 10 };
  const rows = (a.bieter || []).map((b) => ({ b, brutto: bieterBrutto(b, a), netto: bieterNetto(b, a) }));
  const valid = rows.filter((r) => r.netto > 0);
  const min = valid.length ? Math.min(...valid.map((r) => r.netto)) : 0;
  return { w, rows: rows.map((r) => {
    const pP = r.netto > 0 && min > 0 ? 100 * min / r.netto : 0;
    const nutz = (pP * (Number(w.preis) || 0) + (Number(r.b.referenzPunkte) || 0) * (Number(w.referenzen) || 0) + (Number(r.b.lehrlingPunkte) || 0) * (Number(w.lehrlinge) || 0)) / 100;
    return { b: r.b, brutto: r.brutto, netto: r.netto, pP, nutz };
  }).sort((x, y) => y.nutz - x.nutz), min };
}

          <button className="text-orange-800 text-xs hover:underline print:hidden" onClick={() => setShowPos(!showPos)}>{showPos ? "Positionsvergleich ausblenden" : "Positionsvergleich einblenden"}</button>

            <div className="mt-2 overflow-x-auto border border-stone-200 rounded-md"><table className="w-full text-xs">
              <thead className="bg-stone-50 text-stone-500"><tr><th className="px-2 py-1 text-left">NPK</th><th className="px-2 py-1 text-left">Bezeichnung</th><th className="px-2 py-1 text-right">Menge</th><th className="px-2 py-1">Einh.</th>{named.map((t, i) => <th key={i} className="px-2 py-1 text-right min-w-[80px]">{t.b.name}</th>)}</tr></thead>
              <tbody>{(a.positionen || []).map((p) => {

                return (<tr key={p.code} className="border-t border-stone-100"><td className="px-2 py-1 tabular-nums">{p.npk}</td><td className="px-2 py-1">{p.bezeichnung}</td><td className="px-2 py-1 text-right tabular-nums">{p.menge}</td><td className="px-2 py-1">{p.einheit}</td>{named.map((t, i) => { const ep = parseBetrag((t.b.preise || {})[p.code]) || 0; return <td key={i} className={`px-2 py-1 text-right tabular-nums ${ep === minEp && ep > 0 ? "text-emerald-600 font-medium" : ""}`}>{ep ? chf(ep) : "–"}</td>; })}</tr>);
              })}</tbody>
              <tfoot><tr className="border-t-2 border-stone-300 font-semibold bg-stone-50"><td className="px-2 py-1" colSpan={4}>Total Brutto</td>{named.map((t, i) => <td key={i} className="px-2 py-1 text-right tabular-nums">{chf(t.brutto)}</td>)}</tr></tfoot>
            </table></div>
          )}
        </div>
      )}
      <p className="text-xs text-stone-400 mt-2">{isLv ? "Brutto = Σ (Menge × Einheitspreis) je Bieter. " : ""}Punkte 1–100. Preispunkte = 100 × günstigstes Netto ÷ Netto. Nutzwert = gewichtete Summe (max. 100).</p>
    </div>
  );
}

function LeistungsverzeichnisView({ d, dispatch, projektId, projekt, firmen, db }) {
  const rollen = projektRollen(db, projekt);
  const [selId, setSelId] = useState(d.angebote.find((x) => x.modus === "lv")?.id || d.angebote[0]?.id || "");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [offerFor, setOfferFor] = useState(null);
  const [vergabeFor, setVergabeFor] = useState(null);
  const [printAntrag, setPrintAntrag] = useState(false);
  const [posForm, setPosForm] = useState({ code: "", bezeichnung: "", einheit: "", menge: "" });
  const [showKond, setShowKond] = useState(false);
  const [showAddPos, setShowAddPos] = useState(false);
  const [detail, setDetail] = useState(null);
  const fileRef = useRef(null);
  const a = d.angebote.find((x) => x.id === selId);
  const opts = posSelectOptions(d.positionen);

  function neueAusschreibung() {
    const id = uid();
    dispatch({ type: "add", coll: "angebote", item: { id, projektId, titel: "Neue Ausschreibung", positionId: "", modus: "lv", positionen: [], bedingungen: "", gewichte: { preis: Number(projekt?.gewichtPreis) || 70, referenzen: Number(projekt?.gewichtReferenzen) || 20, lehrlinge: Number(projekt?.gewichtLehrlinge) || 10 }, bieter: [] } });
    setSelId(id); setMsg("");
  }
  function kopieren() {
    if (!a) return;
    const id = uid();
    const copy = JSON.parse(JSON.stringify(a));
    copy.id = id; copy.projektId = projektId; copy.titel = (a.titel || "Ausschreibung") + " (Kopie)";
    copy.positionen = (copy.positionen || []).map((p) => ({ ...p, id: uid() }));
    dispatch({ type: "add", coll: "angebote", item: copy });
    setSelId(id); setMsg("Ausschreibung kopiert (inkl. Positionen und Offerten).");
  }
  function loeschen() {
    if (!a || !window.confirm("Ausschreibung «" + a.titel + "» löschen?")) return;
    const rest = d.angebote.filter((x) => x.id !== a.id);
    dispatch({ type: "remove", coll: "angebote", id: a.id });
    setSelId(rest[0]?.id || ""); setMsg("");
  }
  async function onFileLV(e) {
    const file = e.target.files?.[0]; if (!file || !a) return;
    setBusy(true); setMsg("");
    try {
      const parsed = parseSia451(await unzipCrbx(await file.arrayBuffer()));
      if (!parsed.positionen.length) { setMsg("Keine Positionen gefunden. Ist es eine SIA-451/CRBX-Datei?"); setBusy(false); return; }
      const have = new Set((a.positionen || []).map((p) => p.code));
      const neu = parsed.positionen.filter((p) => !have.has(p.code)).map((p) => ({ ...p, preis: 0 }));
      const patch = { modus: "lv", positionen: [...(a.positionen || []), ...neu], bedingungen: [a.bedingungen, parsed.bedingungen.join("\n")].filter(Boolean).join("\n") };
      if (!a.titel || a.titel === "Neue Ausschreibung") patch.titel = parsed.header.titel || parsed.header.projekt || a.titel;
      dispatch({ type: "update", coll: "angebote", id: a.id, patch });
      const kats = [...new Set(parsed.positionen.map((p) => "NPK " + p.catalog))].join(", ");
      setMsg("✓ " + neu.length + " Positionen importiert (" + kats + "). Jetzt Unternehmer-Offerten einlesen oder Preise direkt in der Matrix eintragen.");
    } catch (err) { setMsg("Fehler beim Lesen: " + (err?.message || err)); }
    setBusy(false); if (fileRef.current) fileRef.current.value = "";
  }
  function addPosition() {
    if (!a || !posForm.code) return;
    const code = posForm.code.replace(/[^0-9]/g, "");
    if (!code) { setMsg("Bitte eine numerische NPK-Nummer eingeben."); return; }
    if ((a.positionen || []).some((p) => p.code === code)) { setMsg("Position existiert bereits."); return; }
    const pos = { id: uid(), catalog: code.slice(0, 3) || "000", code, npk: code.slice(0, 3) + "." + code.slice(3), bezeichnung: posForm.bezeichnung, langtext: [], einheit: posForm.einheit, menge: parseBetrag(posForm.menge), preis: 0 };
    dispatch({ type: "update", coll: "angebote", id: a.id, patch: { modus: "lv", positionen: [...(a.positionen || []), pos] } });
    setPosForm({ code: "", bezeichnung: "", einheit: "", menge: "" }); setMsg("");
  }
  const setBieter = (arr) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { bieter: arr } });
  const addBieter = () => setBieter([...(a.bieter || []), { name: "", preise: {}, bemerkung: "", rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, referenzPunkte: 0, lehrlingPunkte: 0 }]);
  const patchBieter = (bi, patch) => setBieter(a.bieter.map((b, i) => i === bi ? { ...b, ...patch } : b));
  const setEp = (bi, code, val) => setBieter(a.bieter.map((b, i) => i === bi ? { ...b, preise: { ...(b.preise || {}), [code]: val } } : b));
  function exportLeer(fmt) {
    if (!a) return;
    const base = (a.titel || "Ausschreibung").replace(/\s+/g, "_");
    if (fmt === "csv") download(new Blob([buildOfferteCsv(a.titel, a.positionen || [], null)], { type: "text/csv;charset=utf-8" }), base + "_Offerte.csv");
    else download(makeCrbxBlob(buildSia451(a.titel || "LV", a.positionen || [], null)), base + ".crbx");
  }
  function exportBieter(b, fmt) {
    if (!a || !b) return;
    const base = (a.titel || "LV").replace(/\s+/g, "_") + "_" + (b.name || "Firma").replace(/\s+/g, "");
    if (fmt === "csv") download(new Blob([buildOfferteCsv(a.titel, a.positionen || [], b.preise || {})], { type: "text/csv;charset=utf-8" }), base + ".csv");
    else download(makeCrbxBlob(buildSia451(a.titel || "LV", a.positionen || [], b.preise || {})), base + ".crbx");
  }
  function exportVergleich() {
    if (!a) return;
    const esc = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
    const bs = a.bieter || [];
    const lines = [["NPK", "Bezeichnung", "Einheit", "Menge"].map(esc).concat(bs.map((b) => esc(b.name || "Firma"))).join(";")];
    (a.positionen || []).forEach((p) => lines.push([esc(p.npk), esc(p.bezeichnung), esc(p.einheit), p.menge].concat(bs.map((b) => parseBetrag((b.preise || {})[p.code]) || "")).join(";")));
    lines.push(["", esc("Total Brutto"), "", ""].concat(bs.map((b) => Math.round(bieterBrutto(b, a)))).join(";"));
    lines.push(["", esc("Total Netto"), "", ""].concat(bs.map((b) => Math.round(bieterNetto(b, a)))).join(";"));
    download(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), (a.titel || "Vergleich").replace(/\s+/g, "_") + "_Vergleich.csv");
  }

  const positionen = a ? a.positionen || [] : [];
  const bieter = a ? a.bieter || [] : [];
  const nw = a ? nutzwerte(a, projekt) : { rows: [], min: 0, w: {} };
  const nwByB = new Map(nw.rows.map((r) => [r.b, r]));
  const rangByB = new Map(nw.rows.map((r, i) => [r.b, i + 1]));
  const cell = "w-20 text-xs px-1 py-1 border border-stone-200 rounded text-right tabular-nums focus:border-orange-600 focus:outline-none";

  return (
    <div className="space-y-4">
      <div className={`${card} p-4`}>
        <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto] gap-3 items-end">
          <Field label="Ausschreibung">
            <select className={inputCls} value={selId} onChange={(e) => { setSelId(e.target.value); setMsg(""); }}>
              <option value="">— wählen —</option>
              {d.angebote.map((x) => <option key={x.id} value={x.id}>{x.titel || "Ohne Titel"} ({(x.positionen || []).length} Pos. · {(x.bieter || []).filter((b) => b.name).length} Bieter)</option>)}
            </select>
          </Field>
          <button className={btnGhost} onClick={neueAusschreibung}>+ Neu</button>
          <button className={btnGhost} disabled={!a} onClick={kopieren}>Kopieren</button>
          <button className={btnGhost} disabled={!a} onClick={loeschen}>Löschen</button>
        </div>
        {msg && <div className="mt-3 text-sm bg-orange-50 text-orange-900 rounded-md px-3 py-2">{msg}</div>}
      </div>

      {!a ? <Empty text="Wähle eine Ausschreibung oder erstelle eine neue." /> : (
        <>
          <div className={`${card} p-4 space-y-3`}>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <Field label="Titel / Arbeitsgattung"><input className={inputCls} value={a.titel || ""} onChange={(e) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { titel: e.target.value } })} /></Field>
              <Field label="BKP-Position (für Vergabe)"><select className={inputCls} value={a.positionId || ""} onChange={(e) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionId: e.target.value } })}><option value="">— zuordnen —</option>{opts.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button className={btnPrimary} disabled={busy} onClick={() => fileRef.current?.click()}>{busy ? "Lese…" : "① LV importieren (.crbx)"}</button>
              <input ref={fileRef} type="file" accept=".crbx,.e1s,.sia,application/zip" className="hidden" onChange={onFileLV} />
              <button className={btnGhost} onClick={() => setShowAddPos(!showAddPos)}>Position manuell +</button>
              <span className="text-stone-300">|</span>
              <span className="text-xs text-stone-500">② An Unternehmer senden:</span>
              <button className={btnGhost} disabled={!positionen.length} onClick={() => exportLeer("csv")}>CSV</button>
              <button className={btnGhost} disabled={!positionen.length} onClick={() => exportLeer("crbx")}>.crbx</button>
              <span className="ml-auto text-xs text-stone-500">{positionen.length} Positionen · {[...new Set(positionen.map((p) => "NPK " + p.catalog))].join(", ") || "—"}</span>
            </div>
