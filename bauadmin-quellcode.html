                  <td className="px-2 py-1"><input className={cell} value={b.skontoPct} onChange={(e) => setB(bi, "skontoPct", e.target.value)} /></td>
                  <td className="px-2 py-1"><input className={cell} value={b.bauabzuegePct} onChange={(e) => setB(bi, "bauabzuegePct", e.target.value)} /></td>
                  <td className="px-2 py-1"><input className={cell} value={b.rundung} onChange={(e) => setB(bi, "rundung", e.target.value)} /></td>
                  <td className="px-2 py-1 text-right tabular-nums text-xs font-medium">{chf(konditionenNetto(bruttoOf(b), { rabattPct: parseBetrag(b.rabattPct), pauschalabzug: parseBetrag(b.pauschalabzug), skontoPct: parseBetrag(b.skontoPct), bauabzuegePct: parseBetrag(b.bauabzuegePct), rundung: parseBetrag(b.rundung) }, true))}</td>
                  <td className="px-2 py-1"><input className={cell} placeholder="0–100" value={b.referenzPunkte} onChange={(e) => setB(bi, "referenzPunkte", e.target.value)} /></td>
                  <td className="px-2 py-1"><input className={cell} placeholder="0–100" value={b.lehrlingPunkte} onChange={(e) => setB(bi, "lehrlingPunkte", e.target.value)} /></td>
                  <td className="px-2 py-1"><input className="w-full text-xs px-1 py-0.5 border border-stone-200 rounded" value={b.bemerkung} onChange={(e) => setB(bi, "bemerkung", e.target.value)} placeholder="optional" /></td>
                  <td className="px-1 text-center"><button className="text-red-500 text-sm" title="Firma entfernen" onClick={() => delB(bi)}>×</button></td>
                </tr>
              ))}
            </tbody>
          </table></div>
        </div>
        {isLv && (a.positionen || []).length > 0 && (
          <div>
            <div className="text-xs font-medium text-stone-500 uppercase tracking-wide mb-2">Einheitspreise je Position (CHF/Einheit) — pro Bieter ausfüllen</div>
            <div className="overflow-auto border border-stone-200 rounded-md max-h-[420px]"><table className="w-full text-xs">
              <thead className="bg-stone-50 text-stone-500 sticky top-0"><tr><th className="px-2 py-1.5 text-left sticky left-0 bg-stone-50 min-w-[160px]">NPK · Bezeichnung</th><th className="px-2 py-1.5 text-right">Menge</th><th className="px-2 py-1.5">Einh.</th>{a.bieter.map((b, bi) => <th key={bi} className="px-2 py-1.5 text-right min-w-[90px]">{b.name || `Firma ${bi + 1}`}</th>)}</tr></thead>
              <tbody>{a.positionen.map((p) => (
                <tr key={p.code} className="border-t border-stone-100">
                  <td className="px-2 py-1 sticky left-0 bg-white"><span className="tabular-nums text-stone-500">{p.npk}</span> {p.bezeichnung}</td>
                  <td className="px-2 py-1 text-right tabular-nums">{p.menge}</td>
                  <td className="px-2 py-1">{p.einheit}</td>
                  {a.bieter.map((b, bi) => (<td key={bi} className="px-2 py-1"><input className={cell} value={(b.preise || {})[p.code] || ""} onChange={(e) => setEp(bi, p.code, e.target.value)} placeholder="0.00" /></td>))}
                </tr>
              ))}</tbody>
              <tfoot className="bg-stone-50 font-medium"><tr><td className="px-2 py-1.5 sticky left-0 bg-stone-50" colSpan={3}>Total Brutto</td>{a.bieter.map((b, bi) => <td key={bi} className="px-2 py-1.5 text-right tabular-nums">{chf(bruttoOf(b))}</td>)}</tr></tfoot>
            </table></div>
          </div>
        )}
        {a.bedingungen && (
          <details className="text-xs"><summary className="cursor-pointer text-stone-500">Importierte Bedingungen / Besondere Bestimmungen anzeigen</summary><div className="mt-2 max-h-48 overflow-y-auto whitespace-pre-wrap text-stone-600 border border-stone-200 rounded p-2">{a.bedingungen}</div></details>
        )}
        <div className="flex justify-end gap-2"><button className={btnGhost} onClick={onClose}>Abbrechen</button><button className={btnPrimary} disabled={!a.titel} onClick={() => onSave({ ...a, bieter: a.bieter.map((b) => ({ ...b, brutto: parseBetrag(b.brutto), rabattPct: parseBetrag(b.rabattPct), pauschalabzug: parseBetrag(b.pauschalabzug), skontoPct: parseBetrag(b.skontoPct), bauabzuegePct: parseBetrag(b.bauabzuegePct), rundung: parseBetrag(b.rundung), referenzPunkte: parseBetrag(b.referenzPunkte), lehrlingPunkte: parseBetrag(b.lehrlingPunkte) })) })}>Speichern</button></div>
      </div>
    </Modal>
    </>
  );
}

function LeistungsverzeichnisView({ d, dispatch, projektId, projekt, firmen, db, ks }) {
  const rollen = projektRollen(db, projekt);
  const [selId, setSelId] = useState(d.angebote.find((x) => x.modus === "lv")?.id || d.angebote[0]?.id || "");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [offerFor, setOfferFor] = useState(null);
  const [vergabeFor, setVergabeFor] = useState(null);
  const [posForm, setPosForm] = useState({ code: "", bezeichnung: "", einheit: "", menge: "" });
  const [waehlerOffen, setWaehlerOffen] = useState(false);
  // Gewählte Katalogpositionen ans Ende der Ausschreibung hängen (Dubletten überspringen)
  const positionenAufnehmen = (neue) => {
    if (!a) return;
    const da = new Set((a.positionen || []).map((x) => x.code));
    const frisch = neue.filter((x) => !da.has(x.code));
    if (!frisch.length) { window.alert("Alle gewählten Positionen sind bereits enthalten."); return; }
    dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionen: [...(a.positionen || []), ...frisch] } });
  };
  const [showKond, setShowKond] = useState(false);
  const [showAddPos, setShowAddPos] = useState(false);
  const [detail, setDetail] = useState(null);
  const fileRef = useRef(null);
  const a = d.angebote.find((x) => x.id === selId);
  const opts = posSelectOptions(d.positionen);

  function neueAusschreibung() {
    const id = uid();
    dispatch({ type: "add", coll: "angebote", item: { id, projektId, titel: "Neue Ausschreibung", positionId: "", modus: "lv", positionen: [], bedingungen: "", gewichte: { preis: Number(projekt?.gewichtPreis) || 70, referenzen: Number(projekt?.gewichtReferenzen) || 20, lehrlinge: Number(projekt?.gewichtLehrlinge) || 10 }, bieter: [] } });
    setSelId(id); setMsg("");
  }
  function kopieren() {
    if (!a) return;
    const id = uid();
    const copy = JSON.parse(JSON.stringify(a));
    copy.id = id; copy.projektId = projektId; copy.titel = (a.titel || "Ausschreibung") + " (Kopie)";
    copy.positionen = (copy.positionen || []).map((p) => ({ ...p, id: uid() }));
    dispatch({ type: "add", coll: "angebote", item: copy });
    setSelId(id); setMsg("Ausschreibung kopiert (inkl. Positionen und Offerten).");
  }
  function loeschen() {
    if (!a || !window.confirm("Ausschreibung «" + a.titel + "» löschen?")) return;
    const rest = d.angebote.filter((x) => x.id !== a.id);
    dispatch({ type: "remove", coll: "angebote", id: a.id });
    setSelId(rest[0]?.id || ""); setMsg("");
  }
  async function onFileLV(e) {
    const file = e.target.files?.[0]; if (!file || !a) return;
    setBusy(true); setMsg("");
    try {
      const parsed = parseSia451(await unzipCrbx(await file.arrayBuffer()));
      if (!parsed.positionen.length) { setMsg("Keine Positionen gefunden. Ist es eine SIA-451/CRBX-Datei?"); setBusy(false); return; }
      const have = new Set((a.positionen || []).map((p) => p.code));
      const neu = parsed.positionen.filter((p) => !have.has(p.code)).map((p) => ({ ...p, preis: 0 }));
      const patch = { modus: "lv", positionen: [...(a.positionen || []), ...neu], bedingungen: [a.bedingungen, parsed.bedingungen.join("\n")].filter(Boolean).join("\n") };
      if (!a.titel || a.titel === "Neue Ausschreibung") patch.titel = parsed.header.titel || parsed.header.projekt || a.titel;
      dispatch({ type: "update", coll: "angebote", id: a.id, patch });
      const kats = [...new Set(parsed.positionen.map((p) => "NPK " + p.catalog))].join(", ");
      setMsg("✓ " + neu.length + " Positionen importiert (" + kats + "). Jetzt Unternehmer-Offerten einlesen oder Preise direkt in der Matrix eintragen.");
    } catch (err) { setMsg("Fehler beim Lesen: " + (err?.message || err)); }
    setBusy(false); if (fileRef.current) fileRef.current.value = "";
  }
  function addPosition() {
    if (!a || !posForm.code) return;
    const code = posForm.code.replace(/[^0-9]/g, "");
    if (!code) { setMsg("Bitte eine numerische NPK-Nummer eingeben."); return; }
    if ((a.positionen || []).some((p) => p.code === code)) { setMsg("Position existiert bereits."); return; }
    const pos = { id: uid(), catalog: code.slice(0, 3) || "000", code, npk: code.slice(0, 3) + "." + code.slice(3), bezeichnung: posForm.bezeichnung, langtext: [], einheit: posForm.einheit, menge: parseBetrag(posForm.menge), preis: 0 };
    dispatch({ type: "update", coll: "angebote", id: a.id, patch: { modus: "lv", positionen: [...(a.positionen || []), pos] } });
    setPosForm({ code: "", bezeichnung: "", einheit: "", menge: "" }); setMsg("");
  }
  const setBieter = (arr) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { bieter: arr } });
  const addBieter = () => setBieter([...(a.bieter || []), { name: "", preise: {}, bemerkung: "", rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, referenzPunkte: 0, lehrlingPunkte: 0 }]);
  const patchBieter = (bi, patch) => setBieter(a.bieter.map((b, i) => i === bi ? { ...b, ...patch } : b));
  const setEp = (bi, code, val) => setBieter(a.bieter.map((b, i) => i === bi ? { ...b, preise: { ...(b.preise || {}), [code]: val } } : b));
  function exportLeer(fmt) {
    if (!a) return;
    const base = (a.titel || "Ausschreibung").replace(/\s+/g, "_");
    if (fmt === "csv") download(new Blob([buildOfferteCsv(a.titel, a.positionen || [], null)], { type: "text/csv;charset=utf-8" }), base + "_Offerte.csv");
    else download(makeCrbxBlob(buildSia451(a.titel || "LV", a.positionen || [], null)), base + ".crbx");
  }
  function exportBieter(b, fmt) {
    if (!a || !b) return;
    const base = (a.titel || "LV").replace(/\s+/g, "_") + "_" + (b.name || "Firma").replace(/\s+/g, "");
    if (fmt === "csv") download(new Blob([buildOfferteCsv(a.titel, a.positionen || [], b.preise || {})], { type: "text/csv;charset=utf-8" }), base + ".csv");
    else download(makeCrbxBlob(buildSia451(a.titel || "LV", a.positionen || [], b.preise || {})), base + ".crbx");
  }
  function exportVergleich() {
    if (!a) return;
    const esc = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
    const bs = a.bieter || [];
    const lines = [["NPK", "Bezeichnung", "Einheit", "Menge"].map(esc).concat(bs.map((b) => esc(b.name || "Firma"))).join(";")];
    (a.positionen || []).forEach((p) => lines.push([esc(p.npk), esc(p.bezeichnung), esc(p.einheit), p.menge].concat(bs.map((b) => parseBetrag((b.preise || {})[p.code]) || "")).join(";")));
    lines.push(["", esc("Total Brutto"), "", ""].concat(bs.map((b) => Math.round(bieterBrutto(b, a)))).join(";"));
    lines.push(["", esc("Total Netto"), "", ""].concat(bs.map((b) => Math.round(bieterNetto(b, a)))).join(";"));
    download(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), (a.titel || "Vergleich").replace(/\s+/g, "_") + "_Vergleich.csv");
  }

  const positionen = a ? a.positionen || [] : [];
  const bieter = a ? a.bieter || [] : [];
  const nw = a ? nutzwerte(a, projekt) : { rows: [], min: 0, w: {} };
  const nwByB = new Map(nw.rows.map((r) => [r.b, r]));
  const rangByB = new Map(nw.rows.map((r, i) => [r.b, i + 1]));
  const cell = "w-20 text-xs px-1 py-1 border border-stone-200 rounded text-right tabular-nums focus:border-orange-600 focus:outline-none";

  return (
    <div className="space-y-4">
      <div className={`${card} p-4`}>
        <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto] gap-3 items-end">
          <Field label="Ausschreibung">
            <select className={inputCls} value={selId} onChange={(e) => { setSelId(e.target.value); setMsg(""); }}>
              <option value="">— wählen —</option>
              {d.angebote.map((x) => <option key={x.id} value={x.id}>{x.titel || "Ohne Titel"} ({(x.positionen || []).length} Pos. · {(x.bieter || []).filter((b) => b.name).length} Bieter)</option>)}
            </select>
          </Field>
          <button className={btnGhost} onClick={neueAusschreibung}>+ Neu</button>
          <button className={btnGhost} disabled={!a} onClick={kopieren}>Kopieren</button>
          <button className={btnGhost} disabled={!a} onClick={loeschen}>Löschen</button>
        </div>
        {msg && <div className="mt-3 text-sm bg-orange-50 text-orange-900 rounded-md px-3 py-2">{msg}</div>}
      </div>

      {!a ? <Empty text="Wähle eine Ausschreibung oder erstelle eine neue." /> : (
        <>
          <div className={`${card} p-4 space-y-3`}>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <Field label="Titel / Arbeitsgattung"><input className={inputCls} value={a.titel || ""} onChange={(e) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { titel: e.target.value } })} /></Field>
              <Field label="BKP-Position (für Vergabe)"><select className={inputCls} value={a.positionId || ""} onChange={(e) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionId: e.target.value } })}><option value="">— zuordnen —</option>{opts.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button className={btnPrimary} disabled={busy} onClick={() => fileRef.current?.click()}>{busy ? "Lese…" : "① LV importieren (.crbx)"}</button>
              <input ref={fileRef} type="file" accept=".crbx,.e1s,.sia,application/zip" className="hidden" onChange={onFileLV} />
              <button className={btnGhost} onClick={() => setShowAddPos(!showAddPos)}>Position manuell +</button>
              <span className="text-stone-300">|</span>
              <span className="text-xs text-stone-500">② An Unternehmer senden:</span>
              <button className={btnGhost} disabled={!positionen.length} onClick={() => exportLeer("csv")}>CSV</button>
              <button className={btnGhost} disabled={!positionen.length} onClick={() => exportLeer("crbx")}>.crbx</button>
              <button className={btnPrimary} onClick={() => setWaehlerOffen(true)}>+ Positionen aus Katalog</button>
              <span className="ml-auto text-xs text-stone-500">{positionen.length} Positionen · {[...new Set(positionen.map((p) => "NPK " + p.catalog))].join(", ") || "—"}</span>
            </div>
            {showAddPos && (
              <div className="grid grid-cols-1 md:grid-cols-[120px_1fr_90px_90px_auto] gap-2 items-end border-t border-stone-100 pt-3">
                <Field label="NPK/Code"><input className={inputCls} value={posForm.code} onChange={(e) => setPosForm({ ...posForm, code: e.target.value })} placeholder="661.211" /></Field>
                <Field label="Bezeichnung"><input className={inputCls} value={posForm.bezeichnung} onChange={(e) => setPosForm({ ...posForm, bezeichnung: e.target.value })} /></Field>
                <Field label="Einheit"><input className={inputCls} value={posForm.einheit} onChange={(e) => setPosForm({ ...posForm, einheit: e.target.value })} placeholder="m2" /></Field>
                <Field label="Menge"><input className={inputCls} value={posForm.menge} onChange={(e) => setPosForm({ ...posForm, menge: e.target.value })} /></Field>
                <button className={btnPrimary} disabled={!posForm.code} onClick={addPosition}>+ Position</button>
              </div>
            )}
          </div>

          {positionen.length === 0 ? <Empty text="Noch keine Positionen. Importiere ein LV (.crbx) oder füge Positionen manuell hinzu." /> : (
            <>
              <div className={`${card} overflow-auto`} style={{ maxHeight: "70vh" }}>
                <table className="text-xs border-collapse">
                  <thead className="sticky top-0 z-20">
                    <tr className="bg-stone-100">
                      <th className="sticky left-0 z-30 bg-stone-100 text-left px-2 py-2 border-b border-stone-200 min-w-[70px]">NPK</th>
                      <th className="text-left px-2 py-2 border-b border-stone-200 min-w-[150px]">Bezeichnung</th>
                      <th className="text-left px-2 py-2 border-b border-stone-200">Art</th>
                      <th className="text-left px-2 py-2 border-b border-stone-200">Einh.</th>
                      <th className="text-right px-2 py-2 border-b border-stone-200">Menge</th>
                      {bieter.map((b, bi) => (
                        <th key={bi} className="px-2 py-1.5 border-b border-l border-stone-200 align-top min-w-[118px]">
                          <input className="w-full text-xs px-1 py-0.5 border border-stone-200 rounded font-medium" list="firmenliste-lv" placeholder={"Firma " + (bi + 1)} value={b.name} onChange={(e) => patchBieter(bi, { name: e.target.value })} />
                          <div className="flex items-center justify-between mt-1">
                            <span className="text-[11px] text-stone-500 tabular-nums">{chf(bieterBrutto(b, a))}</span>
                            <span className="flex gap-1.5 text-sm">
                              <button className="text-orange-800" title="Offerte importieren" onClick={() => setOfferFor({ aId: a.id, bieterIndex: bi })}>⬇</button>
                              <button className="text-stone-500" title="Export" onClick={() => exportBieter(b, "csv")}>⬆</button>
                              <button className="text-red-500" title="Entfernen" onClick={() => setBieter(a.bieter.filter((_, x) => x !== bi))}>✕</button>
                            </span>
                          </div>
                        </th>
                      ))}
                      <th className="px-2 border-b border-l border-stone-200 align-top whitespace-nowrap">
                        <button className="text-orange-800 text-xs hover:underline" onClick={addBieter}>+ Firma</button>
                        <div className="mt-1"><button className="text-orange-800 text-[11px] hover:underline" onClick={() => setOfferFor({ aId: a.id, bieterIndex: null })}>+ Offerte</button></div>
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    {positionen.map((p) => {
                      const eps = bieter.map((b) => parseBetrag((b.preise || {})[p.code]) || 0);
                      const valid = eps.filter((x) => x > 0); const minEp = valid.length ? Math.min(...valid) : 0;
                      return (
                        <tr key={p.code} className={`border-b border-stone-100 hover:bg-stone-50/60 ${istGewertet(p) ? "" : "bg-amber-50/40"}`}>
                          <td className="sticky left-0 z-10 bg-white px-2 py-1 tabular-nums whitespace-nowrap">{p.npk}</td>
                          <td className="px-2 py-1">
                            <span>{p.bezeichnung || <span className="text-stone-300">—</span>}</span>
                            <button className="ml-1 text-orange-700 text-[10px] hover:underline align-top" title="Langtext, Bemerkung und Fabrikat bearbeiten" onClick={() => setDetail(p)}>ⓘ</button>
                            {p.fabrikat ? <span className="block text-[10px] text-stone-400">Fabrikat: {p.fabrikat}</span> : null}
                            {p.bemerkung ? <span className="block text-[10px] text-amber-700">{p.bemerkung}</span> : null}
                          </td>
                          <td className="px-2 py-1">
                            <select className="text-[11px] rounded border border-stone-200 px-1 py-0.5 bg-white" value={p.art || "normal"} title={(POSARTEN.find((x) => x.k === (p.art || "normal")) || {}).hilfe}
                              onChange={(e) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionen: a.positionen.map((x) => x.code === p.code ? { ...x, art: e.target.value } : x) } })}>
                              {POSARTEN.map((ar) => <option key={ar.k} value={ar.k}>{ar.l}</option>)}
                            </select>
                          </td>
                          <td className="px-2 py-1 text-stone-500 whitespace-nowrap">{p.einheit}</td>
                          <td className="px-2 py-1 text-right"><ZahlZelle className="w-16 text-xs text-right tabular-nums bg-transparent border-b border-transparent hover:border-stone-200 focus:border-orange-600 focus:outline-none" wert={p.menge} onSpeichern={(n) => dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionen: a.positionen.map((x) => x.code === p.code ? { ...x, menge: n } : x) } })} /></td>
                          {bieter.map((b, bi) => { const ep = eps[bi]; return (
                            <td key={bi} className={"px-1 py-1 border-l border-stone-100 " + (ep === minEp && ep > 0 ? "bg-emerald-50" : "")}>
                              <input className={cell} value={(b.preise || {})[p.code] ?? ""} onChange={(e) => setEp(bi, p.code, e.target.value)} placeholder="–" />
                            </td>
                          ); })}
                          <td className="border-l border-stone-100"></td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot className="sticky bottom-0 z-20">
                    <tr className="bg-stone-50 font-semibold border-t-2 border-stone-300">
                      <td className="sticky left-0 bg-stone-50 px-2 py-1.5">Total Brutto</td><td></td><td></td><td></td>
                      {bieter.map((b, bi) => <td key={bi} className="px-2 py-1.5 text-right tabular-nums border-l border-stone-200">{chf(bieterBrutto(b, a))}</td>)}<td className="border-l border-stone-200"></td>
                    </tr>
                    <tr className="bg-stone-50">
                      <td className="sticky left-0 bg-stone-50 px-2 py-1">Total Netto</td><td colSpan={3} className="text-[11px] text-stone-400 px-2">nach Konditionen</td>
                      {bieter.map((b, bi) => { const n = bieterNetto(b, a); return <td key={bi} className={"px-2 py-1 text-right tabular-nums border-l border-stone-200 " + (n === nw.min && n > 0 ? "text-emerald-600 font-semibold" : "")}>{chf(n)}</td>; })}<td className="border-l border-stone-200"></td>
                    </tr>
                    <tr className="bg-stone-50">
                      <td className="sticky left-0 bg-stone-50 px-2 py-1">Nutzwert</td><td colSpan={3} className="text-[11px] text-stone-400 px-2">Preis {nw.w.preis}% · Ref {nw.w.referenzen}% · Lehrl {nw.w.lehrlinge}%</td>
                      {bieter.map((b, bi) => { const r = nwByB.get(b); const rang = rangByB.get(b); return <td key={bi} className="px-2 py-1 text-right tabular-nums border-l border-stone-200">{r ? r.nutz.toFixed(1) : "–"}{rang === 1 && r && r.nutz > 0 ? <span className="text-emerald-600"> ★</span> : ""}</td>; })}<td className="border-l border-stone-200"></td>
                    </tr>
                    <tr className="bg-emerald-50/40 print:hidden">
                      <td className="sticky left-0 bg-emerald-50/40 px-2 py-1">Vergeben →</td><td></td><td></td><td></td>
                      {bieter.map((b, bi) => <td key={bi} className="px-2 py-1 text-right border-l border-stone-200">{b.name ? <button className="text-orange-800 hover:underline" onClick={() => setVergabeFor({ a, b, brutto: bieterBrutto(b, a), netto: bieterNetto(b, a) })}>wählen</button> : ""}</td>)}<td className="border-l border-stone-200"></td>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <div className="flex flex-wrap gap-2 items-center">
                <button className={btnGhost} onClick={() => setShowKond(!showKond)}>{showKond ? "Konditionen & Bewertung ausblenden" : "Konditionen & Bewertung"}</button>
                <button className={btnGhost} onClick={exportVergleich}>Vergleich als CSV exportieren</button>
                
                <button className={btnGhost} onClick={() => setOfferFor({ aId: a.id, bieterIndex: null })}>+ Offerte importieren</button>
              </div>
              <datalist id="firmenliste-lv">{(firmen || []).map((fa) => <option key={fa.id} value={fa.name} />)}</datalist>

              {showKond && bieter.length > 0 && (
                <div className={`${card} overflow-x-auto`}>
                  <div className="px-3 py-2 bg-stone-50 text-sm font-medium border-b border-stone-200">Konditionen (Kaskade auf Brutto) & Bewertungspunkte (0–100)</div>
                  <table className="w-full text-xs">
                    <thead className="text-stone-500"><tr><th className="text-left px-2 py-1.5">Unternehmer</th><th className="px-2 py-1.5 text-right">Rabatt %</th><th className="px-2 py-1.5 text-right">Pauschal</th><th className="px-2 py-1.5 text-right">Skonto %</th><th className="px-2 py-1.5 text-right">Bauabz. %</th><th className="px-2 py-1.5 text-right">Rundung</th><th className="px-2 py-1.5 text-right">Netto</th><th className="px-2 py-1.5 text-right">Referenz</th><th className="px-2 py-1.5 text-right">Lehrling</th><th className="px-2 py-1.5 text-left">Bemerkung</th></tr></thead>
                    <tbody>{bieter.map((b, bi) => (
                      <tr key={bi} className="border-t border-stone-100">
                        <td className="px-2 py-1 font-medium whitespace-nowrap">{b.name || ("Firma " + (bi + 1))}</td>
                        <td className="px-2 py-1"><input className={cell} value={b.rabattPct} onChange={(e) => patchBieter(bi, { rabattPct: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className={cell} value={b.pauschalabzug} onChange={(e) => patchBieter(bi, { pauschalabzug: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className={cell} value={b.skontoPct} onChange={(e) => patchBieter(bi, { skontoPct: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className={cell} value={b.bauabzuegePct} onChange={(e) => patchBieter(bi, { bauabzuegePct: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className={cell} value={b.rundung} onChange={(e) => patchBieter(bi, { rundung: e.target.value })} /></td>
                        <td className="px-2 py-1 text-right tabular-nums font-medium">{chf(bieterNetto(b, a))}</td>
                        <td className="px-2 py-1"><input className={cell} value={b.referenzPunkte} onChange={(e) => patchBieter(bi, { referenzPunkte: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className={cell} value={b.lehrlingPunkte} onChange={(e) => patchBieter(bi, { lehrlingPunkte: e.target.value })} /></td>
                        <td className="px-2 py-1"><input className="w-full text-xs px-1 py-0.5 border border-stone-200 rounded" value={b.bemerkung} onChange={(e) => patchBieter(bi, { bemerkung: e.target.value })} /></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              )}
            </>
          )}

          {a.bedingungen && (
            <div className={`${card} p-4`}>
              <h3 className="text-sm font-semibold mb-2">Besondere Bestimmungen / Bedingungen</h3>
              <div className="max-h-52 overflow-y-auto whitespace-pre-wrap text-xs text-stone-600">{a.bedingungen}</div>
            </div>
          )}
        </>
      )}

      {detail && (
        <Modal title={detail.npk + " " + (detail.bezeichnung || "")} onClose={() => setDetail(null)} wide>
          {(() => {
            const speichern = (patch) => {
              dispatch({ type: "update", coll: "angebote", id: a.id, patch: { positionen: a.positionen.map((x) => x.code === detail.code ? { ...x, ...patch } : x) } });
              setDetail({ ...detail, ...patch });
            };
            return (
              <div className="space-y-3">
                <div className="flex flex-wrap gap-4 text-xs text-stone-500">
                  <span>Einheit {detail.einheit || "—"}</span><span>Menge {detail.menge}</span>
                  <span>Art: <span className="font-medium text-stone-700">{posArtLabel(detail.art)}</span>{istGewertet(detail) ? "" : " — bepreist, aber ausserhalb des Vergleichstotals"}</span>
                </div>
                <Field label="Langtext / Beschrieb">
                  <textarea className={`${inputCls} min-h-[130px] font-mono text-xs`} value={(detail.langtext || []).join("\n")}
                    onChange={(e) => speichern({ langtext: e.target.value.split("\n") })} placeholder="Beschrieb aus dem Katalog — hier ergänzbar" />
                </Field>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <Field label="Fabrikat / Typ"><input className={inputCls} value={detail.fabrikat || ""} onChange={(e) => speichern({ fabrikat: e.target.value })} placeholder="z.B. Swisspor EPS 30 oder gleichwertig" /></Field>
                  <Field label="Bemerkung (intern)"><input className={inputCls} value={detail.bemerkung || ""} onChange={(e) => speichern({ bemerkung: e.target.value })} placeholder="Notiz zur Position" /></Field>
                </div>
                <p className="text-xs text-stone-400">Langtext und Fabrikat erscheinen im Leistungsverzeichnis-PDF unter der Position; die Bemerkung bleibt intern.</p>
              </div>
            );
          })()}
        </Modal>
      )}
      {offerFor && <OfferteImportModal a={d.angebote.find((x) => x.id === offerFor.aId)} bieterIndex={offerFor.bieterIndex} dispatch={dispatch} onClose={() => setOfferFor(null)} />}
      {vergabeFor && <VergabeModal info={vergabeFor} vertraege={d.vertraege} dispatch={dispatch} projektId={projektId} onClose={() => setVergabeFor(null)} db={db} rollen={rollen} />}
      {waehlerOffen && <PositionsWaehler db={db} d={d} dispatch={dispatch} aufnehmen={positionenAufnehmen} onClose={() => setWaehlerOffen(false)} />}

  );
}

function OfferteImportModal({ a, bieterIndex, dispatch, onClose }) {
  const [ziel, setZiel] = useState(bieterIndex != null ? String(bieterIndex) : "__new");
  const [neuName, setNeuName] = useState("");
  const [text, setText] = useState("");
  const [fileName, setFileName] = useState("");
  const fileRef = useRef(null);
  const result = useMemo(() => (text ? parseOfferteCsv(text, a.positionen || []) : { count: 0, preise: {} }), [text, a]);

  async function onFile(e) {
    const file = e.target.files?.[0]; if (!file) return;
    setFileName(file.name);
    try {
      if (/\.(crbx|e1s|sia|zip)$/i.test(file.name)) {
        const buf = await file.arrayBuffer(); const t = await unzipCrbx(buf); const parsed = parseSia451(t);
        const have = {}; (a.positionen || []).forEach((p) => { have[p.code] = true; });
        const csv = ["Code;Einheitspreis"];
        parsed.positionen.forEach((p) => { if (have[p.code] && p.preis) csv.push(p.code + ";" + p.preis); });
        setText(csv.join("\n"));
      } else {
        setText(await file.text());
      }
    } catch (err) { alert("Fehler beim Lesen der Datei: " + (err?.message || err)); }
  }
  function importieren() {
    const preise = result.preise; const bieter = [...(a.bieter || [])];
    if (ziel === "__new") bieter.push({ name: neuName || "Unternehmer", preise, bemerkung: "", rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, referenzPunkte: 0, lehrlingPunkte: 0 });
    else { const bi = Number(ziel); bieter[bi] = { ...bieter[bi], preise: { ...(bieter[bi].preise || {}), ...preise } }; }
    dispatch({ type: "update", coll: "angebote", id: a.id, patch: { bieter } });
    onClose();
  }
  return (
    <Modal title="Offerte eines Unternehmers importieren" onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Unternehmer">
            <select className={inputCls} value={ziel} onChange={(e) => setZiel(e.target.value)}>
              <option value="__new">— neuer Unternehmer —</option>
              {(a.bieter || []).map((b, bi) => <option key={bi} value={bi}>{b.name || `Firma ${bi + 1}`}</option>)}
            </select>
          </Field>
          {ziel === "__new" && <Field label="Name neuer Unternehmer"><input className={inputCls} value={neuName} onChange={(e) => setNeuName(e.target.value)} placeholder="z.B. Muster Bau AG" /></Field>}
        </div>
        <div className="flex items-center gap-2">
          <button className={btnGhost} onClick={() => fileRef.current?.click()}>Datei wählen (CSV oder .crbx)</button>
          <input ref={fileRef} type="file" accept=".csv,.crbx,.e1s,.sia,application/zip,text/csv" className="hidden" onChange={onFile} />
          {fileName && <span className="text-xs text-stone-500">{fileName}</span>}
        </div>
        <Field label="… oder Preise als CSV einfügen (Spalten: Code/NPK ; Einheitspreis)">
          <textarea className={`${inputCls} font-mono h-32`} value={text} onChange={(e) => setText(e.target.value)} placeholder={"Code;Einheitspreis\n661211;48.50\n661212;52.00"} />
        </Field>
        <div className="text-sm text-stone-600">{result.count} von {(a.positionen || []).length} Positionen zugeordnet.</div>
        <div className="flex justify-end gap-2"><button className={btnGhost} onClick={onClose}>Abbrechen</button><button className={btnPrimary} disabled={!result.count || (ziel === "__new" && !neuName)} onClick={importieren}>Preise übernehmen</button></div>
      </div>
    </Modal>
  );
}

function VergabeModal({ info, vertraege, dispatch, projektId, onClose, db, rollen }) {
  const { a, b, brutto, netto } = info;
  const [modus, setModus] = useState("neu");
  const [vertragId, setVertragId] = useState("");
  function vergeben() {
    if (!a.positionId) { alert("Bitte zuerst eine BKP-Position der Ausschreibung zuordnen."); return; }
    if (modus === "neu") {
      dispatch({ type: "add", coll: "vertraege", item: { id: uid(), projektId, positionId: a.positionId, unternehmer: b.name, nr: a.titel, betrag: brutto, rabattPct: Number(b.rabattPct) || 0, pauschalabzug: Number(b.pauschalabzug) || 0, skontoPct: Number(b.skontoPct) || 0, bauabzuegePct: Number(b.bauabzuegePct) || 0, rundung: Number(b.rundung) || 0, regieBudget: 0, teuerung: 0, datum: today(), ausschreibungen: [a.titel], firmaId: (findFirma(db.firmen, b.firmaId, b.name) || {}).id || "", firmaSnap: firmaSnapshot(findFirma(db.firmen, b.firmaId, b.name), ""), bauherrSnap: { bauherr: rollen.bauherr, bauherrAdresse: rollen.bauherrAdresse, bauherrPerson: rollen.bauherrPerson } } });
    } else {
      const v = vertraege.find((x) => x.id === vertragId); if (!v) return;
      dispatch({ type: "update", coll: "vertraege", id: v.id, patch: { betrag: (Number(v.betrag) || 0) + brutto, nr: [v.nr, a.titel].filter(Boolean).join(" + "), ausschreibungen: [...(v.ausschreibungen || []), a.titel] } });
    }
    onClose();
  }
  return (
    <Modal title={`Vergabe an ${b.name || "Unternehmer"}`} onClose={onClose}>
      <div className="space-y-3">
        <p className="text-sm text-stone-600">Ausschreibung «{a.titel}» · Brutto <span className="tabular-nums font-medium">{chf(brutto)}</span> → Netto <span className="tabular-nums font-medium">{chf(netto)}</span></p>
        <div className="flex gap-4 text-sm">
          <label className="inline-flex items-center gap-1.5"><input type="radio" checked={modus === "neu"} onChange={() => setModus("neu")} /> neuer Vertrag</label>
          <label className="inline-flex items-center gap-1.5"><input type="radio" checked={modus === "bestehend"} onChange={() => setModus("bestehend")} /> zu bestehendem Vertrag hinzufügen</label>
        </div>
        {modus === "bestehend" && (
          <Field label="Vertrag (Brutto wird addiert)"><select className={inputCls} value={vertragId} onChange={(e) => setVertragId(e.target.value)}><option value="">wählen…</option>{vertraege.map((v) => <option key={v.id} value={v.id}>{v.unternehmer}{v.nr ? ` · ${v.nr}` : ""} ({chf(v.betrag)})</option>)}</select></Field>
        )}
        <p className="text-xs text-stone-400">Bei «neuer Vertrag» werden die %-Konditionen des Bieters übernommen. Bei «bestehend» wird die Brutto-Summe addiert und es gelten die Konditionen des bestehenden Vertrags — so bündelt ein Vertrag mehrere Ausschreibungen. Regiebudget/Teuerung anschliessend unter «Verträge» ergänzen.</p>
        <div className="flex justify-end gap-2"><button className={btnGhost} onClick={onClose}>Abbrechen</button><button className={btnPrimary} disabled={modus === "bestehend" && !vertragId} onClick={vergeben}>Vergeben</button></div>
      </div>
    </Modal>
  );
}

        </div>

function RapportImport({ vertraege, onClose, onImport }) {
  const [text, setText] = useState("VertragsNr;Datum;Beschrieb;Stunden;Ansatz;Material\nV-2025-05;2026-05-12;Anpassung Heizung;16;95;2400\nV-2025-05;2026-05-19;Regie Verteiler;8;95;0");
  const rows = useMemo(() => {
    const lines = text.trim().split(/\r?\n/).filter((l) => l.trim()); if (!lines.length) return [];
    const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
    const first = splitDelimited(lines[0], delim).join(" ").toLowerCase();
    const hasHeader = /vertrag|datum|stunden|ansatz|material|beschr/.test(first);
    return (hasHeader ? lines.slice(1) : lines).map((line) => {
      const c = splitDelimited(line, delim); const key = (c[0] || "").trim();
      const v = vertraege.find((x) => String(x.nr).trim() === key || x.unternehmer === key);
      return { vertragId: v ? v.id : "", key, datum: (c[1] || today()).trim(), beschrieb: (c[2] || "").trim(), stunden: parseBetrag(c[3]), ansatz: parseBetrag(c[4]), material: parseBetrag(c[5]), _match: !!v };
    });
  }, [text, vertraege]);
  const ok = rows.filter((r) => r._match);
  return (
    <Modal title="Rapporte importieren" onClose={onClose} wide>
      <p className="text-sm text-stone-500 mb-2">Spalten: Vertrags-Nr. (oder Unternehmer) · Datum · Beschrieb · Stunden · Ansatz · Material.</p>
      <textarea className={`${inputCls} font-mono h-32`} value={text} onChange={(e) => setText(e.target.value)} />
      <div className="mt-3 max-h-48 overflow-y-auto border border-stone-200 rounded-md"><table className="w-full text-sm"><tbody>{rows.map((r, i) => (<tr key={i} className="border-b border-stone-100 last:border-0"><td className="px-3 py-1 tabular-nums w-28">{r.key}</td><td className="px-3 py-1">{r.beschrieb}</td><td className="px-3 py-1 text-right tabular-nums">{chf(r.stunden * r.ansatz + r.material)}</td><td className="px-3 py-1 w-24">{r._match ? <span className="text-emerald-600">✓</span> : <span className="text-red-500 text-xs">kein Vertrag</span>}</td></tr>))}</tbody></table></div>
      <div className="flex justify-end gap-2 pt-4"><button className={btnGhost} onClick={onClose}>Abbrechen</button><button className={btnPrimary} disabled={!ok.length} onClick={() => onImport(ok)}>{ok.length} Rapporte importieren</button></div>
    </Modal>
  );
}

    </div>
  );
}

function AbrechnungView({ ks, projekt, d, dispatch, projektId, db }) {
  const rollen = projektRollen(db, projekt);
  const ARTEN = [["vertrag", "Verträge / Nachträge"], ["rg", "Rechnungen"], ["erw", "Erwartungen"], ["rap", "Rapporte"], ["umb", "Umbuchungen"], ["mut", "Mutationen"]];
  // Welche Detailart gehört zu welchem Haken
  const artVon = (kind) => (kind === "nt" || kind === "teuerung" ? "vertrag" : kind);
  const [zeigeArt, setZeigeArt] = useState({ vertrag: true, rg: true, erw: true, rap: true, umb: true, mut: true });
  const [artImPdf, setArtImPdf] = useState({ vertrag: false, rg: false, erw: false, rap: false, umb: false, mut: false });
  const [pdfSpalten, setPdfSpalten] = useState({ kv: true, kvRevidiert: true, beauftragt: true, erwartung: false, prognose: true, bezahlt: true, abwKv: true });
  const [pdfBusy, setPdfBusy] = useState(false);
  const belegRef = useRef(null);
  const [belegFuer, setBelegFuer] = useState(null);

  // Klick auf eine Rechnung: Beleg anzeigen — oder gleich einen anhängen
  const belegOeffnen = async (r) => {
    if (r.beleg) {
      try {
        const blob = await belegLaden(r.beleg.id);
        if (!blob) { window.alert("Der hinterlegte Beleg wurde nicht gefunden. Bitte im Reiter «Rechnungen» neu anhängen."); return; }
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (e) { window.alert("Beleg konnte nicht geöffnet werden: " + e.message); }
      return;
    }
    if (window.confirm(`Zur Buchung ${r.buchungsNr || "–"} (${RTYP[r.typ] || "Rechnung"} ${r.nr || ""}) ist kein Beleg hinterlegt.\n\nJetzt ein PDF anhängen?`)) {
      setBelegFuer(r);
      setTimeout(() => belegRef.current?.click(), 0);
    }
  };
  const belegAnhaengen = async (datei) => {
    const r = belegFuer;
    setBelegFuer(null);
    if (!datei || !r) return;
    if (datei.type !== "application/pdf" && !/\.pdf$/i.test(datei.name)) { window.alert("Bitte eine PDF-Datei wählen."); return; }
    if (datei.size > 25 * 1024 * 1024) { window.alert("Die Datei ist grösser als 25 MB."); return; }
    try {
      const id = uid();
      await belegSpeichern(id, datei);
      dispatch({ type: "update", coll: "rechnungen", id: r.id, patch: { beleg: { id, name: datei.name, groesse: datei.size, datum: today() } } });
    } catch (e) { window.alert("Beleg konnte nicht gespeichert werden: " + e.message); }
  };

  const [brutto, setBrutto] = useState(false);
  const [open, setOpen] = useState({});
  const [allOpen, setAllOpen] = useState(false);
  const f = brutto ? (1 + ks.satz / 100) : 1;
  const V = (n) => chf((Number(n) || 0) * f);

  const details = useMemo(() => {
    const map = {};
    d.positionen.forEach((pos) => {
      const vts = d.vertraege.filter((v) => v.positionId === pos.id);
      const vIds = vts.map((v) => v.id);
      const items = [];
      vts.forEach((v) => {
        items.push({ kind: "vertrag", label: `Vertrag · ${v.unternehmer}${v.nr ? " (" + v.nr + ")" : ""}`, sub: hatKonditionen(v) ? konditionenText(v) : "", col: "vertrag", betrag: konditionenNetto(v.betrag, v, true) });
        d.nachtraege.filter((n) => n.vertragId === v.id).forEach((n) => {
          items.push({ kind: "nt", label: `Nachtrag · ${n.bezeichnung}`, sub: n.status, col: n.status === "genehmigt" ? "nt" : "prognose", betrag: n.status === "abgelehnt" ? 0 : konditionenNetto(n.betrag, v, false), muted: n.status !== "genehmigt" });
        });
        if (Number(v.teuerung)) items.push({ kind: "teuerung", label: `Teuerung · ${v.unternehmer}`, sub: "", col: "beauftragt", betrag: Number(v.teuerung) });
      });
      d.mutationen.filter((m) => m.positionId === pos.id).forEach((m) => items.push({ kind: "mut", label: `Mutation · ${m.grund || ""}`, sub: m.datum, col: "kvrev", betrag: Number(m.betrag) || 0, signed: true }));
      d.umbuchungen.filter((u) => u.vonPositionId === pos.id).forEach((u) => items.push({ kind: "umb", label: `Umbuchung → ${(d.positionen.find((p) => p.id === u.nachPositionId) || {}).bkp || "?"} · ${u.grund || ""}`, sub: u.datum, col: "kvrev", betrag: -(Number(u.betrag) || 0), signed: true }));
      d.umbuchungen.filter((u) => u.nachPositionId === pos.id).forEach((u) => items.push({ kind: "umb", label: `Umbuchung ← ${(d.positionen.find((p) => p.id === u.vonPositionId) || {}).bkp || "?"} · ${u.grund || ""}`, sub: u.datum, col: "kvrev", betrag: Number(u.betrag) || 0, signed: true }));
      d.erwartungen.filter((e) => e.positionId === pos.id).forEach((e) => items.push({ kind: "erw", label: `Erwartung · ${e.bezeichnung || "—"}`, sub: e.datum, col: "erwartung", betrag: Number(e.betrag) || 0, signed: true }));
      d.rapporte.filter((r) => vIds.includes(r.vertragId)).forEach((r) => {
        const v = d.vertraege.find((x) => x.id === r.vertragId);
        items.push({ kind: "rap", label: `Rapport · ${r.beschrieb || "—"}`, sub: `${r.datum} · ${v ? v.unternehmer : ""}`, col: "beauftragt", betrag: rapportNetto(r, v), muted: true });
      });
      const eig = ks.ordered.find((z) => z.pos.id === pos.id)?.eigen;
      if (eig && eig.regieUeber > 0) items.push({ kind: "erw", label: "Erwartung · Regieüberschuss (automatisch)", sub: "aus Rapporten", col: "erwartung", betrag: eig.regieUeber, signed: true });
      d.rechnungen.filter((r) => vIds.includes(r.vertragId) || r.positionId === pos.id).forEach((r) => {
        const va = vaFuerRechnung(db.vergauftraege, r.id);
        items.push({
          kind: "rg", rechnung: r,
          label: `${r.buchungsNr || "–"} · ${RTYP[r.typ] || "Rechnung"} ${r.nr || ""}`.trim(),
          sub: `${r.datum} · ${va ? va.nr || "Auftrag" : "nicht verbucht"}`,
          col: "bezahlt", betrag: Number(r.betrag) || 0, muted: r.status !== "bezahlt",
        });
      });
      if (items.length) map[pos.id] = items;
    });
    return map;
  }, [d, ks]);

  function setErwartungZiel(z, target) {
    const auto = z.eigen.regieUeber;
    const rows = d.erwartungen.filter((e) => e.positionId === z.pos.id);
    const adj = rows.find((e) => e.anpassung);
    const otherSum = rows.filter((e) => !e.anpassung).reduce((s, e) => s + (Number(e.betrag) || 0), 0);
    const neu = target - auto - otherSum;
    if (adj) {
      if (Math.abs(neu) < 0.005) dispatch({ type: "remove", coll: "erwartungen", id: adj.id });
      else dispatch({ type: "update", coll: "erwartungen", id: adj.id, patch: { betrag: neu, datum: today() } });
    } else if (Math.abs(neu) >= 0.005) {
      dispatch({ type: "add", coll: "erwartungen", item: { id: uid(), projektId, positionId: z.pos.id, bezeichnung: "Anpassung (Bauabrechnung)", anpassung: true, betrag: neu, datum: today() } });
    }
  }
  function setPrognoseZiel(z, target) { setErwartungZiel(z, target - prognoseBasis(z.eigen)); }

  function exportCsv() {
    const head = ["BKP", "Ebene", "Bezeichnung", "KV", "Mut./Umb.", "KV revidiert", "Vertrag netto", "NT genehmigt", "Teuerung", "Beauftragt", "Erwartung", "Prognose", "Bezahlt", "Abweichung KV"];
    const lines = [head.join(";")];
    ks.ordered.forEach((z) => lines.push([z.pos.bkp, z.depth, '"' + z.pos.bezeichnung + '"', z.roll.kv, z.roll.mutSumme, z.roll.kvRevidiert, Math.round(z.roll.vertragNetto), Math.round(z.roll.ntGen), z.roll.teuerung, Math.round(z.roll.beauftragt), Math.round(z.roll.erwartung), Math.round(z.roll.prognose), z.roll.bezahlt, Math.round(z.roll.abwKv)].join(";")));
    const t = ks.total;
    lines.push(["", "", "TOTAL NETTO", t.kv, "", t.kvRevidiert, Math.round(t.vertragNetto), Math.round(t.ntGen), t.teuerung, Math.round(t.beauftragt), Math.round(t.erwartung), Math.round(t.prognose), t.bezahlt, Math.round(t.abwKv)].join(";"));
    lines.push(["", "", `MwSt ${ks.satz}%`, "", "", "", "", "", "", "", "", Math.round(ks.mwst), "", ""].join(";"));
    lines.push(["", "", "TOTAL BRUTTO", "", "", "", "", "", "", "", "", Math.round(ks.brutto), "", ""].join(";"));
    if (ks.reserve) lines.push(["", "", `Teuerungsreserve ${ks.resSatz}%`, "", "", "", "", "", "", "", "", Math.round(ks.reserve), "", ""].join(";"));
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `Bauabrechnung_${(projekt?.name || "Projekt").replace(/\s+/g, "_")}.csv`; a.click(); URL.revokeObjectURL(url);
  }
  if (!ks.ordered.length) return <Empty text="Noch keine Daten für die Bauabrechnung." />;
  const t = ks.total;
  const byGroup = {}; ks.ordered.forEach((z) => { const g = bkpGroup(z.pos.bkp); (byGroup[g] = byGroup[g] || []).push(z); });
  const colIdx = { kv: 1, kvrev: 2, vertrag: 3, nt: 4, beauftragt: 5, erwartung: 6, prognose: 7, bezahlt: 8 };
  const isOpen = (id) => allOpen || open[id];

  return (
    <div className="space-y-4">
      <div className="flex gap-2 print:hidden flex-wrap items-center">
        <button className={btnPrimary} onClick={exportCsv}>CSV exportieren</button>
        <button className={btnGhost} disabled={pdfBusy} onClick={async () => {
          setPdfBusy(true);
          try {
            const bytes = await baueAbrechnungPdf({ ks, projekt, rollen, d, db, brutto, spalten: pdfSpalten, artImPdf, details });
            pdfSpeichern(bytes, `Bauabrechnung_${(projekt?.name || "").replace(/[^\w]+/g, "_")}.pdf`);
          } catch (e) { window.alert("Die Bauabrechnung konnte nicht erzeugt werden: " + e.message); }
          setPdfBusy(false);
        }}>{pdfBusy ? "erzeugt…" : "📄 PDF"}</button>

        <input ref={belegRef} type="file" accept="application/pdf,.pdf" className="hidden" onChange={(e) => { belegAnhaengen(e.target.files[0]); e.target.value = ""; }} />
        <button className={btnGhost} onClick={() => { setAllOpen(!allOpen); setOpen({}); }}>{allOpen ? "Details zuklappen" : "Alle Details aufklappen"}</button>
        <div className="ml-auto inline-flex rounded-md border border-stone-200 overflow-hidden text-sm">
          <button className={`px-3 py-1.5 ${!brutto ? "bg-orange-800 text-white" : "bg-white text-stone-600"}`} onClick={() => setBrutto(false)}>Netto</button>
          <button className={`px-3 py-1.5 ${brutto ? "bg-orange-800 text-white" : "bg-white text-stone-600"}`} onClick={() => setBrutto(true)}>Brutto (inkl. {ks.satz}%)</button>
        </div>
      </div>
      <div className={`${card} p-3 print:hidden`}>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs">
          <span className="text-stone-500 font-medium">PDF-Einstellungen</span>
          {[["kv", "KV"], ["kvRevidiert", "KV revidiert"], ["beauftragt", "Beauftragt"], ["erwartung", "Erwartung"], ["prognose", "Prognose"], ["bezahlt", "Bezahlt"], ["abwKv", "Abweichung"]].map(([k, l]) => (
            <label key={k} className="inline-flex items-center gap-1.5 text-stone-600"><input type="checkbox" checked={!!pdfSpalten[k]} onChange={(e) => setPdfSpalten({ ...pdfSpalten, [k]: e.target.checked })} /> {l}</label>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs mt-2 pt-2 border-t border-stone-100">
          <span className="text-stone-500 font-medium">Details ins PDF</span>
          {ARTEN.map(([k, l]) => (
            <label key={k} className="inline-flex items-center gap-1.5 text-stone-600"><input type="checkbox" checked={!!artImPdf[k]} onChange={(e) => setArtImPdf({ ...artImPdf, [k]: e.target.checked })} /> {l}</label>
          ))}
        </div>
      </div>
      <div className={`${card} p-3 print:hidden`}>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs">
          <span className="text-stone-500 font-medium">Details am Bildschirm</span>
          {ARTEN.map(([k, l]) => (
            <label key={k} className="inline-flex items-center gap-1.5 text-stone-600"><input type="checkbox" checked={zeigeArt[k] !== false} onChange={(e) => setZeigeArt({ ...zeigeArt, [k]: e.target.checked })} /> {l}</label>
          ))}
        </div>
      </div>
      <p className="text-xs text-stone-400 print:hidden">▸ öffnet Detailzeilen (Verträge, Rechnungen, Mutationen, Erwartungen). Doppelklick auf <strong>Erwartung</strong> oder <strong>Prognose</strong> einer Position (ohne Unterpositionen) setzt den Wert direkt — die Differenz wird als Zeile «Anpassung (Bauabrechnung)» in den Erwartungen geführt. Direkteingabe wirkt auf Nettowerte.</p>
      <div className={`${card} p-5`}>
        <div className="mb-4 pb-3 border-b border-stone-200">
          <h2 className="text-lg font-bold">Bauabrechnung / Kostenzusammenstellung nach BKP</h2>
          <p className="text-sm text-stone-500">{projekt?.name}{projekt?.strasse ? `, ${projekt.strasse}` : ""} · {projekt?.plzOrt || projekt?.ort} · Bauherr: {projekt?.bauherr} · Stand {today()} · Beträge {brutto ? "brutto" : "netto"}</p>
        </div>
        <div className="overflow-x-auto"><table className="w-full text-xs">
          <thead className="text-stone-500"><tr className="border-b border-stone-300">
            <th className="text-left font-medium px-2 py-1.5">BKP / Bezeichnung</th><th className="text-right font-medium px-2 py-1.5">KV</th><th className="text-right font-medium px-2 py-1.5">KV rev.</th><th className="text-right font-medium px-2 py-1.5">Vertrag</th><th className="text-right font-medium px-2 py-1.5">NT gen.</th><th className="text-right font-medium px-2 py-1.5">Beauftr.</th><th className="text-right font-medium px-2 py-1.5">Erwartung</th><th className="text-right font-medium px-2 py-1.5">Prognose</th><th className="text-right font-medium px-2 py-1.5">Bezahlt</th><th className="text-right font-medium px-2 py-1.5">Abw. KV</th>
          </tr></thead>
          <tbody>
            {ks.groups.map((g) => (
              <React.Fragment key={g.g}>
                <tr className="bg-stone-100 font-medium"><td className="px-2 py-1" colSpan={10}>{g.g} · {g.name}</td></tr>
                {(byGroup[g.g] || []).map((z) => {
                  const det = details[z.pos.id] || [];
                  const editable = !z.hasChildren;
                  return (
                    <React.Fragment key={z.pos.id}>
                      <tr className={`border-b border-stone-50 ${z.hasChildren ? "font-semibold bg-stone-50/40" : ""}`}>
                        <td className="px-2 py-1" style={{ paddingLeft: 8 + z.depth * 16 }}>
                          {det.length > 0 && <button className="text-stone-400 hover:text-stone-700 mr-1 print:hidden" onClick={() => setOpen({ ...open, [z.pos.id]: !isOpen(z.pos.id) })}>{isOpen(z.pos.id) ? "▾" : "▸"}</button>}
                          <span className="tabular-nums">{z.pos.bkp}</span> {z.pos.bezeichnung}
                        </td>
                        <td className="px-2 py-1 text-right tabular-nums">{V(z.roll.kv)}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{V(z.roll.kvRevidiert)}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{z.roll.vertragNetto ? V(z.roll.vertragNetto) : "–"}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{z.roll.ntGen ? V(z.roll.ntGen) : "–"}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{z.roll.beauftragt ? V(z.roll.beauftragt) : "–"}</td>
                        <td className="px-2 py-1 text-right tabular-nums">
                          {editable ? <EditCell value={z.eigen.erwartung} display={z.roll.erwartung ? V(z.roll.erwartung) : "–"} onSave={(v) => setErwartungZiel(z, v)} /> : (z.roll.erwartung ? V(z.roll.erwartung) : "–")}
                        </td>
                        <td className="px-2 py-1 text-right tabular-nums font-medium">
                          {editable ? <EditCell value={z.eigen.prognose} display={V(z.roll.prognose)} onSave={(v) => setPrognoseZiel(z, v)} /> : V(z.roll.prognose)}
                        </td>
                        <td className="px-2 py-1 text-right tabular-nums">{V(z.roll.bezahlt)}</td>
                        <td className="px-2 py-1 text-right"><Abw v={z.roll.abwKv * f} /></td>
                      </tr>
                      {isOpen(z.pos.id) && det.filter((it) => zeigeArt[artVon(it.kind)] !== false).map((it, i) => {
                        const cells = Array(8).fill(null);
                        cells[colIdx[it.col] - 1] = it;
                        return (
                          <tr key={i} className="border-b border-stone-50 bg-stone-50/60 text-[11px] text-stone-500">
                            <td className="px-2 py-0.5" style={{ paddingLeft: 24 + z.depth * 16 }}>↳ {it.kind === "rg"
                              ? <button className="text-left hover:underline text-orange-800" title={it.rechnung.beleg ? "Beleg öffnen: " + it.rechnung.beleg.name : "Kein Beleg hinterlegt"} onClick={() => belegOeffnen(it.rechnung)}>{it.rechnung.beleg ? "📄 " : ""}{it.label}</button>
                              : it.label}{it.sub ? <span className="text-stone-400"> · {it.sub}</span> : ""}</td>
                            {cells.map((c, ci) => (
                              <td key={ci} className={`px-2 py-0.5 text-right tabular-nums ${c && c.muted ? "italic text-stone-400" : ""}`}>
                                {c ? (c.signed ? (c.betrag > 0 ? "+" : "") + chf(c.betrag * f) : chf(c.betrag * f)) + (c.muted && c.kind === "rg" ? " (offen)" : "") + (c.muted && c.kind === "nt" ? " (pendent)" : "") : ""}
                              </td>
                            ))}
                            <td></td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
                <tr className="border-b border-stone-200 text-stone-600 font-medium">
                  <td className="px-2 py-1">Zwischentotal {g.g}</td>
                  <td className="px-2 py-1 text-right tabular-nums">{V(g.kv)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.kvRevidiert)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.vertragNetto)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.ntGen)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.beauftragt)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.erwartung)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.prognose)}</td><td className="px-2 py-1 text-right tabular-nums">{V(g.bezahlt)}</td><td className="px-2 py-1 text-right"><Abw v={g.abwKv * f} /></td>
                </tr>
              </React.Fragment>
            ))}
          </tbody>
          <tfoot><tr className="border-t-2 border-stone-800 font-bold text-sm">
            <td className="px-2 py-2">TOTAL {brutto ? "BRUTTO" : "NETTO"}</td>
            <td className="px-2 py-2 text-right tabular-nums">{V(t.kv)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.kvRevidiert)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.vertragNetto)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.ntGen)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.beauftragt)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.erwartung)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.prognose)}</td><td className="px-2 py-2 text-right tabular-nums">{V(t.bezahlt)}</td><td className="px-2 py-2 text-right"><Abw v={t.abwKv * f} /></td>
          </tr></tfoot>
        </table></div>
        <div className="mt-5 max-w-sm ml-auto text-sm space-y-1">
          <div className="flex justify-between"><span className="text-stone-500">Prognose netto</span><span className="tabular-nums font-medium">{chf(t.prognose)}</span></div>
          <div className="flex justify-between"><span className="text-stone-500">MwSt {ks.satz}%</span><span className="tabular-nums">{chf(ks.mwst)}</span></div>
          <div className="flex justify-between border-t border-stone-200 pt-1"><span className="font-semibold">Prognose brutto</span><span className="tabular-nums font-semibold">{chf(ks.brutto)}</span></div>
          {ks.reserve > 0 && <div className="flex justify-between text-stone-500"><span>+ Teuerungsreserve {ks.resSatz}% (auf KV rev.)</span><span className="tabular-nums">{chf(ks.reserve)}</span></div>}
          <div className="flex justify-between border-t border-stone-200 pt-1"><span className="text-stone-500">Abweichung zu KV (netto)</span><Abw v={t.abwKv} /></div>
          <div className="flex justify-between"><span className="text-stone-500">Bezahlt netto / offen</span><span className="tabular-nums">{chf(t.bezahlt)} / {chf(t.offen)}</span></div>
        </div>
      </div>
    </div>
  );
}

    P("271", "Gipserarbeiten", 110000),
