function parseBetrag(raw) {
  if (typeof raw === "number") return raw;
  if (!raw) return 0;
  let s = String(raw).replace(/CHF/gi, "").replace(/Fr\.?/gi, "").trim().replace(/'/g, "").replace(/\s/g, "");
  if (s.includes(".") && s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function splitDelimited(line, delim) {
  const cells = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') inQ = !inQ;
    else if (ch === delim && !inQ) { cells.push(cur); cur = ""; }
    else cur += ch;
  }
  cells.push(cur);
  return cells.map((c) => c.trim().replace(/^"|"$/g, ""));
}
function parseKvText(text) {
  const lines = text.trim().split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return [];
  const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
  const first = splitDelimited(lines[0], delim).join(" ").toLowerCase();
  const hasHeader = /bkp|bezeichn|betrag|kv|text/.test(first);
  return (hasHeader ? lines.slice(1) : lines).map((line) => {
    const c = splitDelimited(line, delim);
    return { bkp: (c[0] || "").trim(), bezeichnung: (c[1] || "").trim(), kv: parseBetrag(c[2]) };
  }).filter((r) => r.bkp || r.bezeichnung);
}
function nestImported(rows, projektId) {
  const withIds = rows.map((r) => ({ id: uid(), projektId, bkp: r.bkp, bezeichnung: r.bezeichnung, kv: r.kv, parentId: null }));
  const byBkp = {}; withIds.forEach((p) => { byBkp[String(p.bkp).trim()] = p; });
  withIds.forEach((p) => {
    const bkp = String(p.bkp).trim(); let best = null;
    Object.keys(byBkp).forEach((k) => { if (k !== bkp && bkp.startsWith(k) && /[.\- ]/.test(bkp.charAt(k.length))) { if (!best || k.length > best.length) best = k; } });
    if (best) p.parentId = byBkp[best].id;
  });
  return withIds;
}

  x *= (1 - (Number(k.bauabzuegePct) || 0) / 100);
  if (includeFixed) x += (Number(k.rundung) || 0);
  return x;
}
const hatKonditionen = (v) => ["rabattPct", "pauschalabzug", "skontoPct", "bauabzuegePct", "rundung"].some((k) => Number(v[k]));
const konditionenText = (v) => [Number(v.rabattPct) ? `Rabatt ${v.rabattPct}%` : "", Number(v.pauschalabzug) ? `Pauschal ${chf(v.pauschalabzug)}` : "", Number(v.skontoPct) ? `Skonto ${v.skontoPct}%` : "", Number(v.bauabzuegePct) ? `Bauabz. ${v.bauabzuegePct}%` : "", Number(v.rundung) ? `Rund. ${chf(v.rundung)}` : ""].filter(Boolean).join(" · ") || "—";

async function inflateRaw(arrayBuffer) {

}

function parseSia451(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.length);
  const header = {}, conditions = {}, records = [], bedingungen = [];
  for (const l of lines) {
    const rt = l.slice(0, 4);
    if (rt[0] === "A") {
      const bkpM = l.match(/BKP[ .\d]+\D.{0,36}/);
      if (bkpM && !header.titel) header.titel = bkpM[0].replace(/\s+$/, "").trim();
      const pj = l.match(/\d{5,6}\s+([A-Za-zÄÖÜäöü][^\d]{3,40})/);

    } else if (rt.startsWith("C00") && rt !== "C000") {

      const kind = l.slice(43, 44);
      let digits, sign;
      if (kind === "P") { const f = l.slice(61, 74); sign = f.includes("-") ? -1 : 1; digits = f.replace(/[^0-9]/g, ""); }
      else { const f = l.slice(74, 81); sign = f.includes("-") ? -1 : 1; digits = f.replace(/[^0-9]/g, ""); }
      const val = sign * (parseInt(digits || "0", 10) / 100);
      const map = SIA_COND[art];
      if (map) conditions[map[0]] = Math.abs(val);
      if (map && map[0] === "mwst") conditions.mwst = Math.abs(val);
    } else if (rt[0] === "G") {
      const catalog = rt.slice(1).trim();
      const code = l.slice(5, 17).replace(/\s/g, "");
      const level = l.slice(41, 42).trim();
      const unit = l.slice(50, 60).trim();
      const txt = l.slice(90).trim();
      let menge = null, preis = null;
      if (level === "6" && l.includes("GP")) {
        const qd = l.slice(45, 58).replace(/[^0-9]/g, "");
        if (qd) menge = parseInt(qd, 10) / 1000;
        const pd = l.slice(62, 74).replace(/[^0-9]/g, "");
        if (pd && /[1-9]/.test(pd)) preis = parseInt(pd, 10) / 100;
      }
      records.push({ catalog, code, level, unit, txt });
      if (catalog === "102" && txt && (level === "2" || level === "3")) bedingungen.push(txt);
      if (menge !== null) records[records.length - 1].menge = menge;
      if (preis !== null) records[records.length - 1].preis = preis;

    const gp = records[i + 1] && records[i + 1].level === "6" ? records[i + 1] : null;
    const p6 = r.code.slice(0, 6);
    let eigen = "";

    const lang = [];
    for (let j = 0; j < i; j++) { const rj = records[j]; if (rj.catalog === r.catalog && rj.level === "3" && rj.txt && rj.code.slice(0, 6) === p6) lang.push(rj.txt); }

}
function buildSia451(titel, positionen, preise) {

  const num = (v, len) => { const s = Math.round(Math.abs(v || 0)).toString(); return (v < 0 ? "-" : "+") + "0".repeat(Math.max(0, len - s.length)) + s; };

  positionen.forEach((p) => {
    const cat = p.catalog || "661";
    const codePad = pad(p.code, 12);
    out.push("G" + cat + " " + codePad + pad("", 24) + "2" + pad("", 48) + (p.bezeichnung || ""));
    out.push("G" + cat + " " + codePad + pad("", 24) + "5" + pad("", 9) + pad(p.einheit, 9));
    const menge = num((p.menge || 0) * 1000, 13);

// ---------- Offerte als CSV (Unternehmer-Preise) ----------
// Vorlage zum Versand an Unternehmer; sie tragen die Einheitspreise ein und senden zurück.
function buildOfferteCsv(titel, positionen, preise) {
  const esc = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const head = ["NPK", "Code", "Bezeichnung", "Einheit", "Menge", "Einheitspreis"];
  const lines = [esc(titel || "Ausschreibung"), head.join(";")];
  (positionen || []).forEach((p) => lines.push([p.npk, p.code, esc(p.bezeichnung), p.einheit, p.menge, preise && preise[p.code] != null && preise[p.code] !== "" ? preise[p.code] : ""].join(";")));
  return "﻿" + lines.join("\r\n");
}
// Zurückgesendete Offerte parsen: ordnet Einheitspreise per Code/NPK den Positionen zu.
function parseOfferteCsv(text, positionen) {
  const lines = text.replace(/^﻿/, "").trim().split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return { count: 0, preise: {} };
  const norm = (s) => String(s || "").replace(/[^0-9]/g, "");
  const byCode = {}; (positionen || []).forEach((p) => { byCode[norm(p.code)] = p.code; });
  const detect = (line) => { const delim = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ","; return { delim, cells: splitDelimited(line, delim) }; };
  let codeCol = -1, priceCol = -1, start = 0;
  for (let i = 0; i < Math.min(lines.length, 3); i++) {
    const low = detect(lines[i]).cells.map((c) => c.toLowerCase());
    if (low.some((h) => /code|npk/.test(h)) && low.some((h) => /preis|ep/.test(h))) {
      low.forEach((h, idx) => { if (codeCol < 0 && /code|npk/.test(h)) codeCol = idx; if (/preis|ep/.test(h)) priceCol = idx; });
      start = i + 1; break;
    }
  }
  const preise = {}; let count = 0;
  for (let i = start; i < lines.length; i++) {
    const c = detect(lines[i]).cells;
    const code = byCode[norm(codeCol >= 0 ? c[codeCol] : c[0])]; if (!code) continue;

    if (priceCol >= 0) price = parseBetrag(c[priceCol]);
    else { for (let k = c.length - 1; k >= 1; k--) { if (c[k] !== "" && parseBetrag(c[k])) { price = parseBetrag(c[k]); break; } } }
    if (price) { preise[code] = price; count++; }
  }
  return { count, preise };
}

// ---------- Belegablage (IndexedDB) ----------
// Rechnungs-PDFs sind zu gross für localStorage (dort ist bei ~5 MB Schluss).
// Sie liegen deshalb in einer eigenen Browser-Datenbank; die Stammdaten bleiben wie bisher.
const BELEG_DB = "bauadmin:belege", BELEG_STORE = "belege";
let belegDbPromise = null;
function belegDb() {
  if (belegDbPromise) return belegDbPromise;
  belegDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("Dieser Browser unterstützt keine Belegablage.")); return; }
    const req = indexedDB.open(BELEG_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(BELEG_STORE)) req.result.createObjectStore(BELEG_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Belegablage nicht verfügbar."));
  });
  return belegDbPromise;
}
function belegTx(modus, arbeit) {
  return belegDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(BELEG_STORE, modus);
    const req = arbeit(tx.objectStore(BELEG_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

    };
    if (p.bauherr && !hat("Bauherrschaft")) db.beteiligte.push({ id: uid(), projektId: p.id, firmaId: firmaFuer(p.bauherr, p.bauherrAdresse).id, rolle: "Bauherrschaft", hauptpersonId: "" });
    if (p.bauleitung && !hat("Bauleitung")) db.beteiligte.push({ id: uid(), projektId: p.id, firmaId: firmaFuer(p.bauleitung, "").id, rolle: "Bauleitung", hauptpersonId: "" });
    // Beauftragte Firmen erscheinen als Unternehmer unter den Beteiligten
    (db.vertraege || []).filter((v) => v.projektId === p.id).forEach((v) => {
      const fa = (db.firmen || []).find((x) => x.id === v.firmaId) || (v.unternehmer ? db.firmen.find((x) => x.name.trim().toLowerCase() === String(v.unternehmer).trim().toLowerCase()) : null);
      if (!fa) return;
      if (!db.beteiligte.some((b) => b.projektId === p.id && b.firmaId === fa.id)) db.beteiligte.push({ id: uid(), projektId: p.id, firmaId: fa.id, rolle: "Unternehmer", hauptpersonId: (fa.personen || [])[0]?.id || "" });
    });
  });
  db.vertraege = db.vertraege.map((v) => {
    const n = { rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, regieBudget: 0, teuerung: 0, rueckbehaltPct: 0, abnahme: "", garantieJahre: 2, buergschaft: false, pauschal: false, garantieArt: "", nrAlt: "", ...v };
    // Das frühere Häkchen «Bürgschaft» geht in der Garantieart auf
    if (!n.garantieArt) n.garantieArt = n.buergschaft ? "solidarbuergschaft" : (Number(n.rueckbehaltPct) > 0 ? "rueckbehalt" : "");
    return n;
  });
  db.rechnungen = db.rechnungen.map((r) => ({ typ: r.typ || "rechnung", beleg: null, buchungsNr: "", ...r }));
  // Bestehende Rechnungen je Projekt nach Datum nachnummerieren
  db.projekte.forEach((pr) => {
    const offen = db.rechnungen.filter((r) => r.projektId === pr.id && !r.buchungsNr).sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
    if (!offen.length) return;
    let i = db.rechnungen.filter((r) => r.projektId === pr.id && r.buchungsNr).length;
    offen.forEach((r) => { i++; r.buchungsNr = `B-${String(i).padStart(4, "0")}`; });
  });
  db.positionen.forEach((p) => {
    if (p.erwartungManuell !== undefined && p.erwartungManuell !== null && p.erwartungManuell !== "") {
      db.erwartungen.push({ id: uid(), projektId: p.projektId, positionId: p.id, bezeichnung: "Übernommen (alt)", betrag: Number(p.erwartungManuell) || 0, datum: today() });
      delete p.erwartungManuell;
    }
  });
  db.angebote = db.angebote.map((a) => {
    if (a.leistungen) {
      const bieter = (a.bieter || []).map((b) => ({
        name: b.name, bemerkung: b.bemerkung || "",
        brutto: b.brutto !== undefined ? b.brutto : (a.leistungen || []).reduce((s, l) => s + (parseBetrag(b.preise?.[l.pos]) || 0) * (Number(l.menge) || 0), 0),
        rabattPct: b.rabattPct || 0, pauschalabzug: b.pauschalabzug || 0, skontoPct: b.skontoPct || 0, bauabzuegePct: b.bauabzuegePct || 0, rundung: b.rundung || 0,
        referenzPunkte: b.referenzPunkte !== undefined ? b.referenzPunkte : (Number(b.referenzNote) || 0) * 20,
        lehrlingPunkte: b.lehrlingPunkte !== undefined ? b.lehrlingPunkte : (Number(b.lehrlingNote) || 0) * 20,
      }));
      const { leistungen, ...rest } = a;
      return { ...rest, bieter };
    }
    a.bieter = (a.bieter || []).map((b) => ({ bemerkung: "", rabattPct: 0, pauschalabzug: 0, skontoPct: 0, bauabzuegePct: 0, rundung: 0, referenzPunkte: 0, lehrlingPunkte: 0, preise: {}, ...b }));
    return a;
  });
  db.angebote = db.angebote.map((a) => ({ positionen: [], bedingungen: "", modus: (a.positionen && a.positionen.length) ? "lv" : "pauschal", ...a, bieter: (a.bieter || []).map((b) => ({ preise: {}, ...b })) }));
  return db;
}

function reducer(db, a) {
  switch (a.type) {
    case "load": return a.db;
    case "setAktiv": return { ...db, aktiv: a.id };
    case "setVorlage": return { ...db, vorlage: a.vorlage };
    case "add": return { ...db, [a.coll]: [...db[a.coll], a.item] };
    case "addMany": return { ...db, [a.coll]: [...db[a.coll], ...a.items] };
    case "update": return { ...db, [a.coll]: db[a.coll].map((x) => (x.id === a.id ? { ...x, ...a.patch } : x)) };
    case "remove": {
      if (a.coll === "positionen") {
        const descend = new Set([a.id]); let added = true;
        while (added) { added = false; db.positionen.forEach((p) => { if (p.parentId && descend.has(p.parentId) && !descend.has(p.id)) { descend.add(p.id); added = true; } }); }
        return { ...db, positionen: db.positionen.filter((x) => !descend.has(x.id)) };
      }
      return { ...db, [a.coll]: db[a.coll].filter((x) => x.id !== a.id) };
    }
    case "seed": return a.db;
    default: return db;
  }
}

// ---------- PDF-Erzeugung (pdf-lib) ----------
const A4 = { breite: 595.28, hoehe: 841.89 };              // Hochformat
const A4Q = { breite: 841.89, hoehe: 595.28 };             // Querformat
const RAND = 40;
const RSTATUS = { erfasst: "erfasst", geprueft: "geprüft", bezahlt: "bezahlt" };

// Umlaute u.ä. auf WinAnsi beschränken — die Standardschriften können nichts anderes
function pdfText(t) {
  return String(t ?? "").replace(/[«»]/g, '"').replace(/[–—−]/g, "-").replace(/[’‘]/g, "'").replace(/…/g, "...").replace(/[^\x20-\xFF\n]/g, "");
}
function chfPdf(n) { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/ | /g, "'"); }
function pct(n, stellen) { const v = Number(n) || 0; return (v > 0 ? "+" : "") + v.toFixed(stellen === undefined ? 1 : stellen) + "%"; }

// Kleiner Zeichenhelfer: hält die aktuelle Schreibposition und legt bei Bedarf eine neue Seite an
function pdfBlatt(doc, schriften, format, vorlage, logoBild) {
  const f = format || A4;
  const quer = f.breite > f.hoehe;
  const v = vorlage || {};
  const fussHoehe = ((v.fuss || []).filter(Boolean).length ? 12 : 0) + (v.seitenzahl === false ? 0 : 11);
  const untenRand = RAND + fussHoehe;
  // Platz für das Logo auf jeder Seite freihalten
  const logoBreite = logoBild ? (Number(quer ? v.logoBreiteQuer : v.logoBreiteHoch) || 120) : 0;
  const logoHoehe = logoBild ? logoBreite * (logoBild.height / logoBild.width) : 0;
  const obenRand = f.hoehe - RAND - (logoHoehe ? logoHoehe + 10 : 0);
  let seite = doc.addPage([f.breite, f.hoehe]);
  const seiten = [seite];
  let y = obenRand;
  const api = {
    get seite() { return seite; },
    get y() { return y; },
    set y(v) { y = v; },
    format: f,
    neueSeite() { seite = doc.addPage([f.breite, f.hoehe]); seiten.push(seite); y = obenRand; return seite; },
    platz(hoehe) { if (y - hoehe < untenRand) api.neueSeite(); return y; },
    get untenRand() { return untenRand; },
    get seiten() { return seiten; },
    // Logo und Fusszeilen erst am Schluss auf alle Seiten legen
    abschliessen() {
      const fussZeilen = (v.fuss || []).filter(Boolean);
      seiten.forEach((sp, i) => {
        if (logoBild) {
          const x = v.logoPos === "rechts" ? f.breite - RAND - logoBreite : (v.logoPos === "mitte" ? (f.breite - logoBreite) / 2 : RAND);
          sp.drawImage(logoBild, { x, y: f.hoehe - RAND + 8 - logoHoehe, width: logoBreite, height: logoHoehe });
        }
        let fy = RAND - 4;
        if (v.seitenzahl !== false) {
          const t = pdfText(`Seite ${i + 1} von ${seiten.length}`);
          sp.drawText(t, { x: f.breite - RAND - schriften.normal.widthOfTextAtSize(t, 7.5), y: fy, size: 7.5, font: schriften.normal, color: PDFLib.rgb(0.55, 0.52, 0.50) });
        }
        fussZeilen.forEach((zl, k) => {
          sp.drawText(pdfText(zl), { x: RAND, y: fy + (fussZeilen.length - 1 - k) * 10, size: 7.5, font: schriften.normal, color: PDFLib.rgb(0.55, 0.52, 0.50) });
        });
      });
    },
    text(t, opt) {
      const o = opt || {};
      const size = o.size || 9;
      const font = o.fett ? schriften.fett : schriften.normal;
      const txt = pdfText(t);
      let x = o.x !== undefined ? o.x : RAND;
      if (o.rechts !== undefined) x = o.rechts - font.widthOfTextAtSize(txt, size);
      if (o.mitte !== undefined) x = o.mitte - font.widthOfTextAtSize(txt, size) / 2;
      seite.drawText(txt, { x, y: o.y !== undefined ? o.y : y, size, font, color: o.farbe || PDFLib.rgb(0.13, 0.12, 0.11) });
      return font.widthOfTextAtSize(txt, size);
    },
    linie(x1, x2, yy, dicke, farbe) {
      seite.drawLine({ start: { x: x1, y: yy !== undefined ? yy : y }, end: { x: x2, y: yy !== undefined ? yy : y }, thickness: dicke || 0.5, color: farbe || PDFLib.rgb(0.8, 0.78, 0.75) });
    },
    kasten(x, yy, b, h, farbe) { seite.drawRectangle({ x, y: yy, width: b, height: h, color: farbe }); },
    // Text auf mehrere Zeilen umbrechen
    umbruch(t, breite, size, fett) {
      const font = fett ? schriften.fett : schriften.normal;
      const worte = pdfText(t).split(/\s+/).filter(Boolean);
      const zeilen = []; let z = "";
      worte.forEach((w) => {
        const probe = z ? z + " " + w : w;
        if (font.widthOfTextAtSize(probe, size) > breite && z) { zeilen.push(z); z = w; } else z = probe;
      });
      if (z) zeilen.push(z);
      return zeilen;
    },
  };
  return api;
}

// Vorlage samt eingebettetem Logo für ein PDF vorbereiten
async function pdfVorlage(doc, db, projekt) {
  const v = aktiveVorlage(db, projekt);
  let logoBild = null;
  if (v.logoId) {
    try {
      const blob = await logoLaden(v.logoId);
      if (blob) {
        const bytes = new Uint8Array(await blob.arrayBuffer());
        logoBild = blob.type === "image/jpeg" || /\.jpe?g$/i.test(v.logoName || "")
          ? await doc.embedJpg(bytes)
          : await doc.embedPng(bytes);
      }
    } catch (e) { logoBild = null; }
  }
  return { v, logoBild };
}

// Kopfzeile für die von der App erzeugten PDF-Seiten
function pdfKopf(bl, titel, projekt, rollen, zusatz, vorlage) {
  const v = vorlage || {};
  // Freie Kopfzeilen der Vorlage zuerst, dann der Dokumentkopf
  const kopfZeilen = (v.kopf || []).filter(Boolean);
  if (kopfZeilen.length) {
    const rechtsK = bl.format.breite - RAND;
    kopfZeilen.forEach((zl, i) => bl.text(zl, { rechts: rechtsK, y: bl.y - i * 10, size: 7.5, farbe: PDFLib.rgb(0.55, 0.52, 0.50) }));
    bl.y -= kopfZeilen.length * 10 + 6;
  }
  bl.text(titel.toUpperCase(), { size: 8, farbe: PDFLib.rgb(0.45, 0.42, 0.40) });
  bl.y -= 16;
  bl.text(projekt?.name || "", { size: 15, fett: true });
  bl.y -= 13;
  bl.text([projekt?.strasse, projekt?.plzOrt || projekt?.ort].filter(Boolean).join(", "), { size: 8.5, farbe: PDFLib.rgb(0.42, 0.40, 0.38) });
  const rechts = bl.format.breite - RAND;
  bl.text(today(), { size: 8.5, rechts, y: bl.format.hoehe - RAND });
  if (rollen?.bauherr) bl.text("Bauherr: " + rollen.bauherr, { size: 8.5, rechts, y: bl.format.hoehe - RAND - 13, farbe: PDFLib.rgb(0.42, 0.40, 0.38) });
  if (rollen?.bauleitung) bl.text("Bauleitung: " + rollen.bauleitung, { size: 8.5, rechts, y: bl.format.hoehe - RAND - 25, farbe: PDFLib.rgb(0.42, 0.40, 0.38) });
  if (zusatz) { bl.y -= 13; bl.text(zusatz, { size: 9, fett: true }); }
  bl.y -= 10;
  bl.linie(RAND, rechts, bl.y, 1.2, PDFLib.rgb(0.13, 0.12, 0.11));
  bl.y -= 18;
}

function firmaOrt(fa) { return fa ? [fa.plz, fa.ort].filter(Boolean).join(" ") : ""; }

// ---------- Cost engine v4 ----------
function eigenPosition(pos, d) {
  const mutSumme = d.mutationen.filter((m) => m.positionId === pos.id).reduce((s, m) => s + (Number(m.betrag) || 0), 0);
  const umbIn = d.umbuchungen.filter((u) => u.nachPositionId === pos.id).reduce((s, u) => s + (Number(u.betrag) || 0), 0);
  const umbOut = d.umbuchungen.filter((u) => u.vonPositionId === pos.id).reduce((s, u) => s + (Number(u.betrag) || 0), 0);
  const kvRevidiert = (Number(pos.kv) || 0) + mutSumme + umbIn - umbOut;

  const vts = d.vertraege.filter((v) => v.positionId === pos.id);
  const vertragNetto = vts.reduce((s, v) => s + konditionenNetto(v.betrag, v, true), 0);
  const teuerung = vts.reduce((s, v) => s + (Number(v.teuerung) || 0), 0);
  const vIds = vts.map((v) => v.id);
  let ntGen = 0, ntPend = 0;
  d.nachtraege.forEach((n) => {
    const v = vts.find((x) => x.id === n.vertragId); if (!v) return;
    const net = konditionenNetto(n.betrag, v, false);
    if (n.status === "genehmigt") ntGen += net; else if (n.status === "pendent") ntPend += net;
  });
  const beauftragt = vertragNetto + ntGen + teuerung;

  let regieUeber = 0, rapportSumme = 0;
  vts.forEach((v) => {
    const rs = d.rapporte.filter((r) => r.vertragId === v.id).reduce((s, r) => s + rapportNetto(r, v), 0);
    rapportSumme += rs; regieUeber += Math.max(0, rs - (Number(v.regieBudget) || 0));
  });

  const erwZeilen = d.erwartungen.filter((e) => e.positionId === pos.id).reduce((s, e) => s + (Number(e.betrag) || 0), 0);
  const erwartung = erwZeilen + regieUeber;

  const rechs = d.rechnungen.filter((r) => vIds.includes(r.vertragId) || r.positionId === pos.id);
  const bezahlt = rechs.filter((r) => r.status === "bezahlt").reduce((s, r) => s + (Number(r.betrag) || 0), 0);
  const fakturiert = rechs.reduce((s, r) => s + (Number(r.betrag) || 0), 0);

  const basis = beauftragt > 0 ? beauftragt + ntPend : kvRevidiert;
  const prognose = Math.max(basis + erwartung, fakturiert);
  return { kv: Number(pos.kv) || 0, mutSumme: mutSumme + umbIn - umbOut, kvRevidiert, vertragNetto, ntGen, ntPend, teuerung, beauftragt, rapportSumme, regieUeber, erwartung, prognose, bezahlt, fakturiert };
}
const prognoseBasis = (e) => (e.beauftragt > 0 ? e.beauftragt + e.ntPend : e.kvRevidiert);

function orderedPositions(positionen) {
  const byParent = {}; positionen.forEach((p) => { const k = p.parentId || "__root"; (byParent[k] = byParent[k] || []).push(p); });
  const sortFn = (a, b) => String(a.bkp).localeCompare(String(b.bkp), "de", { numeric: true });
  const out = []; const seen = new Set();
  function walk(key, depth) { (byParent[key] || []).sort(sortFn).forEach((p) => { if (seen.has(p.id)) return; seen.add(p.id); out.push({ ...p, depth }); walk(p.id, depth + 1); }); }
  walk("__root", 0);
  positionen.forEach((p) => { if (!seen.has(p.id)) { seen.add(p.id); out.push({ ...p, depth: 0 }); } });
  return out;
}

function useKostenStand(d, projekt) {
  return useMemo(() => {
    const eig = {}; d.positionen.forEach((p) => { eig[p.id] = eigenPosition(p, d); });
    const childrenOf = {}; d.positionen.forEach((p) => { const k = p.parentId || "__root"; (childrenOf[k] = childrenOf[k] || []).push(p.id); });
    const roll = {}; const visiting = new Set();
    function computeRoll(id) {
      if (roll[id] || visiting.has(id)) return; visiting.add(id);
      const r = { ...eig[id] };
      (childrenOf[id] || []).forEach((cid) => { computeRoll(cid); METRICS.forEach((k) => r[k] += roll[cid][k]); });
      r.abwKv = r.prognose - r.kv; r.offen = r.prognose - r.bezahlt;
      roll[id] = r; visiting.delete(id);
    }
    d.positionen.forEach((p) => computeRoll(p.id));
    const ordered = orderedPositions(d.positionen).map((p) => ({ pos: p, depth: p.depth, eigen: eig[p.id], roll: roll[p.id], hasChildren: (childrenOf[p.id] || []).length > 0 }));
    const total = {}; METRICS.forEach((k) => total[k] = d.positionen.reduce((s, p) => s + eig[p.id][k], 0));
    total.abwKv = total.prognose - total.kv; total.offen = total.prognose - total.bezahlt;
    const groups = {};
    d.positionen.forEach((p) => {
      const g = bkpGroup(p.bkp);
      if (!groups[g]) { groups[g] = { g, name: BKP_GROUPS[g] || "—" }; METRICS.forEach((k) => groups[g][k] = 0); }
      METRICS.forEach((k) => groups[g][k] += eig[p.id][k]);
    });
    Object.values(groups).forEach((g) => { g.abwKv = g.prognose - g.kv; });
    const satz = Number(projekt?.mwstSatz) || 0;
    const resSatz = Number(projekt?.teuerungsReserve) || 0;
    const mwst = total.prognose * satz / 100;
    const reserve = total.kvRevidiert * resSatz / 100;
    return { ordered, total, groups: Object.values(groups).sort((a, b) => a.g.localeCompare(b.g)), satz, resSatz, mwst, brutto: total.prognose + mwst, reserve };
  }, [d, projekt]);
}

function posSelectOptions(positionen) {
  return orderedPositions(positionen).map((p) => ({ id: p.id, depth: p.depth, label: "  ".repeat(p.depth) + (p.depth ? "↳ " : "") + p.bkp + " " + p.bezeichnung }));
}
function descendantIds(positionen, id) {
  const set = new Set(); let added = true;
  while (added) { added = false; positionen.forEach((p) => { if ((p.parentId === id || set.has(p.parentId)) && !set.has(p.id)) { set.add(p.id); added = true; } }); }
  return set;
}

// ---------- UI atoms ----------

function Num({ v }) { return <span className="tabular-nums">{chf(v)}</span>; }
function Abw({ v }) { const cls = v > 0 ? "text-red-600" : v < 0 ? "text-emerald-600" : "text-stone-400"; return <span className={`tabular-nums font-medium ${cls}`}>{v > 0 ? "+" : ""}{chf(v)}</span>; }

}
function Ampel({ kv, prognose }) {
  const max = Math.max(kv, prognose, 1); const kvPct = (kv / max) * 100; const pPct = (prognose / max) * 100; const over = prognose > kv;
  return (<div className="relative h-2.5 rounded-full bg-stone-100 overflow-hidden"><div className={`absolute inset-y-0 left-0 ${over ? "bg-red-500" : "bg-emerald-500"}`} style={{ width: pPct + "%" }} /><div className="absolute inset-y-0 w-0.5 bg-stone-800" style={{ left: kvPct + "%" }} /></div>);
}
function Modal({ title, onClose, children, wide }) {

    <div className="fixed inset-0 z-50 flex items-start justify-center bg-stone-900/40 p-4 overflow-y-auto" onClick={onClose}>

function Empty({ text }) { return <div className="text-center py-12 text-stone-400 text-sm">{text}</div>; }
function EditCell({ value, display, onSave }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState("");
  if (editing) return (
    <input autoFocus className="w-24 text-xs text-right border border-orange-600 rounded px-1 py-0.5 tabular-nums bg-white"
      value={val} onChange={(e) => setVal(e.target.value)}
      onBlur={() => { onSave(parseBetrag(val)); setEditing(false); }}
      onKeyDown={(e) => { if (e.key === "Enter") { onSave(parseBetrag(val)); setEditing(false); } if (e.key === "Escape") setEditing(false); }} />
  );
  return <span className="cursor-pointer hover:bg-orange-50 rounded px-0.5 -mx-0.5" title="Doppelklick zum Bearbeiten" onDoubleClick={() => { setVal(String(Math.round(Number(value) || 0))); setEditing(true); }}>{display}</span>;
}

// Buchungsnummer: fortlaufend je Projekt, überschreibbar
function naechsteBuchungsNr(rechnungen, projektId) {
  const belegt = new Set((rechnungen || []).filter((r) => r.projektId === projektId).map((r) => String(r.buchungsNr || "")));
  let i = belegt.size + 1;
  while (belegt.has(`B-${String(i).padStart(4, "0")}`)) i++;
  return `B-${String(i).padStart(4, "0")}`;
}
// In welchem Vergütungsauftrag steckt diese Rechnung?
function vaFuerRechnung(vergauftraege, rechnungId) {
  return (vergauftraege || []).find((a) => (a.rechnungIds || []).includes(rechnungId)) || null;
}
// Wirksame PDF-Vorlage: eine eigene Projektvorlage schlägt die globale
function aktiveVorlage(db, projekt) {
  const g = db?.vorlage || {};
  if (projekt?.vorlageEigen && projekt.vorlage) return { ...g, ...projekt.vorlage };
  return g;
}
const GARANTIEARTEN = [
  { k: "", l: "— keine —" },
  { k: "rueckbehalt", l: "Rückbehalt" },
  { k: "bankgarantie", l: "Bankgarantie" },
  { k: "solidarbuergschaft", l: "Solidarbürgschaft" },
  { k: "versicherungsgarantie", l: "Versicherungsgarantie" },
  { k: "garantieschein", l: "Garantieschein" },
];
const garantieArtLabel = (k) => (k ? (GARANTIEARTEN.find((g) => g.k === k) || {}).l : "") || "–";
// Nummernvorschlag: dreistellige BKP-Gruppe der Position, laufend hochgezählt
function vertragsNrVorschlag(vertraege, positionen, positionId) {
  const pos = (positionen || []).find((p) => p.id === positionId);
  if (!pos) return "";
  const gruppe = String(pos.bkp || "").split(".")[0].slice(0, 3);
  if (!gruppe) return "";
  const belegt = (vertraege || []).map((v) => String(v.nr || "")).filter((n) => n.startsWith(gruppe + "."));
  let i = 1;
  while (belegt.includes(`${gruppe}.${String(i).padStart(2, "0")}`)) i++;
  return `${gruppe}.${String(i).padStart(2, "0")}`;
}

function garantieBis(v) {
  if (!v.abnahme) return null;
  const d = new Date(v.abnahme);
  if (isNaN(d.getTime())) return null;
  d.setFullYear(d.getFullYear() + (Number(v.garantieJahre) || 0));
  return d.toISOString().slice(0, 10);
}
function garantieStatus(bis) {
  if (!bis) return null;
  const rest = (new Date(bis).getTime() - new Date(today()).getTime()) / 86400000;
  if (rest < 0) return { label: "abgelaufen", cls: "bg-stone-100 text-stone-500" };
  if (rest < 180) return { label: "läuft ab", cls: "bg-amber-100 text-amber-700" };
  return { label: "aktiv", cls: "bg-emerald-100 text-emerald-700" };
}
const VERLAUF_SERIEN = [
  { key: "prognose", label: "Prognose", col: "#1d4ed8", dash: "" },
  { key: "bezahlt", label: "Bezahlt", col: "#0d9488", dash: "" },
  { key: "kvRevidiert", label: "KV revidiert", col: "#78716c", dash: "6 4" },
];
function KostenverlaufChart({ punkte }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const W = 760, H = 270, L = 56, R = 104, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const maxY = Math.max(1, ...punkte.flatMap((s) => VERLAUF_SERIEN.map((k) => Number(s[k.key]) || 0))) * 1.08;
  const x = (i) => punkte.length === 1 ? L + iw / 2 : L + iw * i / (punkte.length - 1);
  const y = (v) => T + ih - ih * (Number(v) || 0) / maxY;
  const fmt = (v) => v >= 1e6 ? (v / 1e6).toLocaleString("de-CH", { maximumFractionDigits: 1 }) + " Mio" : Math.round(v / 1000) + "k";
  const path = (key) => punkte.map((s, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");
  function onMove(e) {
    const rect = wrapRef.current?.getBoundingClientRect(); if (!rect) return;
    const px = (e.clientX - rect.left) / rect.width * W;
    let best = 0, bd = Infinity;
    punkte.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; best = i; } });
    setHover(best);
  }
  const hp = hover != null ? punkte[hover] : null;
  return (
    <div>
      <div className="flex gap-4 flex-wrap mb-2 text-xs text-stone-600">
        {VERLAUF_SERIEN.map((s) => (
          <span key={s.key} className="inline-flex items-center gap-1.5">
            <svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke={s.col} strokeWidth="2" strokeDasharray={s.dash} /></svg>{s.label}
          </span>
        ))}
      </div>
      <div ref={wrapRef} className="relative" onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Kostenstand-Verlauf">
          {[0, 0.25, 0.5, 0.75, 1].map((f) => (
            <g key={f}>
              <line x1={L} y1={y(f * maxY)} x2={W - R} y2={y(f * maxY)} stroke="#e7e5e4" strokeWidth="1" />
              <text x={L - 6} y={y(f * maxY) + 3.5} textAnchor="end" fontSize="10" fill="#a8a29e">{fmt(f * maxY)}</text>
            </g>
          ))}
          {hover != null && <line x1={x(hover)} y1={T} x2={x(hover)} y2={T + ih} stroke="#a8a29e" strokeWidth="1" strokeDasharray="3 3" />}
          {VERLAUF_SERIEN.map((s) => <path key={s.key} d={path(s.key)} fill="none" stroke={s.col} strokeWidth="2" strokeDasharray={s.dash} strokeLinejoin="round" />)}
          {VERLAUF_SERIEN.map((s) => punkte.map((pt, i) => (
            <circle key={s.key + i} cx={x(i)} cy={y(pt[s.key])} r={hover === i ? 4.5 : 3} fill={s.col} stroke="#fff" strokeWidth="1.5" />
          )))}
          {(() => {
            const last = punkte[punkte.length - 1];
            const labs = VERLAUF_SERIEN.map((s) => ({ s, ly: y(last[s.key]) })).sort((a, b) => a.ly - b.ly);
            for (let i = 1; i < labs.length; i++) if (labs[i].ly - labs[i - 1].ly < 12) labs[i].ly = labs[i - 1].ly + 12;
            return labs.map(({ s, ly }) => <text key={s.key} x={W - R + 8} y={ly + 3.5} fontSize="10" fontWeight="600" fill={s.col}>{s.label}</text>);
          })()}
          {punkte.map((pt, i) => (punkte.length <= 8 || i === 0 || i === punkte.length - 1 || hover === i) && (
            <text key={i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="10" fill="#a8a29e" className="tabular-nums">{pt.datum}{pt.live ? " (heute)" : ""}</text>
          ))}
        </svg>
        {hp && (
          <div className="absolute top-2 bg-white border border-stone-200 rounded-md shadow-lg px-3 py-2 text-xs pointer-events-none z-10" style={{ left: `min(max(${x(hover) / W * 100}% - 70px, 4px), calc(100% - 150px))` }}>
            <div className="font-medium tabular-nums mb-1">{hp.datum}{hp.live ? " (heute, live)" : ""}</div>
            {VERLAUF_SERIEN.map((s) => (
              <div key={s.key} className="flex items-center justify-between gap-3">
                <span className="inline-flex items-center gap-1.5 text-stone-500"><span className="w-2 h-2 rounded-full inline-block" style={{ background: s.col }} />{s.label}</span>
                <span className="tabular-nums font-medium">{chf(hp[s.key])}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- PDF-Vorlage: Logo, Kopf- und Fusszeilen ----------
function VorlageEditor({ wert, onAendern, titel, hinweis }) {
  const v = wert || {};
  const ref = useRef(null);
  const [logoUrl, setLogoUrl] = useState("");
  const setzen = (patch) => onAendern({ ...v, ...patch });

  useEffect(() => {
    let tot = false, url = "";
    if (v.logoId) logoLaden(v.logoId).then((blob) => { if (blob && !tot) { url = URL.createObjectURL(blob); setLogoUrl(url); } }).catch(() => {});
    else setLogoUrl("");
    return () => { tot = true; if (url) URL.revokeObjectURL(url); };
  }, [v.logoId]);

  const logoWaehlen = async (datei) => {
    if (!datei) return;
    if (!/^image\/(png|jpeg)$/.test(datei.type)) { window.alert("Bitte ein PNG oder JPG wählen."); return; }
    if (datei.size > 4 * 1024 * 1024) { window.alert("Das Logo ist grösser als 4 MB. Bitte verkleinern."); return; }
    try {
      const id = v.logoId || uid();
      await logoSpeichern(id, datei);
      setzen({ logoId: id, logoName: datei.name });
    } catch (e) { window.alert("Logo konnte nicht gespeichert werden: " + e.message); }
  };

  const zeile = (feld, i, platzhalter) => (
    <input key={feld + i} className={inputCls} value={(v[feld] || [])[i] || ""} placeholder={platzhalter}
      onChange={(e) => { const arr = [...(v[feld] || [])]; arr[i] = e.target.value; setzen({ [feld]: arr }); }} />
  );

  return (
    <div className={`${card} p-4 space-y-4`}>
      <div>
        <div className="font-medium text-sm">{titel}</div>
        {hinweis ? <p className="text-xs text-stone-500 mt-0.5">{hinweis}</p> : null}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-4">
        <div>
          <div className="text-xs text-stone-500 mb-1.5">Firmenlogo</div>
          <div className="border border-dashed border-stone-300 rounded-lg p-3 bg-stone-50 flex items-center justify-center h-[90px] overflow-hidden"
            onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); logoWaehlen(e.dataTransfer.files[0]); }}>
            {logoUrl ? <img src={logoUrl} alt="Logo" className="max-h-[74px] max-w-full object-contain" /> : <span className="text-xs text-stone-400 text-center">PNG oder JPG<br />hierher ziehen</span>}
          </div>
          <input ref={ref} type="file" accept="image/png,image/jpeg" className="hidden" onChange={(e) => { logoWaehlen(e.target.files[0]); e.target.value = ""; }} />
          <div className="flex gap-2 mt-1.5">
            <button className={btnGhost} onClick={() => ref.current?.click()}>{v.logoId ? "Ersetzen" : "Logo wählen"}</button>
            {v.logoId ? <button className="text-red-600 text-xs hover:underline" onClick={() => setzen({ logoId: "", logoName: "" })}>Entfernen</button> : null}
          </div>
        </div>

        <div className="space-y-3">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <Field label="Position"><select className={inputCls} value={v.logoPos || "links"} onChange={(e) => setzen({ logoPos: e.target.value })}><option value="links">links</option><option value="mitte">mitte</option><option value="rechts">rechts</option></select></Field>
            <Field label="Breite Hochformat (mm)"><input className={inputCls} value={Math.round((Number(v.logoBreiteHoch) || 120) / 2.835)} onChange={(e) => setzen({ logoBreiteHoch: parseBetrag(e.target.value) * 2.835 })} /></Field>
            <Field label="Breite Querformat (mm)"><input className={inputCls} value={Math.round((Number(v.logoBreiteQuer) || 150) / 2.835)} onChange={(e) => setzen({ logoBreiteQuer: parseBetrag(e.target.value) * 2.835 })} /></Field>
          </div>
          <div>
            <div className="text-xs text-stone-500 mb-1.5">Kopfzeilen (rechts oben, bis zu drei)</div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">{[0, 1, 2].map((i) => zeile("kopf", i, i === 0 ? "BauPlan Architekten GmbH" : i === 1 ? "Bahnhofstrasse 1, 8001 Zürich" : "044 200 10 20 · info@bauplan.ch"))}</div>
          </div>
          <div>
            <div className="text-xs text-stone-500 mb-1.5">Fusszeilen (links unten, bis zu zwei)</div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">{[0, 1].map((i) => zeile("fuss", i, i === 0 ? "BauPlan Architekten GmbH · www.bauplan.ch" : "Erstellt mit BauAdmin"))}</div>
          </div>
          <label className="inline-flex items-center gap-2 text-sm"><input type="checkbox" checked={v.seitenzahl !== false} onChange={(e) => setzen({ seitenzahl: e.target.checked })} /> Seitenzahl «Seite X von Y» unten rechts</label>
        </div>
      </div>

      <VorlageVorschau v={v} logoUrl={logoUrl} />
    </div>
  );
}

// Zeigt Hoch- und Querformat nebeneinander
function VorlageVorschau({ v, logoUrl }) {
  const Blatt = ({ quer }) => {
    const b = quer ? 210 : 148, h = quer ? 148 : 210;
    const logoB = ((Number(quer ? v.logoBreiteQuer : v.logoBreiteHoch) || 120) / (quer ? 841.89 : 595.28)) * b;
    const just = v.logoPos === "rechts" ? "flex-end" : v.logoPos === "mitte" ? "center" : "flex-start";
    return (
      <div className="border border-stone-300 bg-white shadow-sm relative" style={{ width: b, height: h }}>
        <div className="absolute inset-0 p-2 flex flex-col">
          <div className="flex" style={{ justifyContent: just }}>
            {logoUrl ? <img src={logoUrl} alt="" style={{ width: logoB, maxHeight: 26, objectFit: "contain" }} /> : <div className="text-[6px] text-stone-300 border border-dashed border-stone-300 px-1" style={{ width: logoB }}>Logo</div>}
          </div>
          <div className="text-right text-[5px] text-stone-400 leading-[1.5] mt-0.5">{(v.kopf || []).filter(Boolean).map((z, i) => <div key={i}>{z}</div>)}</div>
          <div className="mt-1 text-[5px] text-stone-400">DOKUMENTTITEL</div>

// Rolle wird erst beim Verlassen des Felds übernommen — sonst würde die Gruppierung bei jedem Tastendruck umsortieren
// Zahlenfeld für Tabellenzellen: während des Tippens bleibt der Rohtext stehen (kein Sprung auf 0),
// übernommen wird die geparste Zahl beim Verlassen des Felds
function ZahlZelle({ wert, onSpeichern, className }) {
  const [entwurf, setEntwurf] = useState(String(wert ?? ""));
  const [aktiv, setAktiv] = useState(false);
  useEffect(() => { if (!aktiv) setEntwurf(String(wert ?? "")); }, [wert, aktiv]);
  const uebernehmen = () => { setAktiv(false); const n = parseBetrag(entwurf); setEntwurf(String(n)); if (n !== Number(wert)) onSpeichern(n); };
  return (
    <input
      className={className}
      value={entwurf}
      onFocus={() => setAktiv(true)}
      onChange={(e) => setEntwurf(e.target.value)}
      onBlur={uebernehmen}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") { setEntwurf(String(wert ?? "")); setAktiv(false); e.currentTarget.blur(); } }}
    />
  );
}

function RolleFeld({ wert, onSpeichern }) {
  const [entwurf, setEntwurf] = useState(wert);
  const [aktiv, setAktiv] = useState(false);
  useEffect(() => { if (!aktiv) setEntwurf(wert); }, [wert, aktiv]);
  return (
    <input
      className={inputCls}
      list="rollenliste"
      value={entwurf}
      onFocus={() => setAktiv(true)}
      onChange={(e) => setEntwurf(e.target.value)}
      onBlur={() => { setAktiv(false); if (entwurf !== wert) onSpeichern(entwurf.trim()); }}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") { setEntwurf(wert); setAktiv(false); e.currentTarget.blur(); } }}
    />
  );
}

// Zeilen einer Liste — je nach Typ aus Beteiligten oder aus den Anbietern einer Ausschreibung
function listenZeilen(liste, db, d, projektId) {
  if (liste.typ === "submittenten") {
    const quellen = liste.angebotId ? d.angebote.filter((a) => a.id === liste.angebotId) : d.angebote;
    const out = [];
    quellen.forEach((a) => (a.bieter || []).forEach((b) => {
      const fa = findFirma(db.firmen, b.firmaId, b.name);
      out.push({ rolle: a.titel, firma: fa, name: b.name, person: null, adresse: fa ? firmaAdresse(fa) : "", email: fa?.email || "", festnetz: "", mobile: "", ampel: fa?.ampel || "" });
    }));
    return out;
  }
  return projektBeteiligte(db, projektId)
    .filter((b) => !liste.rollen.length || liste.rollen.includes(b.rolle || "Ohne Rolle"))
    .map((b) => ({ rolle: b.rolle || "Ohne Rolle", firma: b.firma, name: b.firma.name, person: b.person, adresse: firmaAdresse(b.firma), email: b.person?.email || b.firma.email || "", festnetz: b.person?.festnetz || "", mobile: b.person?.mobile || "", ampel: b.firma.ampel || "" }))
    .sort((a, b) => a.rolle.localeCompare(b.rolle, "de") || a.name.localeCompare(b.name, "de"));
}

function ListenVorschau({ liste, db, d, projektId }) {
  const zeilen = listenZeilen(liste, db, d, projektId);
  if (!zeilen.length) return <div className="text-sm text-stone-500 border-t border-stone-100 pt-3">Diese Liste ist noch leer.</div>;
  return (
    <div className="border-t border-stone-100 pt-3 overflow-x-auto">
      <table className="w-full text-sm">

            <td className="py-1.5 pr-3">{personName(z.person) || "–"}</td>

            <td className="py-1.5 text-stone-600">{z.email || "–"}</td>

  );
}

function PersonenTabelle({ firma, upd }) {
  const personen = firma.personen || [];
  const setP = (list) => upd(firma.id, { personen: list });
  const updP = (id, patch) => setP(personen.map((pe) => (pe.id === id ? { ...pe, ...patch } : pe)));
  const cell = "w-full text-sm bg-transparent border-b border-transparent hover:border-stone-200 focus:border-orange-600 focus:outline-none py-0.5";
  return (
    <div className={card}>
      <div className="px-4 py-2.5 border-b border-stone-100 flex items-center justify-between">
        <div className="font-medium text-sm">Personen</div>
        <button className={btnGhost} onClick={() => setP([...personen, { id: uid(), vorname: "", nachname: "", funktion: "", email: "", festnetz: "", mobile: "" }])}>+ Person</button>
      </div>
      {!personen.length ? <div className="px-4 py-4 text-sm text-stone-500">Noch keine Person erfasst — z.B. Projektleiter, Bauführer oder Bauherrenvertreter.</div> : (
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs"><tr>
            <th className="text-left font-medium px-3 py-2">Vorname</th><th className="text-left font-medium px-3 py-2">Nachname</th><th className="text-left font-medium px-3 py-2">Funktion</th>
            <th className="text-left font-medium px-3 py-2">E-Mail</th><th className="text-left font-medium px-3 py-2">Festnetz</th><th className="text-left font-medium px-3 py-2">Mobile</th><th className="w-12"></th>
          </tr></thead>
          <tbody>{personen.map((pe) => (
            <tr key={pe.id} className="border-t border-stone-100">
              <td className="px-3 py-1.5"><input className={cell} value={pe.vorname || ""} onChange={(e) => updP(pe.id, { vorname: e.target.value })} /></td>
              <td className="px-3 py-1.5 font-medium"><input className={cell} value={pe.nachname || ""} onChange={(e) => updP(pe.id, { nachname: e.target.value })} /></td>
              <td className="px-3 py-1.5"><input className={cell} value={pe.funktion || ""} onChange={(e) => updP(pe.id, { funktion: e.target.value })} placeholder="Projektleiter" /></td>
              <td className="px-3 py-1.5"><input className={cell} value={pe.email || ""} onChange={(e) => updP(pe.id, { email: e.target.value })} /></td>
              <td className="px-3 py-1.5"><input className={cell} value={pe.festnetz || ""} onChange={(e) => updP(pe.id, { festnetz: e.target.value })} /></td>
              <td className="px-3 py-1.5"><input className={cell} value={pe.mobile || ""} onChange={(e) => updP(pe.id, { mobile: e.target.value })} /></td>
              <td className="px-3 py-1.5 text-right"><button className="text-red-600 text-xs hover:underline" onClick={() => setP(personen.filter((x) => x.id !== pe.id))}>Lö.</button></td>
            </tr>
          ))}</tbody>
        </table></div>
      )}
    </div>
  );
}

        </div>
        <div className="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2.5 text-sm text-stone-600">Bauherrschaft, Bauleitung und weitere Beteiligte werden im Reiter <span className="font-medium">Beteiligte</span> zugeordnet — mit Firma und zuständiger Person aus dem Adressstamm. Alle Druckdokumente ziehen die Angaben von dort.</div>

function Dashboard({ ks, d, dispatch, projektId }) {
  const t = ks.total;
  if (!ks.ordered.length) return <Empty text="Noch keine BKP-Positionen erfasst. Importiere zuerst den Kostenvoranschlag." />;
  const over = ks.ordered.filter((z) => !z.hasChildren && z.roll.abwKv > 0).sort((a, b) => b.roll.abwKv - a.roll.abwKv).slice(0, 5);
  const snaps = [...(d.snapshots || [])].sort((a, b) => String(a.datum).localeCompare(String(b.datum)));
  const live = { datum: today(), live: true, kv: t.kv, kvRevidiert: t.kvRevidiert, beauftragt: t.beauftragt, erwartung: t.erwartung, prognose: t.prognose, bezahlt: t.bezahlt };
  const punkte = [...snaps.filter((s) => s.datum !== today()), live];
  function festhalten() {
    const heute = (d.snapshots || []).find((s) => s.datum === today());
    const item = { projektId, datum: today(), kv: t.kv, kvRevidiert: t.kvRevidiert, beauftragt: t.beauftragt, erwartung: t.erwartung, prognose: t.prognose, bezahlt: t.bezahlt };
    if (heute) dispatch({ type: "update", coll: "snapshots", id: heute.id, patch: item });
    else dispatch({ type: "add", coll: "snapshots", item: { id: uid(), ...item } });
  }
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <Stat label="KV revidiert" value={chf(t.kvRevidiert)} sub="Budget netto" />
        <Stat label="Beauftragt" value={chf(t.beauftragt)} sub="Verträge netto + NT + Teuerung" />
        <Stat label="Prognose" value={chf(t.prognose)} accent={t.abwKv > 0 ? "text-red-600" : "text-emerald-600"} sub={`davon Erwartung ${chf(t.erwartung)}`} />
        <Stat label="Bezahlt" value={chf(t.bezahlt)} sub={`offen ${chf(t.offen)}`} />
      </div>
      <div className={`${card} p-5`}>
        <div className="flex items-baseline justify-between mb-2"><h2 className="font-semibold">Prognose vs. Budget (KV)</h2><div>Abweichung: <Abw v={t.abwKv} /></div></div>
        <Ampel kv={t.kv} prognose={t.prognose} />
        <div className="flex justify-between text-xs text-stone-500 mt-1.5 tabular-nums"><span>KV-Budget: {chf(t.kv)}</span><span>Prognose: {chf(t.prognose)} · brutto {chf(ks.brutto)}</span></div>
      </div>
      <div className={`${card} p-5`}>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <h2 className="font-semibold">Kostenstand-Verlauf</h2>
          <button className={btnGhost} onClick={festhalten} title="Speichert den heutigen Kostenstand als Punkt in der Historie">📌 Kostenstand festhalten</button>
        </div>
        <KostenverlaufChart punkte={punkte} />
        {snaps.length > 0 && (
          <div className="mt-3 overflow-x-auto"><table className="w-full text-xs">

function VertraegeView({ d, dispatch, projektId, projekt, firmen, db }) {
  const rollen = projektRollen(db, projekt);
  const [offeneVertraege, setOffeneVertraege] = useState([]);
  const [vForm, setVForm] = useState(null);
  const [ntFor, setNtFor] = useState(null);
  const posOrder = useMemo(() => { const m = {}; orderedPositions(d.positionen).forEach((p, i) => { m[p.id] = i; }); return m; }, [d.positionen]);
  const garantieRows = d.vertraege.filter((v) => v.abnahme || Number(v.rueckbehaltPct) > 0 || v.garantieArt);
  // Flache Liste, rein nach Vertragsnummer (natürliche Zahlenfolge)
  const sorted = useMemo(() => [...d.vertraege].sort((a, b) =>
    String(a.nr || "zzz").localeCompare(String(b.nr || "zzz"), "de", { numeric: true, sensitivity: "base" })
    || String(a.unternehmer || "").localeCompare(String(b.unternehmer || ""), "de")
  ), [d.vertraege]);
  const totalBeauftragt = d.vertraege.reduce((s, v) => { const ntGen = d.nachtraege.filter((n) => n.vertragId === v.id && n.status === "genehmigt").reduce((a, n) => a + konditionenNetto(n.betrag, v, false), 0); return s + konditionenNetto(v.betrag, v, true) + ntGen + (Number(v.teuerung) || 0); }, 0);

  const rows = [];
  sorted.forEach((v) => {
    const pos = d.positionen.find((p) => p.id === v.positionId);
    const netto = konditionenNetto(v.betrag, v, true);
    const nts = d.nachtraege.filter((n) => n.vertragId === v.id);
    const ntGen = nts.filter((n) => n.status === "genehmigt").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
    const ntPend = nts.filter((n) => n.status === "pendent").reduce((s, n) => s + konditionenNetto(n.betrag, v, false), 0);
    const rapSum = d.rapporte.filter((r) => r.vertragId === v.id).reduce((s, r) => s + rapportNetto(r, v), 0);
    const regieUeber = Math.max(0, rapSum - (Number(v.regieBudget) || 0));
    const beauftragt = netto + ntGen + (Number(v.teuerung) || 0);
    const fakt = d.rechnungen.filter((r) => r.vertragId === v.id).reduce((s, r) => s + (Number(r.betrag) || 0), 0);
    const offen = offeneVertraege.includes(v.id);
    rows.push(
      <div key={v.id} className={card}>
        <button className="w-full text-left px-3 py-2.5 flex items-center gap-2.5 hover:bg-stone-50/70 rounded-xl" onClick={() => setOffeneVertraege(offen ? offeneVertraege.filter((x) => x !== v.id) : [...offeneVertraege, v.id])}>
          <span className={`text-stone-400 text-[10px] shrink-0 ${offen ? "rotate-90" : ""}`} style={{ display: "inline-block", transition: "transform .15s" }}>▶</span>
          <span className="shrink-0 inline-block bg-orange-50 text-orange-800 font-semibold tabular-nums text-xs rounded px-1.5 py-0.5">{pos ? pos.bkp : "—"}</span>
          <span className="font-medium tabular-nums text-sm shrink-0 whitespace-nowrap min-w-[58px]">{v.nr || "—"}</span>
          <span className="font-medium truncate flex-1 min-w-0">{v.unternehmer}</span>
          {v.pauschal ? <span className="text-[10px] bg-stone-100 text-stone-600 rounded px-1.5 py-0.5 shrink-0">pauschal</span> : null}
          <span className="text-xs text-stone-500 shrink-0 hidden md:inline w-[110px] text-right">{nts.length ? `${nts.length} NT · ${chf(ntGen)}` : "keine NT"}</span>
          <span className="text-xs text-stone-500 shrink-0 hidden sm:inline w-[80px] text-right">{beauftragt > 0 ? `${Math.round(100 * fakt / beauftragt)}% fakt.` : "–"}</span>
          <span className="tabular-nums font-semibold shrink-0 w-[92px] text-right">{chf(beauftragt)}</span>
        </button>
        {offen && <div className="px-4 pb-4 border-t border-stone-100 pt-3">
        <div className="flex items-start gap-3">

// Rechnungsbeleg: genau ein PDF je Rechnung, per Knopf oder Ziehen-und-Ablegen
// ---------- Werkvertrag, Zahlungsfreigabe und Listen als PDF ----------
// Wiederkehrende Bausteine für die Hochformat-Dokumente
function pdfStaffel(bl, zeilen, breite) {
  const rechts = breite - RAND;
  zeilen.forEach((z) => {
    bl.platz(18);
    if (z.trenner) { bl.linie(RAND, rechts, bl.y + 10, z.dick ? 1.2 : 0.4, z.dick ? PDFLib.rgb(0.13, 0.12, 0.11) : undefined); }
    bl.text(z.l, { size: z.fett ? 10 : 9, fett: z.fett, farbe: z.grau ? PDFLib.rgb(0.45, 0.42, 0.40) : undefined });
    if (z.wert !== undefined) bl.text((z.neg ? "- " : "") + chfPdf(z.wert), { rechts, size: z.fett ? 10 : 9, fett: z.fett, farbe: z.grau ? PDFLib.rgb(0.45, 0.42, 0.40) : undefined });
    else if (z.text !== undefined) bl.text(z.text, { rechts, size: 9 });
    bl.y -= z.fett ? 17 : 14;
  });
}
function pdfPaare(bl, paare, breite) {
  // zweispaltige Angabenliste
  const spalteB = (breite - 2 * RAND) / 2;
  let i = 0;
  paare.forEach((pr) => {
    const spalte = i % 2, x = RAND + spalte * spalteB;
    if (spalte === 0) bl.platz(16);
    bl.text(pr[0], { x, size: 8, farbe: PDFLib.rgb(0.45, 0.42, 0.40), y: bl.y });
    bl.text(pr[1], { x, size: 9.5, y: bl.y - 12 });
    if (spalte === 1 || i === paare.length - 1) bl.y -= 28;
    i++;
  });
}

async function baueWerkvertragPdf(v, ctx) {
  const { pos, projekt, rollen, firma, d, db: ctxDb } = ctx;
  const doc = await PDFLib.PDFDocument.create();
  const schriften = { normal: await doc.embedFont(PDFLib.StandardFonts.Helvetica), fett: await doc.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  const { v: vorlage, logoBild } = await pdfVorlage(doc, ctxDb, projekt);
  const grau = PDFLib.rgb(0.45, 0.42, 0.40);
  const bl = pdfBlatt(doc, schriften, A4, vorlage, logoBild);
  const rechts = A4.breite - RAND;
  pdfKopf(bl, v.pauschal ? "Werkvertrag (Pauschalvertrag)" : "Werkvertrag", projekt, rollen, `${v.nr || ""}  ·  ${v.datum || ""}`, vorlage);

  // Parteien
  const snap = v.firmaSnap || null;
  const bh = v.bauherrSnap || rollen;
  const spalteB = (rechts - RAND) / 2;
  const yStart = bl.y;
  bl.text("Bauherrschaft", { size: 7.5, farbe: grau, y: yStart });
  bl.text(bh.bauherr || "", { size: 10.5, fett: true, y: yStart - 14 });
  bl.text(bh.bauherrAdresse || "", { size: 9, farbe: grau, y: yStart - 27 });
  if (bh.bauherrPerson) bl.text(bh.bauherrPerson, { size: 9, farbe: grau, y: yStart - 39 });
  const uName = snap?.name || v.unternehmer || "";
  const uAdr = snap ? [snap.strasse, [snap.plz, snap.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ") : firmaAdresse(firma);
  bl.text("Unternehmer", { x: RAND + spalteB, size: 7.5, farbe: grau, y: yStart });
  bl.text(uName, { x: RAND + spalteB, size: 10.5, fett: true, y: yStart - 14 });
  if (uAdr) bl.text(uAdr, { x: RAND + spalteB, size: 9, farbe: grau, y: yStart - 27 });
  if (snap?.kontakt) bl.text(snap.kontakt + (snap.telefon ? " · " + snap.telefon : ""), { x: RAND + spalteB, size: 9, farbe: grau, y: yStart - 39 });
  if (snap?.mwstNr) bl.text(snap.mwstNr, { x: RAND + spalteB, size: 8, farbe: grau, y: yStart - 51 });
  bl.y = yStart - 68;

  // Gegenstand
  bl.text("Gegenstand", { size: 7.5, farbe: grau }); bl.y -= 13;
  bl.umbruch(`Arbeitsgattung ${pos ? `BKP ${pos.bkp} ${pos.bezeichnung}` : "—"} gemäss Leistungsverzeichnis und den Bestimmungen der Norm SIA 118.`
    + (v.pauschal ? " Die Vergütung erfolgt als Pauschalvertrag; das Ausmass ist nicht massgebend." : ""), rechts - RAND, 9.5).forEach((t) => { bl.text(t, { size: 9.5 }); bl.y -= 13; });
  bl.y -= 10;

  // Vergütung — volle Abzugsstaffel
  const b = Number(v.betrag) || 0;
  const s1 = b * (1 - (Number(v.rabattPct) || 0) / 100);
  const s2 = s1 - (Number(v.pauschalabzug) || 0);
  const s3 = s2 * (1 - (Number(v.skontoPct) || 0) / 100);
  const s4 = s3 * (1 - (Number(v.bauabzuegePct) || 0) / 100);
  const netto = s4 + (Number(v.rundung) || 0);
  bl.text("Vergütung (exkl. MwSt)", { size: 7.5, farbe: grau }); bl.y -= 14;
  pdfStaffel(bl, [
    { l: "Vertragssumme brutto", wert: b, trenner: true },
    { l: `Rabatt ${Number(v.rabattPct) || 0}%`, wert: b - s1, neg: true, grau: true },
    { l: "Pauschalabzug", wert: s1 - s2, neg: true, grau: true },
    { l: `Skonto ${Number(v.skontoPct) || 0}%`, wert: s2 - s3, neg: true, grau: true },
    { l: `Allg. Bauabzüge ${Number(v.bauabzuegePct) || 0}%`, wert: s3 - s4, neg: true, grau: true },
    { l: "Rundung", wert: Number(v.rundung) || 0, grau: true },
    { l: "Werkvertragssumme netto", wert: netto, fett: true, trenner: true, dick: true },
  ], A4.breite);
  bl.y -= 12;

  // Konditionenblock
  bl.text("Konditionen", { size: 7.5, farbe: grau }); bl.y -= 16;
  const gBis = garantieBis(v);
  pdfPaare(bl, [
    ["Vertragsart", v.pauschal ? "Pauschalvertrag" : "Einheitspreisvertrag"],
    ["Teuerung", Number(v.teuerung) ? "CHF " + chfPdf(v.teuerung) : "keine"],
    ["Regiebudget im Vertrag", Number(v.regieBudget) ? "CHF " + chfPdf(v.regieBudget) + " netto" : "keines"],
    ["Rückbehalt", Number(v.rueckbehaltPct) ? `${v.rueckbehaltPct}%  (CHF ${chfPdf(netto * v.rueckbehaltPct / 100)})` : "keiner"],
    ["Garantieart", garantieArtLabel(v.garantieArt)],
    ["Garantiefrist", `${Number(v.garantieJahre) || 0} Jahre${gBis ? "  ·  bis " + gBis : ""}`],
    ["Abnahmedatum", v.abnahme || "offen"],
    ["Vertragsdatum", v.datum || "—"],
  ], A4.breite);

  // Unterschriften
  bl.y = Math.max(bl.y - 20, RAND + 70);
  const uB = (rechts - RAND - 40) / 2;
  bl.linie(RAND, RAND + uB, bl.y);
  bl.linie(RAND + uB + 40, rechts, bl.y);
  bl.text("Bauherrschaft: " + (bh.bauherr || ""), { size: 8, farbe: grau, y: bl.y - 12 });
  bl.text("Unternehmer: " + uName, { x: RAND + uB + 40, size: 8, farbe: grau, y: bl.y - 12 });
  bl.abschliessen();
  return doc.save();
}
